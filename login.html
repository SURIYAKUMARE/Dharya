<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome — Dharya</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif}

    /* ══ BODY ══ */
    body{
      background:var(--bg,#0e0020);
      display:flex;align-items:center;justify-content:center;
      transition:background 1.2s ease;
      position:relative;
    }
    body.theme-green{ --bg:#020f07; }
    body.theme-pink { --bg:#12001a; }

    /* animated bg glow */
    #bg-glow{
      position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, var(--g-a,#2a0a45) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 60%, var(--g-b,#1a0330) 0%, transparent 55%);
      transition:background 1.2s ease;
      animation:bgpulse 9s ease-in-out infinite alternate;
    }
    body.theme-green #bg-glow{
      background:
        radial-gradient(ellipse 80% 60% at 15% 40%, #001f0a 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 80% 65%, #002010 0%, transparent 55%);
    }
    body.theme-pink #bg-glow{
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, #2a0020 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 60%, #1a0030 0%, transparent 55%);
    }
    @keyframes bgpulse{from{opacity:.85}to{opacity:1}}

    /* ══ STAR CANVAS ══ */
    #stars{position:fixed;inset:0;z-index:1;pointer-events:none;}

    /* ══ SHOOTING STARS ══ */
    #shoots{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
    .shoot{
      position:absolute;border-radius:999px;transform-origin:left center;opacity:0;
      animation:shootfly var(--sd,1.1s) var(--sl,0s) linear forwards;
    }
    @keyframes shootfly{
      0%  {opacity:0;  transform:rotate(var(--sa,-30deg)) translateX(0);}
      8%  {opacity:1;}
      80% {opacity:.85;}
      100%{opacity:0;  transform:rotate(var(--sa,-30deg)) translateX(var(--st,500px));}
    }

    /* ══ FLOATING STARS (emoji) ══ */
    .fstar{
      position:fixed;pointer-events:none;z-index:2;user-select:none;
      font-size:var(--fs,1rem);opacity:var(--fo,.18);
      filter:drop-shadow(0 0 4px var(--fc,rgba(255,220,100,.5)));
      animation:fstf var(--ff,8s) var(--fd,0s) ease-in-out infinite alternate;
    }
    @keyframes fstf{
      from{transform:translateY(0) rotate(-8deg) scale(1);}
      to  {transform:translateY(-20px) rotate(10deg) scale(1.08);}
    }

    /* ══ CURSOR SPARKS ══ */
    .spark{
      position:fixed;border-radius:50%;pointer-events:none;z-index:400;
      animation:sparkout .7s ease-out forwards;
    }
    @keyframes sparkout{
      0%  {transform:scale(1) translate(-50%,-50%);opacity:.9;}
      100%{transform:scale(0) translate(-50%,-50%);opacity:0;}
    }

    /* ══ PHONE CARD ══ */
    .wrap{position:relative;z-index:20;perspective:1400px;}
    .phone{
      width:355px;
      background:linear-gradient(160deg,#1c1030 0%,#130820 55%,#0e0618 100%);
      border-radius:36px;
      border:1px solid rgba(255,255,255,.07);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 50px 120px rgba(0,0,0,.9),
        0 0 80px var(--phone-glow,rgba(200,60,255,.08)),
        inset 0 1px 0 rgba(255,255,255,.09),
        inset 0 -1px 0 rgba(0,0,0,.5);
      padding:36px 32px 26px;
      display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;
      animation:phonefloat 6s ease-in-out infinite;
      transition:box-shadow 1s;
    }
    body.theme-green .phone{--phone-glow:rgba(0,255,120,.1);}
    body.theme-pink  .phone{--phone-glow:rgba(255,0,150,.12);}

    @keyframes phonefloat{
      0%,100%{transform:translateY(0) rotateX(1deg);}
      50%    {transform:translateY(-10px) rotateX(-1deg);}
    }
    /* shimmer */
    .phone::after{
      content:'';position:absolute;inset:0;border-radius:36px;pointer-events:none;
      background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.025) 50%,transparent 65%);
      background-size:200% 100%;animation:shimmer 5s ease-in-out infinite;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* top dots */
    .pdots{position:absolute;top:14px;right:16px;display:flex;gap:5px;}
    .pdots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);}
    .pdots span:last-child{
      background:var(--dot-col,rgba(255,80,180,.8));
      box-shadow:0 0 6px var(--dot-col,rgba(255,80,180,.7));
      transition:background .8s,box-shadow .8s;
    }
    body.theme-green .pdots span:last-child{--dot-col:rgba(0,255,120,.8);}
    body.theme-pink  .pdots span:last-child{--dot-col:rgba(255,50,160,.8);}

    /* inner top glow */
    .phone::before{
      content:'';position:absolute;top:-70px;left:50%;transform:translateX(-50%);
      width:220px;height:220px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,var(--icon-glow,rgba(255,80,180,.14)) 0%,transparent 70%);
      animation:topglow 4s ease-in-out infinite alternate;
      transition:background .9s;
    }
    body.theme-green .phone::before{--icon-glow:rgba(0,255,120,.12);}
    body.theme-pink  .phone::before{--icon-glow:rgba(255,50,180,.16);}
    @keyframes topglow{from{opacity:.6;transform:translateX(-50%) scale(1);}to{opacity:1;transform:translateX(-50%) scale(1.18);}}

    /* ══ APP ICON ══ */
    .icon-wrap{position:relative;width:82px;height:82px;margin-bottom:16px;}
    .icon-bg{
      width:82px;height:82px;border-radius:22px;
      background:var(--icon-grad, linear-gradient(135deg,#ff4d8b,#e040fb));
      display:flex;align-items:center;justify-content:center;font-size:2.2rem;
      box-shadow:
        0 10px 36px var(--icon-shadow,rgba(255,60,160,.55)),
        0 2px 10px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.35);
      animation:iconbob 3.2s ease-in-out infinite;
      position:relative;z-index:2;
      transition:background .9s,box-shadow .9s;
    }
    body.theme-green .icon-bg{
      background:linear-gradient(135deg,#00e676,#00bfa5);
      box-shadow:0 10px 36px rgba(0,230,118,.5),0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);
    }
    body.theme-pink .icon-bg{
      background:linear-gradient(135deg,#ff4d8b,#e040fb);
      box-shadow:0 10px 36px rgba(255,60,160,.55),0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);
    }
    @keyframes iconbob{
      0%,100%{transform:scale(1) rotate(0deg);}
      50%    {transform:scale(1.07) rotate(-4deg);}
    }
    /* ring */
    .icon-ring{
      position:absolute;inset:-10px;border-radius:30px;
      border:1.5px solid var(--ring-col,rgba(255,80,180,.3));
      animation:iconring 4s linear infinite;
      transition:border-color .9s;
    }
    body.theme-green .icon-ring{--ring-col:rgba(0,255,120,.35);}
    body.theme-pink  .icon-ring{--ring-col:rgba(255,50,180,.4);}
    @keyframes iconring{to{transform:rotate(360deg);}}
    .icon-ring2{
      position:absolute;inset:-18px;border-radius:36px;
      border:1px dashed var(--ring2-col,rgba(255,80,180,.15));
      animation:iconring2 7s linear infinite reverse;
      transition:border-color .9s;
    }
    body.theme-green .icon-ring2{--ring2-col:rgba(0,255,120,.18);}
    body.theme-pink  .icon-ring2{--ring2-col:rgba(255,50,180,.2);}
    @keyframes iconring2{to{transform:rotate(360deg);}}

    /* ══ BADGE ══ */
    .badge{
      display:flex;align-items:center;gap:8px;margin-bottom:10px;
      animation:badgein .7s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes badgein{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
    .bline{
      width:22px;height:1px;
      background:linear-gradient(90deg,transparent,var(--accent,#e040fb));
      transition:background .9s;
    }
    .bline.r{background:linear-gradient(90deg,var(--accent,#e040fb),transparent);}
    body.theme-green .bline   {background:linear-gradient(90deg,transparent,#00e676);}
    body.theme-green .bline.r {background:linear-gradient(90deg,#00e676,transparent);}
    body.theme-pink  .bline   {background:linear-gradient(90deg,transparent,#ff4d8b);}
    body.theme-pink  .bline.r {background:linear-gradient(90deg,#ff4d8b,transparent);}
    .badge-txt{
      font-size:.6rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
      color:var(--accent-txt,#e040fb);transition:color .9s;
    }
    body.theme-green .badge-txt{color:#00e676;}
    body.theme-pink  .badge-txt{color:#ff4d8b;}
    .bdot{
      width:5px;height:5px;border-radius:50%;
      background:var(--accent-txt,#e040fb);
      box-shadow:0 0 8px var(--accent-txt,#e040fb);
      animation:bdpulse 1.4s ease-in-out infinite alternate;
      transition:background .9s,box-shadow .9s;
    }
    body.theme-green .bdot{background:#00e676;box-shadow:0 0 8px #00e676;}
    body.theme-pink  .bdot{background:#ff4d8b;box-shadow:0 0 8px #ff4d8b;}
    @keyframes bdpulse{from{transform:scale(1);opacity:.5}to{transform:scale(2);opacity:1}}

    /* ══ TITLE ══ */
    .ctitle{
      font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;
      font-size:2rem;line-height:1.2;text-align:center;
      color:#fff;margin-bottom:8px;min-height:2.5em;
      text-shadow:0 0 30px var(--title-glow,rgba(255,80,180,.5));
      transition:text-shadow .9s;
    }
    body.theme-green .ctitle{text-shadow:0 0 30px rgba(0,230,118,.6),0 0 60px rgba(0,200,100,.2);}
    body.theme-pink  .ctitle{text-shadow:0 0 30px rgba(255,80,160,.6),0 0 60px rgba(255,0,150,.2);}
    /* name in accent colour */
    .ctitle-name{
      display:block;
      color:var(--name-col,#e040fb);
      transition:color .9s;
      filter:drop-shadow(0 0 10px currentColor);
    }
    body.theme-green .ctitle-name{color:#00e676;}
    body.theme-pink  .ctitle-name{color:#ff4d8b;}
    .cur{
      display:inline-block;width:2px;height:.85em;
      background:currentColor;margin-left:1px;vertical-align:text-bottom;
      animation:curblink 1s step-end infinite;
    }
    @keyframes curblink{0%,100%{opacity:1}50%{opacity:0}}

    /* ══ SUBTITLE ══ */
    .csub{
      font-size:.8rem;color:rgba(255,255,255,.4);
      text-align:center;letter-spacing:.02em;
      margin-bottom:22px;min-height:1.2em;
    }

    /* ══ DIVIDER ══ */
    .hdiv{
      width:100%;height:1px;margin-bottom:20px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
    }

    /* ══ FIELDS ══ */
    .field{width:100%;margin-bottom:12px;position:relative;}
    .field-lbl{
      display:block;font-size:.6rem;font-weight:700;
      letter-spacing:.18em;text-transform:uppercase;
      color:rgba(255,255,255,.38);margin-bottom:7px;
      transition:color .4s,letter-spacing .3s;
    }
    .field:focus-within .field-lbl{
      color:var(--accent-txt,#e040fb);letter-spacing:.24em;
    }
    body.theme-green .field:focus-within .field-lbl{color:#00e676;}
    body.theme-pink  .field:focus-within .field-lbl{color:#ff4d8b;}

    /* USERNAME — white bg */
    .field-uid input{
      width:100%;padding:13px 16px;border-radius:12px;
      border:1.5px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.93);
      color:#1a0828;font-size:.96rem;font-family:'Inter',sans-serif;font-weight:600;
      outline:none;letter-spacing:.04em;
      transition:box-shadow .35s,border-color .3s,transform .2s;
    }
    .field-uid input::placeholder{color:rgba(100,70,130,.35);font-weight:400;}
    .field-uid input:focus{
      background:#fff;border-color:var(--accent-txt,#e040fb);
      box-shadow:0 0 0 3px var(--focus-ring,rgba(224,64,251,.22)),0 6px 20px rgba(200,60,255,.12);
      transform:translateY(-1px);
    }
    body.theme-green .field-uid input:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.2),0 6px 20px rgba(0,200,100,.1);}
    body.theme-pink  .field-uid input:focus{border-color:#ff4d8b;box-shadow:0 0 0 3px rgba(255,77,139,.2),0 6px 20px rgba(255,0,150,.1);}

    /* PASSWORD — dark bg */
    .field-pw input{
      width:100%;padding:13px 44px 13px 16px;border-radius:12px;
      border:1.5px solid rgba(255,255,255,.1);
      background:rgba(20,10,35,.85);
      color:#fff;font-size:.96rem;font-family:'Inter',sans-serif;font-weight:500;
      outline:none;letter-spacing:.08em;
      transition:box-shadow .35s,border-color .3s,transform .2s;
    }
    .field-pw input::placeholder{color:rgba(255,255,255,.2);}
    .field-pw input:focus{
      border-color:var(--accent-txt,#e040fb);
      box-shadow:0 0 0 3px var(--focus-ring,rgba(224,64,251,.18)),0 6px 20px rgba(200,60,255,.1);
      transform:translateY(-1px);
    }
    body.theme-green .field-pw input:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.18);}
    body.theme-pink  .field-pw input:focus{border-color:#ff4d8b;box-shadow:0 0 0 3px rgba(255,77,139,.18);}

    .eye-btn{
      position:absolute;right:13px;bottom:13px;
      background:none;border:none;cursor:pointer;font-size:.95rem;
      color:rgba(255,255,255,.3);padding:0;line-height:1;
      transition:color .25s,transform .2s;
    }
    .eye-btn:hover{color:rgba(255,255,255,.7);transform:scale(1.2);}

    /* ══ DETECTED BADGE ══ */
    .detected{
      font-size:.76rem;font-weight:700;
      color:var(--accent-txt,#e040fb);
      display:none;align-items:center;gap:6px;
      margin-top:8px;margin-bottom:2px;
      animation:detpop .4s cubic-bezier(.175,.885,.32,1.275);
    }
    body.theme-green .detected{color:#00e676;}
    body.theme-pink  .detected{color:#ff4d8b;}
    .detected.show{display:flex;}
    @keyframes detpop{from{opacity:0;transform:scale(.8) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .det-dot{
      width:8px;height:8px;border-radius:50%;
      background:currentColor;box-shadow:0 0 8px currentColor;
      animation:detdotpulse 1s ease-in-out infinite alternate;
    }
    @keyframes detdotpulse{from{transform:scale(1)}to{transform:scale(1.6)}}

    /* ══ ENTER BUTTON ══ */
    .enter-btn{
      width:100%;padding:15px 20px;border:none;border-radius:14px;
      margin-top:10px;font-size:1rem;font-weight:700;
      font-family:'Inter',sans-serif;letter-spacing:.05em;
      cursor:pointer;position:relative;overflow:hidden;
      background:var(--btn-grad,linear-gradient(90deg,#ff4d8b,#e040fb));
      color:#fff;
      box-shadow:0 8px 32px var(--btn-shadow,rgba(255,60,180,.55)),0 2px 8px rgba(0,0,0,.35);
      transition:transform .22s,box-shadow .3s,background .9s;
      display:flex;align-items:center;justify-content:center;gap:10px;
      animation:btnpulse 3s ease-in-out infinite;
    }
    body.theme-green .enter-btn{
      background:linear-gradient(90deg,#00e676,#00bfa5);
      box-shadow:0 8px 32px rgba(0,230,118,.5),0 2px 8px rgba(0,0,0,.35);
    }
    body.theme-pink .enter-btn{
      background:linear-gradient(90deg,#ff4d8b,#e040fb);
      box-shadow:0 8px 32px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.35);
    }
    @keyframes btnpulse{
      0%,100%{box-shadow:0 8px 32px var(--btn-shadow,rgba(255,60,180,.55)),0 2px 8px rgba(0,0,0,.35);}
      50%    {box-shadow:0 12px 44px var(--btn-shadow,rgba(255,60,180,.75)),0 2px 8px rgba(0,0,0,.35),0 0 0 6px var(--btn-ring,rgba(255,60,180,.1));}
    }
    body.theme-green .enter-btn{animation:btnpulseG 3s ease-in-out infinite;}
    body.theme-pink  .enter-btn{animation:btnpulseP 3s ease-in-out infinite;}
    @keyframes btnpulseG{0%,100%{box-shadow:0 8px 32px rgba(0,230,118,.5),0 2px 8px rgba(0,0,0,.35);}50%{box-shadow:0 12px 44px rgba(0,230,118,.75),0 2px 8px rgba(0,0,0,.35),0 0 0 6px rgba(0,230,118,.1);}}
    @keyframes btnpulseP{0%,100%{box-shadow:0 8px 32px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.35);}50%{box-shadow:0 12px 44px rgba(255,60,180,.75),0 2px 8px rgba(0,0,0,.35),0 0 0 6px rgba(255,60,180,.1);}}
    .enter-btn:hover{transform:translateY(-3px) scale(1.015);animation:none;}
    .enter-btn:active{transform:scale(.98);}
    /* shine */
    .enter-btn::before{
      content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
      transform:skewX(-18deg);animation:btnshine 3.5s ease-in-out infinite;
    }
    @keyframes btnshine{0%{left:-80%}35%,100%{left:140%;}}
    .btn-txt{position:relative;z-index:1;}
    .btn-arr{position:relative;z-index:1;animation:arrbounce 1.4s ease-in-out infinite;}
    @keyframes arrbounce{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

    /* ripple */
    .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:ripa .65s linear;pointer-events:none;}
    @keyframes ripa{to{transform:scale(5);opacity:0;}}

    /* ══ MESSAGE ══ */
    .msg{
      width:100%;font-size:.78rem;font-weight:600;border-radius:11px;
      padding:10px 14px;margin-top:10px;text-align:center;display:none;
      animation:msgpop .38s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes msgpop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
    .msg.err{background:rgba(255,50,80,.14);border:1px solid rgba(255,50,80,.4);color:#ff7080;}
    .msg.ok {background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.35);color:#00e676;}

    /* ══ CARD FOOTER ══ */
    .cfooter{
      margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:7px;
    }
    .cfooter-txt{
      display:flex;align-items:center;gap:8px;
      color:rgba(255,255,255,.16);font-size:.6rem;letter-spacing:.08em;
    }
    .cfooter-txt span{width:16px;height:1px;background:rgba(255,255,255,.12);display:block;}
    .fdots{display:flex;gap:5px;}
    .fdots b{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);display:block;}
    .fdots b.act{
      background:var(--accent-txt,#e040fb);
      box-shadow:0 0 5px var(--accent-txt,#e040fb);
      transition:background .9s,box-shadow .9s;
    }
    body.theme-green .fdots b.act{background:#00e676;box-shadow:0 0 5px #00e676;}
    body.theme-pink  .fdots b.act{background:#ff4d8b;box-shadow:0 0 5px #ff4d8b;}

    /* ══ WELCOME OVERLAY ══ */
    #ov{
      position:fixed;inset:0;z-index:300;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:18px;
      opacity:0;pointer-events:none;
      transition:opacity .7s,backdrop-filter .7s;
    }
    #ov.show{
      opacity:1;pointer-events:all;
      backdrop-filter:blur(16px) brightness(.42) saturate(1.6);
      -webkit-backdrop-filter:blur(16px) brightness(.42) saturate(1.6);
    }
    .ov-icon{font-size:4rem;animation:ovspin 2.2s ease-in-out infinite;}
    @keyframes ovspin{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(14deg) scale(1.22)}}
    .ov-line1{
      font-family:'Playfair Display',serif;font-style:italic;font-weight:900;
      font-size:clamp(2rem,6vw,3.8rem);text-align:center;color:#fff;
      text-shadow:0 0 40px currentColor;
    }
    .ov-line2{
      font-family:'Playfair Display',serif;font-style:italic;font-weight:900;
      font-size:clamp(2.2rem,7vw,4.5rem);text-align:center;
      color:var(--accent-txt,#e040fb);
      filter:drop-shadow(0 0 30px currentColor);
      animation:ovglow 1.8s ease-in-out infinite alternate;
      min-height:1.2em;transition:color .9s;
    }
    body.theme-green #ov .ov-line2{color:#00e676;}
    body.theme-pink  #ov .ov-line2{color:#ff4d8b;}
    @keyframes ovglow{from{filter:drop-shadow(0 0 18px currentColor)}to{filter:drop-shadow(0 0 50px currentColor)}}
    .ov-sub{font-size:.88rem;color:rgba(255,255,255,.38);letter-spacing:.24em;text-transform:uppercase;}
    .ov-tap{font-size:.67rem;color:rgba(255,255,255,.17);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;animation:otap 2.2s ease-in-out infinite;}
    @keyframes otap{0%,100%{opacity:.17}50%{opacity:.5}}

    /* ══ CONFETTI ══ */
    .confetti{
      position:fixed;pointer-events:none;z-index:200;
      animation:cfall var(--cd,2s) var(--cde,0s) ease-out forwards;
    }
    @keyframes cfall{
      0%  {transform:translate(0,0) rotate(0) scale(1);opacity:1;}
      100%{transform:translate(var(--cx,0),130vh) rotate(900deg) scale(.1);opacity:0;}
    }

    @media(max-width:400px){.phone{width:94vw;padding:28px 18px 22px;}}
  </style>
</head>
<body>

  <div id="bg-glow"></div>
  <canvas id="stars"></canvas>
  <div id="shoots"></div>

  <!-- Floating themed stars -->
  <div class="fstar" style="top:14%;left:6%;  --fs:1.4rem;--fo:.2; --ff:7s; --fd:0s;  --fc:rgba(255,150,255,.4);">★</div>
  <div class="fstar" style="top:55%;left:4%;  --fs:1rem;  --fo:.16;--ff:9s; --fd:2s;  --fc:rgba(255,150,255,.3);">✦</div>
  <div class="fstar" style="top:76%;left:9%;  --fs:1.6rem;--fo:.18;--ff:6s; --fd:1s;  --fc:rgba(255,150,255,.35);">⭐</div>
  <div class="fstar" style="top:25%;right:6%; --fs:1.2rem;--fo:.2; --ff:8s; --fd:3s;  --fc:rgba(255,150,255,.35);">✦</div>
  <div class="fstar" style="top:62%;right:5%; --fs:1.4rem;--fo:.16;--ff:11s;--fd:0.5s;--fc:rgba(255,150,255,.3);">★</div>
  <div class="fstar" style="top:40%;right:13%;--fs:.9rem; --fo:.13;--ff:5s; --fd:4s;  --fc:rgba(200,255,200,.3);">⭐</div>
  <div class="fstar" style="top:84%;right:15%;--fs:1.2rem;--fo:.17;--ff:7s; --fd:1.5s;--fc:rgba(255,150,255,.3);">✦</div>
  <div class="fstar" style="top:8%; left:44%; --fs:.8rem; --fo:.11;--ff:10s;--fd:2.5s;--fc:rgba(255,220,100,.4);">★</div>
  <div class="fstar" style="top:70%;left:20%; --fs:1rem;  --fo:.14;--ff:8s; --fd:5s;  --fc:rgba(200,255,200,.3);">✦</div>
  <div class="fstar" style="top:32%;right:27%;--fs:1.3rem;--fo:.12;--ff:12s;--fd:3.5s;--fc:rgba(255,150,255,.3);">⭐</div>

  <!-- Welcome overlay -->
  <div id="ov">
    <div class="ov-icon" id="ov-icon">✨</div>
    <div class="ov-line1">Welcome back,</div>
    <div class="ov-line2" id="ov-name"></div>
    <div class="ov-sub">Your world is ready ✦</div>
    <div class="ov-tap">tap anywhere to continue</div>
  </div>

  <!-- PHONE CARD -->
  <div class="wrap">
    <div class="phone" id="phone">

      <div class="pdots"><span></span><span></span><span></span></div>

      <!-- Icon -->
      <div class="icon-wrap">
        <div class="icon-ring2"></div>
        <div class="icon-ring"></div>
        <div class="icon-bg" id="icon-bg">🌿</div>
      </div>

      <!-- Badge -->
      <div class="badge">
        <div class="bdot"></div>
        <div class="bline"></div>
        <span class="badge-txt">Back Again</span>
        <div class="bline r"></div>
        <div class="bdot"></div>
      </div>

      <!-- Title -->
      <h1 class="ctitle">
        Welcome back,<br>
        <span class="ctitle-name" id="ctitle-name"><span id="tname">?</span><span class="cur"></span></span>
      </h1>

      <!-- Subtitle -->
      <p class="csub" id="csub">Your special world is waiting ✨</p>

      <div class="hdiv"></div>

      <!-- USERNAME -->
      <div class="field field-uid">
        <label class="field-lbl">Username</label>
        <input type="text" id="uid" placeholder="Enter username"
               autocomplete="off" spellcheck="false" oninput="onUID(this.value)"/>
      </div>

      <!-- PASSWORD -->
      <div class="field field-pw">
        <label class="field-lbl">Password</label>
        <input type="password" id="pw" placeholder="••••••••••"
               autocomplete="off" spellcheck="false" oninput="onPW(this.value)"/>
        <button class="eye-btn" id="eye" onclick="togglePw()">👁</button>
      </div>

      <!-- Detected badge -->
      <div class="detected" id="detected">
        <div class="det-dot"></div>
        <span id="det-txt">Dharya detected ✓</span>
      </div>

      <!-- Enter button -->
      <button class="enter-btn" id="btn" onclick="login()">
        <span class="btn-txt">Enter my world</span>
        <span class="btn-arr">→</span>
      </button>

      <div class="msg" id="msg"></div>

      <!-- Footer -->
      <div class="cfooter">
        <div class="cfooter-txt">
          <span></span>Only someone special knows the way in<span></span>
        </div>
        <div class="fdots"><b></b><b class="act"></b><b></b></div>
      </div>
    </div>
  </div>

<script>
/* ═══════════════════════════
   USERS
═══════════════════════════ */
const USERS = {
  dharya:  {id:'DHARYA', pw:'09/10/2007', theme:'green', emoji:'🌿', name:'Surya',   sub:'Your private space is ready 🌿',  greet:'Surya'},
  sadhana: {id:'DHARYA', pw:'29/02/2008', theme:'pink',  emoji:'❤️',  name:'Sadhana', sub:'Your special world is waiting ✨', greet:'Sadhana'},
};
let currentUser = null;

/* ═══════════════════════════
   STAR CANVAS
═══════════════════════════ */
const sc=document.getElementById('stars'), sx=sc.getContext('2d');
let sw,sh;
function rsz(){sw=sc.width=innerWidth;sh=sc.height=innerHeight;}
rsz(); addEventListener('resize',rsz);
const STARS=Array.from({length:300},()=>({
  x:Math.random(),y:Math.random(),
  r:Math.random()*2.2+.2,
  a:Math.random(),
  da:(Math.random()*.007+.002)*(Math.random()>.5?1:-1),
  base:Math.random()*.4+.04,
  warm:Math.random()>.75,
}));
function drawStars(){
  sx.clearRect(0,0,sw,sh);
  STARS.forEach(s=>{
    s.a+=s.da; if(s.a>1||s.a<0)s.da*=-1;
    const a=(s.base*Math.abs(s.a)).toFixed(3);
    sx.beginPath();
    sx.arc(s.x*sw,s.y*sh,s.r,0,Math.PI*2);
    if(s.warm) sx.fillStyle=`rgba(255,180,255,${a})`;
    else sx.fillStyle=`rgba(255,255,255,${a})`;
    sx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ═══════════════════════════
   SHOOTING STARS
═══════════════════════════ */
const sl=document.getElementById('shoots');
function spawnShoot(forced){
  const el=document.createElement('div'); el.className='shoot';
  const len=Math.random()*300+80, travel=Math.random()*600+350;
  const dur=(Math.random()*1.1+.6).toFixed(2);
  const delay=forced?0:(Math.random()*4).toFixed(2);
  const angle=-(Math.random()*28+8);
  // colour based on theme
  let c='rgba(255,255,255,.9)';
  if(currentUser==='dharya')  c='rgba(100,255,180,.9)';
  if(currentUser==='sadhana') c='rgba(255,100,200,.9)';
  el.style.cssText=`
    width:${len}px;height:${Math.random()>.4?1.5:2}px;
    top:${Math.random()*72}%;left:${Math.random()*80}%;
    border-radius:999px;
    --sa:${angle}deg;--st:${travel}px;--sd:${dur}s;--sl:${delay}s;
    background:linear-gradient(90deg,transparent 0%,${c.replace('.9',',.4')} 30%,${c} 100%);
    box-shadow:0 0 8px 1px ${c.replace('.9',',.35')};
  `;
  sl.appendChild(el);
  setTimeout(()=>el.remove(),(parseFloat(dur)+parseFloat(delay))*1000+500);
}
(function sloop(){spawnShoot(false);setTimeout(sloop,Math.random()*700+180);})();

/* ═══════════════════════════
   3D TILT
═══════════════════════════ */
const phone=document.getElementById('phone');
addEventListener('mousemove',e=>{
  const dx=(e.clientX-innerWidth/2)/(innerWidth/2);
  const dy=(e.clientY-innerHeight/2)/(innerHeight/2);
  phone.style.animation='none';
  phone.style.transform=`rotateX(${-dy*7}deg) rotateY(${dx*7}deg) translateZ(12px)`;
});
addEventListener('mouseleave',()=>{
  phone.style.transition='transform .9s ease';
  phone.style.transform='';
  setTimeout(()=>{phone.style.animation='phonefloat 6s ease-in-out infinite';phone.style.transition='';},920);
});

/* ═══════════════════════════
   CURSOR SPARKS
═══════════════════════════ */
addEventListener('mousemove',e=>{
  if(Math.random()>.28)return;
  const sp=document.createElement('div'); sp.className='spark';
  let c=currentUser==='dharya' ?`rgba(${Math.floor(100+Math.random()*80)},255,${Math.floor(140+Math.random()*80)},.85)`
       :currentUser==='sadhana'?`rgba(255,${Math.floor(80+Math.random()*80)},${Math.floor(180+Math.random()*60)},.85)`
       :`rgba(255,255,255,.5)`;
  sp.style.cssText=`width:${Math.random()*5+3}px;height:${Math.random()*5+3}px;
    left:${e.clientX}px;top:${e.clientY}px;
    background:${c};box-shadow:0 0 8px ${c};`;
  document.body.appendChild(sp);
  setTimeout(()=>sp.remove(),750);
});

/* ═══════════════════════════
   APPLY THEME
═══════════════════════════ */
function applyTheme(key){
  if(currentUser===key)return;
  currentUser=key;
  const u=USERS[key];
  document.body.className='theme-'+u.theme;

  // icon
  document.getElementById('icon-bg').textContent=u.emoji;

  // title name — typewrite
  typeEl(document.getElementById('tname'), u.name);

  // subtitle
  document.getElementById('csub').textContent=u.sub;

  // detected
  const det=document.getElementById('detected');
  document.getElementById('det-txt').textContent=u.name+' detected ✓';
  det.classList.add('show');

  // burst shoots
  for(let i=0;i<8;i++) setTimeout(()=>spawnShoot(true),i*80);

  // flash
  flashScreen(u.theme);
}

function resetTheme(){
  currentUser=null;
  document.body.className='';
  document.getElementById('icon-bg').textContent='🌿';
  document.getElementById('tname').textContent='?';
  document.getElementById('csub').textContent='Your special world is waiting ✨';
  document.getElementById('detected').classList.remove('show');
}

/* ═══════════════════════════
   TYPEWRITER
═══════════════════════════ */
let tto=null;
function typeEl(el,text){
  clearTimeout(tto); el.textContent=''; let i=0;
  (function t(){if(i<=text.length){el.textContent=text.slice(0,i++);tto=setTimeout(t,55);}})();
}

/* ═══════════════════════════
   FLASH
═══════════════════════════ */
function flashScreen(th){
  const f=document.createElement('div');
  const c=th==='green'?'rgba(0,230,118,.06)':'rgba(255,60,180,.07)';
  f.style.cssText=`position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:${c};animation:fout .6s ease-out forwards;`;
  const s=document.createElement('style');
  s.textContent='@keyframes fout{from{opacity:1}to{opacity:0}}';
  document.head.appendChild(s); document.body.appendChild(f);
  setTimeout(()=>{f.remove();s.remove();},700);
}

/* ═══════════════════════════
   INPUT HANDLERS
═══════════════════════════ */
function onUID(val){
  clearMsg();
  const v=val.trim().toUpperCase();
  if(!v){resetTheme();return;}
  // detect from existing pw if already filled
  const pw=document.getElementById('pw').value.trim();
  const byBoth=Object.entries(USERS).find(([,u])=>u.id===v&&u.pw===pw);
  if(byBoth){applyTheme(byBoth[0]);return;}
  const byId=Object.entries(USERS).find(([,u])=>u.id===v);
  if(byId) applyTheme(byId[0]);
  else     resetTheme();
}

function onPW(val){
  clearMsg();
  if(!val)return;
  const uid=document.getElementById('uid').value.trim().toUpperCase();
  const match=Object.entries(USERS).find(([,u])=>u.id===uid&&u.pw===val);
  if(match) applyTheme(match[0]);
}

/* ═══════════════════════════
   TOGGLE PASSWORD
═══════════════════════════ */
let pvis=false;
function togglePw(){
  const inp=document.getElementById('pw');
  pvis=!pvis; inp.type=pvis?'text':'password';
  document.getElementById('eye').textContent=pvis?'🙈':'👁';
}

/* ═══════════════════════════
   LOGIN
═══════════════════════════ */
function login(){
  const uid=document.getElementById('uid').value.trim().toUpperCase();
  const pw =document.getElementById('pw').value.trim();
  const btn=document.getElementById('btn');
  if(!uid){showMsg('Please enter your username ✦','err');shake();return;}
  if(!pw) {showMsg('Please enter your password ✦','err');shake();return;}
  const match=Object.entries(USERS).find(([,u])=>u.id===uid&&u.pw===pw);
  if(!match){showMsg('Incorrect username or password ✦','err');shake();return;}
  const [key,u]=match;
  applyTheme(key);
  btn.innerHTML='<span class="btn-txt">Entering…</span><span class="btn-arr">✦</span>';
  btn.style.pointerEvents='none';
  rippleBtn(btn);
  showMsg(u.greet+' — your world awaits '+u.emoji, 'ok');
  burst(u.theme==='green'?['#00e676','#00bfa5','#fff','rgba(0,255,120,.6)']:['#ff4d8b','#e040fb','#fff','rgba(255,80,200,.6)']);
  for(let i=0;i<24;i++) setTimeout(()=>spawnShoot(true),i*55);
  setTimeout(()=>showWelcome(u.greet,u.emoji,u.theme),1100);
}

/* ═══════════════════════════
   HELPERS
═══════════════════════════ */
function showMsg(t,c){const b=document.getElementById('msg');b.textContent=t;b.className='msg '+c;b.style.display='block';}
function clearMsg(){document.getElementById('msg').style.display='none';}

function shake(){
  phone.style.animation='none';
  [[-13,0],[13,68],[-7,136],[7,204],[0,272]].forEach(([x,t])=>setTimeout(()=>phone.style.transform=`translateX(${x}px)`,t));
  setTimeout(()=>{phone.style.transform='';phone.style.animation='phonefloat 6s ease-in-out infinite';},350);
}

function rippleBtn(btn){
  const r=document.createElement('span');r.className='rip';
  r.style.cssText='width:240px;height:240px;top:calc(50% - 120px);left:calc(50% - 120px);';
  btn.appendChild(r);setTimeout(()=>r.remove(),750);
}

function burst(cols){
  for(let i=0;i<90;i++){
    const p=document.createElement('div');p.className='confetti';
    const sz=Math.random()*12+3;
    const c=cols[Math.floor(Math.random()*cols.length)];
    p.style.cssText=`width:${sz}px;height:${sz}px;
      left:${12+Math.random()*76}%;top:${8+Math.random()*48}%;
      background:${c};box-shadow:0 0 ${sz}px ${c};
      --cd:${(Math.random()*2+.8).toFixed(2)}s;
      --cde:${(Math.random()*.5).toFixed(2)}s;
      --cx:${(Math.random()*320-160).toFixed(0)}px;
      border-radius:${Math.random()>.3?'50%':'3px'};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3800);
  }
}

function showWelcome(name,emoji,theme){
  const ov=document.getElementById('ov');
  const on=document.getElementById('ov-name');
  document.getElementById('ov-icon').textContent=emoji;
  ov.style.background=theme==='green'?'rgba(0,8,3,.5)':'rgba(10,0,8,.5)';
  ov.classList.add('show');
  on.textContent=''; let i=0;
  (function tw(){if(i<=name.length){on.textContent=name.slice(0,i++);setTimeout(tw,65);}})();
  for(let j=0;j<35;j++) setTimeout(()=>spawnShoot(true),j*85);
  const c=theme==='green'?['#00e676','#00bfa5','#fff']:['#ff4d8b','#e040fb','#fff'];
  burst(c);
}

addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('ov').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('show');
  const btn=document.getElementById('btn');
  btn.innerHTML='<span class="btn-txt">Enter my world</span><span class="btn-arr">→</span>';
  btn.style.pointerEvents='';
  document.getElementById('uid').value='';
  document.getElementById('pw').value='';
  pvis=false;document.getElementById('pw').type='password';
  document.getElementById('eye').textContent='👁';
  document.getElementById('detected').classList.remove('show');
  document.getElementById('pwbar')&&(document.getElementById('pwbar').style.width='0%');
  resetTheme();clearMsg();
});
</script>
</body>
</html>
