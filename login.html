<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome — Dharya</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif}

    /* ═══ BODY / DEEP SPACE ═══ */
    body{
      background:#0e0414;
      display:flex;align-items:center;justify-content:center;
      position:relative;
    }
    /* animated radial pulse */
    body::before{
      content:'';position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 90% 70% at 25% 35%, #2d0a45 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 75% 65%, #1a0530 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 90%, #0d0320 0%, transparent 50%);
      animation:bgpulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgpulse{
      from{opacity:.9;filter:hue-rotate(0deg);}
      to  {opacity:1; filter:hue-rotate(12deg);}
    }

    /* ═══ AURORA CANVAS ═══ */
    #aurora{position:fixed;inset:0;z-index:1;opacity:.45;}

    /* ═══ STAR CANVAS ═══ */
    #starfield{position:fixed;inset:0;z-index:2;pointer-events:none;}

    /* ═══ METEOR LAYER ═══ */
    #meteors{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
    .meteor{
      position:absolute;border-radius:999px;transform-origin:left center;
      animation:mfly var(--md,1s) var(--ml,0s) linear forwards;opacity:0;
    }
    @keyframes mfly{
      0%  {opacity:0;transform:rotate(var(--ma,-25deg)) translateX(0);}
      7%  {opacity:1;}
      82% {opacity:.8;}
      100%{opacity:0;transform:rotate(var(--ma,-25deg)) translateX(var(--mt,550px));}
    }

    /* ═══ FLOATING DUST PARTICLES ═══ */
    #dust{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
    .dust{
      position:absolute;border-radius:50%;background:rgba(255,180,120,.55);
      animation:dustrise var(--dd,12s) var(--dl,0s) linear infinite;
    }
    @keyframes dustrise{
      0%  {transform:translateY(0) translateX(0) scale(1);opacity:0;}
      10% {opacity:1;}
      90% {opacity:.6;}
      100%{transform:translateY(-110vh) translateX(var(--dx,20px)) scale(.3);opacity:0;}
    }

    /* ═══ FLOATING EMOJI STARS ═══ */
    .fstar{
      position:fixed;pointer-events:none;z-index:3;user-select:none;
      animation:fstfloat var(--ff,8s) var(--fd,0s) ease-in-out infinite alternate;
      opacity:var(--fo,.22);font-size:var(--fs,1.2rem);
      filter:drop-shadow(0 0 4px rgba(255,180,100,.5));
    }
    @keyframes fstfloat{
      from{transform:translateY(0) rotate(-8deg) scale(1);}
      to  {transform:translateY(-22px) rotate(10deg) scale(1.1);}
    }

    /* ═══ PARALLAX ORBS ═══ */
    .orb{
      position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:1;
      animation:orbdrift var(--of,20s) var(--od,0s) ease-in-out infinite alternate;
      will-change:transform;
    }
    @keyframes orbdrift{
      0%  {transform:translate(0,0) scale(1);}
      33% {transform:translate(50px,-40px) scale(1.12);}
      66% {transform:translate(-30px,50px) scale(.92);}
      100%{transform:translate(20px,20px) scale(1.05);}
    }

    /* ═══ CURSOR SPARKS ═══ */
    .spark{
      position:fixed;border-radius:50%;pointer-events:none;z-index:400;
      animation:sparkfade .7s ease-out forwards;
    }
    @keyframes sparkfade{
      0%  {transform:scale(1) translate(-50%,-50%);opacity:.9;}
      100%{transform:scale(0) translate(-50%,-50%);opacity:0;}
    }

    /* ═══ PHONE CARD ═══ */
    .phone-wrap{position:relative;z-index:20;perspective:1400px;}

    .phone{
      width:360px;
      background:linear-gradient(160deg,#1c1030 0%,#140920 55%,#0f0618 100%);
      border-radius:38px;
      border:1px solid rgba(255,255,255,.07);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 50px 120px rgba(0,0,0,.9),
        0 0 100px rgba(200,80,255,.08),
        inset 0 1px 0 rgba(255,255,255,.09),
        inset 0 -1px 0 rgba(0,0,0,.4);
      padding:38px 34px 30px;
      display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;
      animation:phonefloat 6s ease-in-out infinite;
      will-change:transform;
    }
    @keyframes phonefloat{
      0%,100%{transform:translateY(0) rotateX(.8deg);}
      50%    {transform:translateY(-12px) rotateX(-.8deg);}
    }

    /* phone corner dots */
    .pdots{position:absolute;top:15px;right:18px;display:flex;gap:5px;}
    .pdots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);}
    .pdots span:last-child{background:rgba(255,90,130,.7);box-shadow:0 0 6px rgba(255,90,130,.6);}

    /* card inner glow */
    .phone::before{
      content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
      width:250px;height:250px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,rgba(255,120,60,.1) 0%,transparent 70%);
      animation:innerglow 4s ease-in-out infinite alternate;
    }
    @keyframes innerglow{
      from{opacity:.6;transform:translateX(-50%) scale(1);}
      to  {opacity:1; transform:translateX(-50%) scale(1.15);}
    }

    /* shimmer sweep */
    .phone::after{
      content:'';position:absolute;inset:0;border-radius:38px;pointer-events:none;
      background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.03) 50%,transparent 65%);
      background-size:200% 100%;
      animation:shimmer 5s ease-in-out infinite;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ═══ APP ICON ═══ */
    .icon-wrap{position:relative;width:80px;height:80px;margin-bottom:18px;}

    .icon-bg{
      width:80px;height:80px;border-radius:22px;
      background:linear-gradient(135deg,#ff4d6d 0%,#ff8c42 55%,#ffb347 100%);
      display:flex;align-items:center;justify-content:center;font-size:2.1rem;
      box-shadow:
        0 10px 36px rgba(255,80,80,.55),
        0 2px 10px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -2px 0 rgba(0,0,0,.2);
      animation:iconbounce 3s ease-in-out infinite;
      position:relative;z-index:2;
    }
    @keyframes iconbounce{
      0%,100%{transform:scale(1) rotate(0deg);box-shadow:0 10px 36px rgba(255,80,80,.55),0 2px 10px rgba(0,0,0,.4);}
      50%    {transform:scale(1.07) rotate(-3deg);box-shadow:0 16px 50px rgba(255,100,60,.75),0 4px 14px rgba(0,0,0,.4);}
    }

    /* icon outer ring 1 */
    .icon-ring1{
      position:absolute;inset:-10px;border-radius:32px;border:1.5px solid rgba(255,140,60,.35);
      animation:iconring1 4s linear infinite;
    }
    @keyframes iconring1{to{transform:rotate(360deg);border-color:rgba(255,100,80,.5);}}

    /* icon outer ring 2 */
    .icon-ring2{
      position:absolute;inset:-18px;border-radius:38px;border:1px dashed rgba(255,180,100,.2);
      animation:iconring2 6s linear infinite reverse;
    }
    @keyframes iconring2{to{transform:rotate(360deg);}}

    /* sparkle dots orbiting icon */
    .icon-dot{
      position:absolute;width:6px;height:6px;border-radius:50%;
      background:linear-gradient(135deg,#ffb347,#ff6b6b);
      box-shadow:0 0 8px #ff8c42;
      animation:dotorbit var(--do,3s) var(--dd2,0s) linear infinite;
    }
    @keyframes dotorbit{
      0%  {transform:rotate(0deg)   translateX(44px) rotate(0deg);}
      100%{transform:rotate(360deg) translateX(44px) rotate(-360deg);}
    }

    /* ═══ WELCOME BADGE ═══ */
    .badge{
      display:flex;align-items:center;gap:8px;
      margin-bottom:10px;animation:badgepop .8s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes badgepop{from{opacity:0;transform:scale(.7) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .bline{width:24px;height:1px;background:linear-gradient(90deg,transparent,#e8944a);}
    .bline.r{background:linear-gradient(90deg,#e8944a,transparent);}
    .badge span{font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#e8944a;}
    .bdot{
      width:5px;height:5px;border-radius:50%;background:#e8944a;
      box-shadow:0 0 8px #e8944a,0 0 16px rgba(232,148,74,.4);
      animation:bdpulse 1.4s ease-in-out infinite alternate;
    }
    @keyframes bdpulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.8);opacity:1}}

    /* ═══ TITLE ═══ */
    .ctitle{
      font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;
      font-size:2.1rem;line-height:1.15;text-align:center;
      background:linear-gradient(135deg,#ffcc80 0%,#ff8c42 35%,#ff5f6b 70%,#e8944a 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin-bottom:8px;
      filter:drop-shadow(0 0 18px rgba(255,140,66,.45));
      animation:titleglow 3s ease-in-out infinite alternate;
      position:relative;
    }
    @keyframes titleglow{
      from{filter:drop-shadow(0 0 12px rgba(255,140,66,.3)) drop-shadow(0 0 30px rgba(255,80,60,.1));}
      to  {filter:drop-shadow(0 0 28px rgba(255,140,66,.7)) drop-shadow(0 0 60px rgba(255,80,60,.2));}
    }

    /* ═══ SUBTITLE ═══ */
    .csub{
      font-size:.78rem;color:rgba(255,255,255,.38);text-align:center;
      letter-spacing:.02em;margin-bottom:22px;min-height:1.4em;
    }
    .cur{
      display:inline-block;width:1.5px;height:.82em;
      background:rgba(232,148,74,.8);margin-left:1px;vertical-align:text-bottom;
      animation:curblink 1s step-end infinite;
    }
    @keyframes curblink{0%,100%{opacity:1}50%{opacity:0}}

    /* ═══ DIVIDER ═══ */
    .hdiv{
      width:100%;height:1px;margin-bottom:22px;
      background:linear-gradient(90deg,transparent,rgba(232,148,74,.2),transparent);
      position:relative;
    }
    .hdiv::after{
      content:'✦';position:absolute;left:50%;transform:translateX(-50%) translateY(-50%);
      color:rgba(232,148,74,.4);font-size:.65rem;
      background:#140920;padding:0 6px;
      animation:divglow 2s ease-in-out infinite alternate;
    }
    @keyframes divglow{from{color:rgba(232,148,74,.3)}to{color:rgba(232,148,74,.8)}}

    /* ═══ FIELDS ═══ */
    .field{width:100%;margin-bottom:14px;position:relative;}
    .field label{
      display:block;font-size:.62rem;font-weight:700;
      letter-spacing:.18em;text-transform:uppercase;
      color:rgba(255,255,255,.38);margin-bottom:7px;
      padding-left:2px;transition:color .4s,letter-spacing .3s;
    }
    .field:focus-within label{color:#ffb347;letter-spacing:.22em;}

    .field input{
      width:100%;padding:13px 44px 13px 16px;
      border-radius:13px;border:1.5px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.92);
      color:#1a0828;font-size:.95rem;
      font-family:'Inter',sans-serif;font-weight:600;
      outline:none;letter-spacing:.04em;
      transition:box-shadow .35s,border-color .35s,background .25s,transform .2s;
    }
    .field input::placeholder{color:rgba(120,90,150,.35);font-weight:400;}
    .field input:focus{
      background:#fff;
      border-color:#ff8c42;
      box-shadow:0 0 0 3px rgba(255,140,66,.22),0 6px 24px rgba(255,140,66,.15);
      transform:translateY(-1px);
    }
    /* focus ripple */
    .fripple{
      position:absolute;inset:0;border-radius:13px;pointer-events:none;
      border:2px solid rgba(255,140,66,0);
      transition:border-color .3s;
      animation:none;
    }
    .field input:focus ~ .fripple{
      border-color:rgba(255,140,66,.3);
      animation:fripplering .6s ease-out forwards;
    }
    @keyframes fripplering{
      0%  {transform:scale(1);opacity:1;}
      100%{transform:scale(1.04);opacity:0;}
    }

    /* eye button */
    .eye-btn{
      position:absolute;right:13px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;font-size:1rem;
      color:rgba(120,90,150,.5);padding:0;line-height:1;
      transition:color .25s,transform .2s;
    }
    .eye-btn:hover{color:#ff8c42;transform:translateY(-50%) scale(1.2);}

    /* uid status tick */
    .uid-tick{
      position:absolute;right:13px;top:50%;transform:translateY(-50%);
      font-size:.8rem;font-weight:800;opacity:0;
      transition:opacity .4s,color .4s;pointer-events:none;
    }
    .uid-tick.ok{opacity:1;color:#22cc66;}
    .uid-tick.no{opacity:1;color:#ff4455;}

    /* progress bar */
    .pwbar-wrap{height:3px;border-radius:999px;background:rgba(200,160,100,.1);margin-top:8px;overflow:hidden;}
    .pwbar{
      height:100%;width:0%;border-radius:999px;
      background:linear-gradient(90deg,#ff4d8b,#ff8c42,#ffb347);
      box-shadow:0 0 6px rgba(255,140,66,.6);
      transition:width .35s ease;
    }

    /* ═══ ENTER BUTTON ═══ */
    .enterbtn{
      width:100%;padding:15px 20px;border:none;border-radius:15px;
      margin-top:10px;font-size:1rem;font-weight:700;
      font-family:'Inter',sans-serif;letter-spacing:.06em;
      cursor:pointer;position:relative;overflow:hidden;
      background:linear-gradient(90deg,#ff4d8b 0%,#ff7043 50%,#ffb347 100%);
      color:#fff;
      box-shadow:0 8px 32px rgba(255,80,100,.55),0 2px 8px rgba(0,0,0,.3);
      transition:transform .22s,box-shadow .3s;
      display:flex;align-items:center;justify-content:center;gap:10px;
      animation:btnpulse 3s ease-in-out infinite;
    }
    @keyframes btnpulse{
      0%,100%{box-shadow:0 8px 32px rgba(255,80,100,.55),0 2px 8px rgba(0,0,0,.3);}
      50%    {box-shadow:0 12px 44px rgba(255,100,60,.75),0 2px 8px rgba(0,0,0,.3),0 0 0 6px rgba(255,120,60,.08);}
    }
    .enterbtn:hover{
      transform:translateY(-3px) scale(1.015);
      box-shadow:0 14px 44px rgba(255,80,100,.7),0 4px 12px rgba(0,0,0,.35);
      animation:none;
    }
    .enterbtn:active{transform:scale(.98);animation:none;}

    /* btn gradient shift */
    .enterbtn::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,#ffb347 0%,#ff7043 50%,#ff4d8b 100%);
      opacity:0;transition:opacity .5s;
    }
    .enterbtn:hover::before{opacity:1;}

    /* btn shine */
    .enterbtn::after{
      content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
      transform:skewX(-18deg);animation:btnshine 3.5s ease-in-out infinite;
    }
    @keyframes btnshine{0%{left:-80%}35%,100%{left:140%;}}

    .btn-arrow{font-size:1rem;position:relative;z-index:1;animation:arrowbounce 1.4s ease-in-out infinite;}
    @keyframes arrowbounce{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
    .btn-text{position:relative;z-index:1;}

    /* ripple */
    .rip{
      position:absolute;border-radius:50%;background:rgba(255,255,255,.32);
      transform:scale(0);animation:ripple .65s linear;pointer-events:none;
    }
    @keyframes ripple{to{transform:scale(5);opacity:0;}}

    /* ═══ MESSAGE ═══ */
    .msg{
      width:100%;font-size:.78rem;font-weight:600;border-radius:11px;
      padding:10px 14px;margin-top:12px;text-align:center;display:none;letter-spacing:.04em;
      animation:msgpop .38s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes msgpop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .msg.err {background:rgba(255,55,75,.14);border:1px solid rgba(255,55,75,.45);color:#ff7080;}
    .msg.ok  {background:rgba(255,140,66,.1); border:1px solid rgba(255,140,66,.4); color:#ffb347;}

    /* ═══ CARD FOOTER ═══ */
    .cfooter{
      margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:8px;
    }
    .cfooter-txt{
      display:flex;align-items:center;gap:8px;
      color:rgba(255,255,255,.16);font-size:.62rem;letter-spacing:.08em;
    }
    .cfooter-txt span{flex:1;height:1px;width:18px;background:rgba(255,255,255,.12);}
    .fdots{display:flex;gap:5px;}
    .fdots b{
      width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.12);display:block;
      transition:background .4s;
    }
    .fdots b:nth-child(2){background:rgba(255,140,66,.55);box-shadow:0 0 4px rgba(255,140,66,.4);}

    /* ═══ WELCOME OVERLAY ═══ */
    #ov{
      position:fixed;inset:0;z-index:300;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:20px;
      opacity:0;pointer-events:none;
      transition:opacity .7s,backdrop-filter .7s;
    }
    #ov.show{
      opacity:1;pointer-events:all;
      backdrop-filter:blur(16px) brightness(.45) saturate(1.5);
      -webkit-backdrop-filter:blur(16px) brightness(.45) saturate(1.5);
    }
    .ov-icon{font-size:4rem;animation:ovspin 2.2s ease-in-out infinite;}
    @keyframes ovspin{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(14deg) scale(1.22)}}
    .ov-title{
      font-family:'Playfair Display',serif;font-style:italic;font-weight:900;
      font-size:clamp(2.2rem,7vw,4.5rem);text-align:center;
      background:linear-gradient(135deg,#ffcc80,#ff8c42,#ff5f6b);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      filter:drop-shadow(0 0 40px rgba(255,140,66,.8));
      animation:ovglow 1.8s ease-in-out infinite alternate;min-height:1.2em;
    }
    @keyframes ovglow{
      from{filter:drop-shadow(0 0 20px rgba(255,140,66,.5));}
      to  {filter:drop-shadow(0 0 60px rgba(255,140,66,1));}
    }
    .ov-sub{font-size:.9rem;color:rgba(255,255,255,.4);letter-spacing:.24em;text-transform:uppercase;}
    .ov-tap{font-size:.68rem;color:rgba(255,255,255,.17);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;animation:otap 2.2s ease-in-out infinite;}
    @keyframes otap{0%,100%{opacity:.17}50%{opacity:.5}}

    /* ═══ CONFETTI ═══ */
    .confetti{
      position:fixed;pointer-events:none;z-index:200;
      animation:cfall var(--cd,2s) var(--cde,0s) ease-out forwards;
    }
    @keyframes cfall{
      0%  {transform:translate(0,0) rotate(0) scale(1);opacity:1;}
      100%{transform:translate(var(--cx,0),130vh) rotate(900deg) scale(.1);opacity:0;}
    }

    @media(max-width:400px){.phone{width:94vw;padding:30px 20px 24px;}}
  </style>
</head>
<body>

  <!-- Layers -->
  <canvas id="aurora"></canvas>
  <canvas id="starfield"></canvas>
  <div id="meteors"></div>
  <div id="dust"></div>

  <!-- Parallax orbs -->
  <div class="orb" id="orb1" style="width:420px;height:420px;top:-100px;left:-150px;background:#3a0e60;opacity:.18;--of:22s;--od:0s;"></div>
  <div class="orb" id="orb2" style="width:320px;height:320px;bottom:-70px;right:-100px;background:#10083a;opacity:.15;--of:17s;--od:5s;"></div>
  <div class="orb" id="orb3" style="width:200px;height:200px;top:50%;left:70%;background:#2a0820;opacity:.12;--of:13s;--od:9s;"></div>

  <!-- Floating emoji stars -->
  <div class="fstar" style="top:16%;left:7%;  --fs:1.5rem;--fo:.22;--ff:7s; --fd:0s;">⭐</div>
  <div class="fstar" style="top:52%;left:4%;  --fs:1.1rem;--fo:.18;--ff:9s; --fd:2s;">✦</div>
  <div class="fstar" style="top:78%;left:10%; --fs:1.6rem;--fo:.2; --ff:6s; --fd:1s;">★</div>
  <div class="fstar" style="top:22%;right:7%; --fs:1.3rem;--fo:.2; --ff:8s; --fd:3s;">✦</div>
  <div class="fstar" style="top:62%;right:5%; --fs:1.5rem;--fo:.17;--ff:11s;--fd:0.5s;">⭐</div>
  <div class="fstar" style="top:40%;right:14%;--fs:.9rem; --fo:.14;--ff:5s; --fd:4s;">★</div>
  <div class="fstar" style="top:86%;right:16%;--fs:1.2rem;--fo:.18;--ff:7s; --fd:1.5s;">✦</div>
  <div class="fstar" style="top:9%; left:45%; --fs:.8rem; --fo:.12;--ff:10s;--fd:2.5s;">★</div>
  <div class="fstar" style="top:70%;left:22%; --fs:1rem;  --fo:.15;--ff:8s; --fd:6s;">✦</div>
  <div class="fstar" style="top:33%;right:28%;--fs:1.4rem;--fo:.13;--ff:12s;--fd:3.5s;">⭐</div>

  <!-- Welcome overlay -->
  <div id="ov">
    <div class="ov-icon" id="ov-icon">✨</div>
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub">Welcome Back ✦</div>
    <div class="ov-tap">tap anywhere to continue</div>
  </div>

  <!-- PHONE CARD -->
  <div class="phone-wrap">
    <div class="phone" id="phone">

      <div class="pdots"><span></span><span></span><span></span></div>

      <!-- App Icon with rings + orbiting dots -->
      <div class="icon-wrap">
        <div class="icon-ring2"></div>
        <div class="icon-ring1"></div>
        <div class="icon-bg" id="icon-bg">✦</div>
        <div class="icon-dot" style="--do:3s;--dd2:0s;"></div>
        <div class="icon-dot" style="--do:3s;--dd2:1s;"></div>
        <div class="icon-dot" style="--do:3s;--dd2:2s;"></div>
      </div>

      <!-- Badge -->
      <div class="badge">
        <div class="bdot"></div>
        <div class="bline"></div>
        <span>Welcome</span>
        <div class="bline r"></div>
        <div class="bdot"></div>
      </div>

      <!-- Title -->
      <h1 class="ctitle" id="ctitle">Welcome to Dharya</h1>

      <!-- Subtitle typewriter -->
      <p class="csub" id="csub"><span class="cur"></span></p>

      <div class="hdiv"></div>

      <!-- USERNAME -->
      <div class="field">
        <label for="uid">Username</label>
        <input type="text" id="uid" placeholder="Enter username"
               autocomplete="off" spellcheck="false" oninput="onUID(this.value)"/>
        <div class="uid-tick" id="uid-tick"></div>
        <div class="fripple"></div>
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" placeholder="••••••••••"
               autocomplete="off" spellcheck="false" oninput="onPW(this.value)"/>
        <button class="eye-btn" id="eye" onclick="togglePw()">👁</button>
        <div class="fripple"></div>
        <div class="pwbar-wrap"><div class="pwbar" id="pwbar"></div></div>
      </div>

      <button class="enterbtn" id="btn" onclick="login()">
        <span class="btn-text">Enter</span>
        <span class="btn-arrow">→</span>
      </button>

      <div class="msg" id="msg"></div>

      <!-- Footer -->
      <div class="cfooter">
        <div class="cfooter-txt">
          <span></span>Only someone special knows the way in<span></span>
        </div>
        <div class="fdots"><b></b><b></b><b></b></div>
      </div>
    </div>
  </div>

<script>
/* ═══════════════════════════════
   USERS
═══════════════════════════════ */
const USERS = {
  dharya:  {id:'DHARYA', pw:'09/10/2007', emoji:'🌿', name:'Dharya',  greet:'Welcome, Dharya!'},
  sadhana: {id:'DHARYA', pw:'29/02/2008', emoji:'🌸', name:'Sadhana', greet:'Welcome, Sadhana!'},
};

/* ═══════════════════════════════
   AURORA CANVAS
═══════════════════════════════ */
const ac=document.getElementById('aurora'), ax=ac.getContext('2d');
let aw,ah,aT=0;
function rsz(){aw=ac.width=innerWidth;ah=ac.height=innerHeight;}
rsz(); addEventListener('resize',rsz);
const awaves=[0,1,2,3,4].map(i=>({off:i*Math.PI*.4,sp:.00025+i*.00014,amp:50+i*20,y:.18+i*.14,h:i*48}));
function drawAurora(){
  ax.clearRect(0,0,aw,ah); aT++;
  awaves.forEach(w=>{
    ax.beginPath();
    const by=ah*w.y; ax.moveTo(0,by);
    for(let x=0;x<=aw;x+=8){
      const y=by+Math.sin(x*.007+aT*w.sp*900+w.off)*w.amp+Math.cos(x*.003+aT*w.sp*500)*(w.amp*.45);
      ax.lineTo(x,y);
    }
    ax.lineTo(aw,0);ax.lineTo(0,0);ax.closePath();
    const h=(w.h+aT*.03)%360;
    const g=ax.createLinearGradient(0,0,aw,ah*.5);
    g.addColorStop(0,  `hsla(${h},75%,50%,0)`);
    g.addColorStop(.4, `hsla(${h},85%,48%,.04)`);
    g.addColorStop(.75,`hsla(${(h+40)%360},80%,52%,.07)`);
    g.addColorStop(1,  `hsla(${(h+70)%360},75%,48%,0)`);
    ax.fillStyle=g; ax.fill();
  });
  requestAnimationFrame(drawAurora);
}
drawAurora();

/* ═══════════════════════════════
   STAR CANVAS
═══════════════════════════════ */
const sc=document.getElementById('starfield'), sx=sc.getContext('2d');
let sw,sh;
function rsz2(){sw=sc.width=innerWidth;sh=sc.height=innerHeight;}
rsz2(); addEventListener('resize',rsz2);
const STARS=Array.from({length:320},()=>({
  x:Math.random(),y:Math.random(),
  r:Math.random()*2+.2,
  a:Math.random(),
  da:(Math.random()*.007+.002)*(Math.random()>.5?1:-1),
  base:Math.random()*.45+.05,
  col:Math.random()>.85?`rgba(255,${Math.floor(160+Math.random()*60)},${Math.floor(80+Math.random()*60)},`:'rgba(255,255,255,'
}));
function drawStars(){
  sx.clearRect(0,0,sw,sh);
  STARS.forEach(s=>{
    s.a+=s.da; if(s.a>1||s.a<0)s.da*=-1;
    sx.beginPath();
    sx.arc(s.x*sw,s.y*sh,s.r,0,Math.PI*2);
    sx.fillStyle=s.col+(s.base*Math.abs(s.a)).toFixed(3)+')';
    sx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ═══════════════════════════════
   METEOR SHOWER
═══════════════════════════════ */
const ml=document.getElementById('meteors');
function spawnMeteor(forced){
  const el=document.createElement('div'); el.className='meteor';
  const len=Math.random()*280+70, travel=Math.random()*550+350;
  const dur=(Math.random()*1.1+.55).toFixed(2), delay=forced?0:(Math.random()*3.5).toFixed(2);
  const angle=-(Math.random()*30+8);
  // warm orange-white colour to match the aesthetic
  const warm=Math.random()>.4;
  const c=warm?`rgba(255,${Math.floor(160+Math.random()*80)},${Math.floor(80+Math.random()*60)},.9)`:'rgba(255,255,255,.85)';
  el.style.cssText=`width:${len}px;height:${Math.random()>.4?1.5:2}px;
    top:${Math.random()*72}%;left:${Math.random()*82}%;
    border-radius:999px;
    --ma:${angle}deg;--mt:${travel}px;--md:${dur}s;--ml:${delay}s;
    background:linear-gradient(90deg,transparent 0%,${c.replace('.9',',.5')} 35%,${c} 100%);
    box-shadow:0 0 8px 1px ${c.replace('.9',',.35')};`;
  ml.appendChild(el);
  setTimeout(()=>el.remove(),(parseFloat(dur)+parseFloat(delay))*1000+500);
}
(function mloop(){spawnMeteor(false);setTimeout(mloop,Math.random()*750+180);})();

/* ═══════════════════════════════
   DUST PARTICLES
═══════════════════════════════ */
const dustLayer=document.getElementById('dust');
for(let i=0;i<55;i++){
  const d=document.createElement('div'); d.className='dust';
  const sz=Math.random()*3+1;
  d.style.cssText=`width:${sz}px;height:${sz}px;
    left:${Math.random()*100}%;bottom:${Math.random()*20}%;
    --dd:${(Math.random()*10+8).toFixed(1)}s;--dl:${(Math.random()*10).toFixed(1)}s;
    --dx:${(Math.random()*60-30).toFixed(0)}px;
    opacity:.4;`;
  dustLayer.appendChild(d);
}

/* ═══════════════════════════════
   3D TILT CARD
═══════════════════════════════ */
const phone=document.getElementById('phone');
addEventListener('mousemove',e=>{
  const dx=(e.clientX-innerWidth/2)/(innerWidth/2);
  const dy=(e.clientY-innerHeight/2)/(innerHeight/2);
  phone.style.animation='none';
  phone.style.transform=`rotateX(${-dy*7}deg) rotateY(${dx*7}deg) translateZ(14px)`;
});
addEventListener('mouseleave',()=>{
  phone.style.transition='transform .9s ease';
  phone.style.transform='';
  setTimeout(()=>{phone.style.animation='phonefloat 6s ease-in-out infinite';phone.style.transition='';},920);
});

/* parallax orbs follow mouse slowly */
addEventListener('mousemove',e=>{
  const mx=(e.clientX/innerWidth-.5)*30;
  const my=(e.clientY/innerHeight-.5)*30;
  document.getElementById('orb1').style.transform=`translate(${-mx*.6}px,${-my*.6}px)`;
  document.getElementById('orb2').style.transform=`translate(${mx*.4}px,${my*.4}px)`;
  document.getElementById('orb3').style.transform=`translate(${mx*.8}px,${-my*.8}px)`;
});

/* ═══════════════════════════════
   CURSOR SPARKS
═══════════════════════════════ */
addEventListener('mousemove',e=>{
  if(Math.random()>.28)return;
  const sp=document.createElement('div'); sp.className='spark';
  const warm=Math.random()>.4;
  const c=warm?`rgba(255,${Math.floor(120+Math.random()*100)},${Math.floor(50+Math.random()*80)},.85)`:'rgba(255,240,200,.7)';
  sp.style.cssText=`width:${Math.random()*5+3}px;height:${Math.random()*5+3}px;
    left:${e.clientX}px;top:${e.clientY}px;
    background:${c};box-shadow:0 0 8px ${c};`;
  document.body.appendChild(sp);
  setTimeout(()=>sp.remove(),750);
});

/* ═══════════════════════════════
   TYPEWRITER SUBTITLE
═══════════════════════════════ */
const SUBTITLES=['Only someone special knows the way in 🗝','Enter your secret to continue ✨','Stars remember those who belong ⭐'];
let subIdx=0, subTimer=null;
function typeSubtitle(text){
  clearTimeout(subTimer);
  const el=document.getElementById('csub');
  el.innerHTML='<span class="cur"></span>'; let i=0;
  (function t(){
    if(i<=text.length){
      el.innerHTML=text.slice(0,i++)+'<span class="cur"></span>';
      subTimer=setTimeout(t,40);
    } else {
      // after pause, cycle to next
      subTimer=setTimeout(()=>{
        subIdx=(subIdx+1)%SUBTITLES.length;
        typeSubtitle(SUBTITLES[subIdx]);
      },3800);
    }
  })();
}
typeSubtitle(SUBTITLES[0]);

/* ═══════════════════════════════
   ICON PULSE on interaction
═══════════════════════════════ */
function iconPop(){
  const ic=document.getElementById('icon-bg');
  ic.style.transform='scale(1.18) rotate(-5deg)';
  ic.style.boxShadow='0 16px 50px rgba(255,100,60,.85),0 4px 14px rgba(0,0,0,.4)';
  setTimeout(()=>{ic.style.transform='';ic.style.boxShadow='';},300);
}

/* ═══════════════════════════════
   INPUT HANDLERS
═══════════════════════════════ */
function onUID(val){
  clearMsg();
  const v=val.trim().toUpperCase();
  const tick=document.getElementById('uid-tick');
  const match=Object.values(USERS).find(u=>u.id===v);
  if(!v){tick.textContent='';tick.className='uid-tick';return;}
  if(match){tick.textContent='✓';tick.className='uid-tick ok';iconPop();}
  else      {tick.textContent='✗';tick.className='uid-tick no';}
}

function onPW(val){
  clearMsg();
  const pct=Math.min(100,Math.round((val.length/10)*100));
  document.getElementById('pwbar').style.width=pct+'%';
}

/* ═══════════════════════════════
   TOGGLE PASSWORD
═══════════════════════════════ */
let pvis=false;
function togglePw(){
  const inp=document.getElementById('pw');
  pvis=!pvis; inp.type=pvis?'text':'password';
  document.getElementById('eye').textContent=pvis?'🙈':'👁';
}

/* ═══════════════════════════════
   LOGIN
═══════════════════════════════ */
function login(){
  const uid=document.getElementById('uid').value.trim().toUpperCase();
  const pw =document.getElementById('pw').value.trim();
  const btn=document.getElementById('btn');

  if(!uid){showMsg('Please enter your username ✦','err');shake();return;}
  if(!pw) {showMsg('Please enter your password ✦','err');shake();return;}

  const match=Object.entries(USERS).find(([,u])=>u.id===uid&&u.pw===pw);
  if(!match){showMsg('Incorrect username or password ✦','err');shake();return;}

  const [key,u]=match;
  btn.innerHTML='<span class="btn-text">Entering…</span><span class="btn-arrow">✦</span>';
  btn.style.pointerEvents='none';
  rippleBtn(btn);
  showMsg(u.greet+' '+(key==='dharya'?'💚':'🌸'),'ok');
  confettiBurst(key==='dharya'?'#00ffaa':'#ff88cc');
  for(let i=0;i<22;i++) setTimeout(()=>spawnMeteor(true),i*55);
  setTimeout(()=>showWelcome(u.greet,u.emoji),1100);
}

/* ═══════════════════════════════
   HELPERS
═══════════════════════════════ */
function showMsg(t,c){
  const b=document.getElementById('msg');
  b.textContent=t;b.className='msg '+c;b.style.display='block';
}
function clearMsg(){document.getElementById('msg').style.display='none';}

function shake(){
  phone.style.animation='none';
  [[-13,0],[13,68],[-7,136],[7,204],[0,272]].forEach(([x,t])=>
    setTimeout(()=>phone.style.transform=`translateX(${x}px)`,t));
  setTimeout(()=>{phone.style.transform='';phone.style.animation='phonefloat 6s ease-in-out infinite';},350);
}

function rippleBtn(btn){
  const r=document.createElement('span');r.className='rip';
  r.style.cssText='width:240px;height:240px;top:calc(50% - 120px);left:calc(50% - 120px);';
  btn.appendChild(r);setTimeout(()=>r.remove(),750);
}

function confettiBurst(col){
  const cols=[col,'#ffb347','#ff8c42','#fff','rgba(255,255,255,.6)'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div');p.className='confetti';
    const sz=Math.random()*12+3;
    const cc=cols[Math.floor(Math.random()*cols.length)];
    p.style.cssText=`width:${sz}px;height:${sz}px;
      left:${15+Math.random()*70}%;top:${10+Math.random()*45}%;
      background:${cc};box-shadow:0 0 ${sz}px ${cc};
      --cd:${(Math.random()*2+.8).toFixed(2)}s;
      --cde:${(Math.random()*.5).toFixed(2)}s;
      --cx:${(Math.random()*320-160).toFixed(0)}px;
      border-radius:${Math.random()>.3?'50%':'3px'};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3800);
  }
}

function showWelcome(text,emoji){
  clearTimeout(subTimer);
  const ov=document.getElementById('ov');
  const ot=document.getElementById('ov-title');
  document.getElementById('ov-icon').textContent=emoji;
  ov.style.background='rgba(5,2,12,.5)';
  ov.classList.add('show');
  ot.textContent=''; let i=0;
  (function tw(){if(i<=text.length){ot.textContent=text.slice(0,i++);setTimeout(tw,60);}})();
  for(let j=0;j<35;j++) setTimeout(()=>spawnMeteor(true),j*90);
  confettiBurst('#ffb347');
}

addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('ov').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('show');
  const btn=document.getElementById('btn');
  btn.innerHTML='<span class="btn-text">Enter</span><span class="btn-arrow">→</span>';
  btn.style.pointerEvents='';
  document.getElementById('uid').value='';
  document.getElementById('pw').value='';
  pvis=false;document.getElementById('pw').type='password';
  document.getElementById('eye').textContent='👁';
  document.getElementById('uid-tick').className='uid-tick';
  document.getElementById('pwbar').style.width='0%';
  clearMsg();
  typeSubtitle(SUBTITLES[0]);
});
</script>
</body>
</html>
