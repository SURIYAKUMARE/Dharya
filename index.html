without rotating at all. These special vectors are eigenvectors, and their scaling factor is the eigenvalue.",detailedExplanation:"In linear algebra, an eigenvector of a square matrix A is a non-zero vector v that satisfies the characteristic equation Av = λv, where λ is a scalar known as the eigenvalue. To compute the eigenvalues, we solve the characteristic equation det(A - λI) = 0. Once eigenvalues are found, each corresponding eigenvector is determined by finding the null space of (A - λI).",importantConcepts:["Characteristic Equation: det(A - λI) = 0","Trace Theorem: The sum of eigenvalues equals the trace of the matrix","Determinant Theorem: The product of eigenvalues equals the determinant of the matrix","Diagonalisation: If matrix A has n linearly independent eigenvectors, A = PDP⁻¹","Cayley-Hamilton Theorem: Every square matrix satisfies its own characteristic equation"],examples:[{title:"Finding Eigenvalues of a 2x2 Matrix",problem:"Find the eigenvalues of A = [[4, 2], [1, 3]].",solution:`Set det(A - λI) = 0:
| 4 - λ    2   |
|   1    3 - λ |
= (4 - λ)(3 - λ) - (2)(1) = 0
λ² - 7λ + 12 - 2 = 0
λ² - 7λ + 10 = 0
(λ - 2)(λ - 5) = 0
Therefore, eigenvalues are λ₁ = 2 and λ₂ = 5.`}],formulasOrCode:{type:"formula",content:"A · v = λ · v   ⟺   det(A - λI) = 0",caption:"Fundamental Eigenvalue Equation and Characteristic Determinant"},stepByStep:[{step:1,title:"Form the Matrix (A - λI)",description:"Subtract scalar λ from each diagonal entry of matrix A."},{step:2,title:"Compute the Determinant",description:"Calculate det(A - λI) to formulate the characteristic polynomial equation."},{step:3,title:"Solve the Roots",description:"Factor the polynomial to solve for the scalar roots λ₁, λ₂, ..., λₙ."},{step:4,title:"Find Eigenvectors",description:"Substitute each λ back into (A - λI)v = 0 and solve using Gaussian elimination."}],keyPoints:["Eigenvalues can be real, repeated, or complex conjugates.","Symmetric real matrices always have strictly real eigenvalues.","An n×n matrix always has exactly n eigenvalues counting algebraic multiplicities."],commonMistakes:["Forgetting that the zero vector cannot be an eigenvector by definition.","Sign errors when computing (a - λ)(d - λ) in 2x2 determinants.","Confusing algebraic multiplicity with geometric multiplicity."],quickRevision:["det(A - λI) = 0 yields eigenvalues.","Sum of λ = Trace(A).","Product of λ = det(A)."],assessmentQuestions:[{id:"q1",question:"What is the characteristic equation used to determine the eigenvalues of an n×n matrix A?",options:["det(A + λI) = 0","det(A - λI) = 0","trace(A) · λ = 0","Av = 0"],correctIndex:1,explanation:"The characteristic equation is derived from (A - λI)v = 0 having non-trivial solutions, which requires det(A - λI) = 0."},{id:"q2",question:"If the eigenvalues of a 2×2 matrix are 3 and 7, what is the determinant of the matrix?",options:["10","21","4","0"],correctIndex:1,explanation:"The determinant of a matrix is equal to the product of its eigenvalues: 3 × 7 = 21."},{id:"q3",question:"Which theorem states that every square matrix satisfies its own characteristic equation?",options:["Cramer’s Rule","Rolle’s Theorem","Cayley-Hamilton Theorem","Gauss-Jordan Theorem"],correctIndex:2,explanation:"The Cayley-Hamilton Theorem states that substituting matrix A into its own characteristic polynomial P(λ) gives P(A) = 0."}]}]},{id:"physics",title:"Physics",code:"PHY-101",department:"Applied Sciences",icon:"⚛",accent:"#06B6D4",accentLight:"rgba(6, 182, 212, 0.15)",description:"Quantum physics, wave optics, electromagnetic field theory, and laser dynamics for engineers.",topicsCount:3,topics:[{id:"phy-quantum",subjectId:"physics",title:"Wave-Particle Duality & De Broglie Hypothesis",difficulty:"Intermediate",estimatedMinutes:40,simpleExplanation:"Light behaves like both a continuous ripple in water (wave) and a beam of tiny ping-pong balls (particles). De Broglie realized that matter, like electrons, behaves the exact same way.",detailedExplanation:"In 1924, Louis de Broglie hypothesized that if light exhibits dual particle-wave characteristics, matter particles in motion must also possess wave-like properties. The wavelength of a particle is given by λ = h / p, where h is Planck’s constant and p is momentum (mv). This laid the mathematical foundation for wave mechanics and Schrödinger’s equation.",importantConcepts:["De Broglie Relation: λ = h / p = h / (mv)","Heisenberg Uncertainty Principle: Δx · Δp ≥ ℏ / 2","Wave Function: Ψ(x, t) whose modulus squared |Ψ|² represents probability density","Photoelectric Effect: E = hν - Φ (Work Function)"],examples:[{title:"Wavelength of an Accelerated Electron",problem:"Calculate the de Broglie wavelength of an electron accelerated through an electric potential of 100 Volts.",solution:`Using λ = 1.227 / √V nm:

, dynamic arrays, and structures.",topicsCount:3,topics:[{id:"prog-pointers",subjectId:"programming",title:"Pointers & Dynamic Memory Allocation",difficulty:"Beginner",estimatedMinutes:35,simpleExplanation:"A normal variable holds data like the number 42. A pointer is a variable that holds the house address (memory location) where that number 42 is stored in RAM.",detailedExplanation:"Pointers are variables that store memory addresses of other variables. Declared using the dereference operator (*), pointers provide low-level control over memory, allow efficient passing of large data structures by reference, and enable dynamic memory management via malloc(), calloc(), free() in C, or new/delete in C++.",importantConcepts:["Address-of Operator (&): Retrieves the memory address of a variable","Dereference Operator (*): Accesses the value residing at the stored address","Heap vs Stack: Stack memory is automatic; Heap memory is allocated dynamically at runtime","Memory Leaks: Forgetting to release allocated heap memory causes gradual memory exhaustion"],examples:[{title:"Dynamic Array Allocation in C++",problem:"Allocate an integer array of size n on the heap, initialize values, and properly delete it.",solution:`int* arr = new int[n];

 an upside-down family tree where every node has at most two children: smaller numbers go to the left branch, and larger numbers go to the right branch.",detailedExplanation:"A Binary Search Tree is a hierarchical node-based data structure satisfying the BST invariant: for every node X, all values in its left subtree are strictly less than X, and all values in its right subtree are strictly greater than X. This ordering enables average O(log n) time complexity for search, insertion, and deletion.",importantConcepts:["BST Property: Left < Node < Right","Inorder Traversal: Traverses Left-Node-Right and always outputs keys in sorted order","Search Time Complexity: Average O(log n), Worst case O(n) for skewed tree","Balancing: AVL and Red-Black trees maintain O(log n) worst case via self-balancing rotations"],examples:[{title:"Searching for Key 45 in BST",problem:"Root is 50. Left child is 30, right is 70. How is key 45 found?",solution:`1. Compare 45 with root (50): 45 < 50, go left to node 30.
