<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Dharya</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700;1,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ── RESET ── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:#07020f;}

    /* ── PAGE TRANSITIONS ── */
    #page-login{
      position:fixed;inset:0;z-index:10;
      display:flex;align-items:center;justify-content:center;
      transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);
    }
    #page-login.hide{opacity:0;transform:scale(.94) translateY(-12px);pointer-events:none;}
    #page-chat{
      position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
      opacity:0;pointer-events:none;
      transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);
      transform:translateY(16px);
    }
    #page-chat.show{opacity:1;pointer-events:all;transform:translateY(0);}

    /* ── SHARED BACKGROUND ── */
    body.th-g{background:#020c05;}
    body.th-p{background:#0c0212;}
    #cv{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .orb{
      position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);
      animation:orbdrift var(--of,20s) var(--od,0s) ease-in-out infinite alternate;
      transition:background 1.4s;
    }
    @keyframes orbdrift{
      0%{transform:translate(0,0) scale(1);}
      50%{transform:translate(var(--ox,30px),var(--oy,-20px)) scale(1.08);}
      100%{transform:translate(calc(var(--ox)*-.5),var(--oy)) scale(.94);}
    }
    .glyph{
      position:fixed;pointer-events:none;z-index:1;user-select:none;
      font-size:var(--gs,1rem);opacity:var(--go,.11);
      filter:drop-shadow(0 0 5px var(--gf,rgba(200,160,255,.3)));
      animation:glyphf var(--gd,9s) var(--gdl,0s) ease-in-out infinite alternate;
    }
    @keyframes glyphf{from{transform:translateY(0) rotate(-9deg);}to{transform:translateY(-20px) rotate(9deg);}}
    .spark{position:fixed;border-radius:50%;pointer-events:none;z-index:99;animation:spkfade .75s ease-out forwards;}
    @keyframes spkfade{0%{transform:scale(1.3) translate(-50%,-50%);opacity:.9;}100%{transform:scale(0) translate(-50%,-50%);opacity:0;}}
    .conf{position:fixed;pointer-events:none;z-index:40;animation:cfall var(--cd,2s) var(--cdl,0s) ease-out forwards;}
    @keyframes cfall{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1;}100%{transform:translate(var(--cx,0),130vh) rotate(900deg) scale(.05);opacity:0;}}

    /* ════════════════════════
       LOGIN CARD
    ════════════════════════ */
    .scene{position:relative;z-index:10;perspective:1400px;}
    .card{
      width:380px;
      background:linear-gradient(158deg,rgba(255,255,255,.085) 0%,rgba(255,255,255,.028) 50%,rgba(0,0,0,.32) 100%);
      border:1px solid rgba(255,255,255,.1);border-radius:38px;
      backdrop-filter:blur(40px) saturate(1.5);-webkit-backdrop-filter:blur(40px) saturate(1.5);
      padding:42px 36px 30px;display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,.042),0 55px 130px rgba(0,0,0,.92),0 0 100px var(--cg,rgba(150,40,255,.1)),inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.55);
      animation:cardfloat 7s ease-in-out infinite;transition:box-shadow 1.3s,border-color 1.3s;
    }
    body.th-g .card{--cg:rgba(0,230,118,.1);border-color:rgba(0,230,118,.15);}
    body.th-p .card{--cg:rgba(255,50,180,.12);border-color:rgba(255,50,180,.17);}
    @keyframes cardfloat{
      0%,100%{transform:translateY(0) rotateX(1deg) rotateY(0);}
      33%{transform:translateY(-7px) rotateX(-.4deg) rotateY(.3deg);}
      66%{transform:translateY(-11px) rotateX(.2deg) rotateY(-.2deg);}
    }
    .card::after{content:'';position:absolute;inset:0;border-radius:38px;pointer-events:none;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.045) 44%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.045) 56%,transparent 80%);background-size:260% 100%;animation:shimmer 8s ease-in-out infinite;}
    @keyframes shimmer{0%{background-position:260% 0}100%{background-position:-260% 0}}
    .card::before{content:'';position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--ig,rgba(160,50,255,.14)) 0%,transparent 65%);animation:topglow 5s ease-in-out infinite alternate;transition:background 1.3s;}
    body.th-g .card::before{--ig:rgba(0,230,118,.11);}body.th-p .card::before{--ig:rgba(255,50,200,.17);}
    @keyframes topglow{from{opacity:.5;transform:translateX(-50%) scale(1);}to{opacity:1;transform:translateX(-50%) scale(1.2);}}
    .dots{position:absolute;top:15px;right:16px;display:flex;gap:5px;z-index:2;}
    .dots em{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.13);display:block;font-style:normal;}
    .dots em:last-child{background:var(--dc,rgba(255,80,180,.85));box-shadow:0 0 7px var(--dc);transition:background .8s,box-shadow .8s;animation:dotpulse 2s ease-in-out infinite alternate;}
    body.th-g .dots em:last-child{--dc:rgba(0,230,118,.9);}body.th-p .dots em:last-child{--dc:rgba(255,50,180,.9);}
    @keyframes dotpulse{from{box-shadow:0 0 5px var(--dc,rgba(255,80,180,.5));}to{box-shadow:0 0 16px var(--dc,rgba(255,80,180,.9)),0 0 32px var(--dc,rgba(255,80,180,.3));}}
    .icon-wrap{position:relative;width:82px;height:82px;margin-bottom:18px;}
    .icon{width:82px;height:82px;border-radius:23px;background:linear-gradient(135deg,#ff4d8b,#c026d3);display:flex;align-items:center;justify-content:center;font-size:2.15rem;position:relative;z-index:2;box-shadow:0 12px 36px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);animation:iconbob 3.5s ease-in-out infinite;transition:background 1.1s,box-shadow 1.1s;}
    body.th-g .icon{background:linear-gradient(135deg,#00e676,#00bfa5);box-shadow:0 12px 36px rgba(0,230,118,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);}
    body.th-p .icon{background:linear-gradient(135deg,#ff4d8b,#c026d3);box-shadow:0 12px 36px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);}
    @keyframes iconbob{0%,100%{transform:scale(1) rotate(0deg) translateY(0);}50%{transform:scale(1.07) rotate(-3deg) translateY(-4px);}}
    .ring{position:absolute;border-radius:31px;border:1.5px solid var(--rc,rgba(255,80,180,.24));transition:border-color 1.1s;}
    .ring.a{inset:-9px;animation:rcw 4s linear infinite;}
    .ring.b{inset:-18px;border-radius:40px;border-style:dashed;border-color:var(--rc2,rgba(255,80,180,.11));animation:rccw 7.5s linear infinite;transition:border-color 1.1s;}
    body.th-g .ring.a{--rc:rgba(0,230,118,.3);}body.th-g .ring.b{--rc2:rgba(0,230,118,.14);}
    body.th-p .ring.a{--rc:rgba(255,50,200,.34);}body.th-p .ring.b{--rc2:rgba(255,50,200,.15);}
    @keyframes rcw{to{transform:rotate(360deg);}}@keyframes rccw{to{transform:rotate(-360deg);}}
    .odot{position:absolute;width:6px;height:6px;border-radius:50%;z-index:3;background:var(--odc,rgba(255,80,180,.85));box-shadow:0 0 9px var(--odc);animation:odotfly var(--ot,4s) var(--otl,0s) linear infinite;transition:background .8s,box-shadow .8s;}
    body.th-g .odot{--odc:rgba(0,230,118,.9);}body.th-p .odot{--odc:rgba(255,80,200,.9);}
    @keyframes odotfly{0%{transform:rotate(0deg) translateX(47px) rotate(0deg);}100%{transform:rotate(360deg) translateX(47px) rotate(-360deg);}}
    .badge{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .bl{width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--ac,#c026d3));transition:background 1.1s;}
    .bl.r{background:linear-gradient(90deg,var(--ac,#c026d3),transparent);}
    body.th-g .bl{background:linear-gradient(90deg,transparent,#00e676);}body.th-g .bl.r{background:linear-gradient(90deg,#00e676,transparent);}
    body.th-p .bl{background:linear-gradient(90deg,transparent,#ff4d8b);}body.th-p .bl.r{background:linear-gradient(90deg,#ff4d8b,transparent);}
    .bword{font-size:.57rem;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--ac,#c026d3);transition:color 1.1s;}
    body.th-g .bword{color:#00e676;}body.th-p .bword{color:#ff4d8b;}
    .bdot{width:4px;height:4px;border-radius:50%;background:var(--ac,#c026d3);box-shadow:0 0 8px var(--ac,#c026d3);animation:bdpulse 1.6s ease-in-out infinite alternate;transition:background 1.1s,box-shadow 1.1s;}
    body.th-g .bdot{background:#00e676;box-shadow:0 0 8px #00e676;}body.th-p .bdot{background:#ff4d8b;box-shadow:0 0 8px #ff4d8b;}
    @keyframes bdpulse{from{transform:scale(1);opacity:.4}to{transform:scale(2.4);opacity:1}}
    .l-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:800;font-size:2.08rem;line-height:1.18;text-align:center;color:rgba(255,255,255,.95);margin-bottom:7px;letter-spacing:-.01em;}
    .tname{display:block;font-size:2.28rem;background:linear-gradient(135deg,#d4a0ff,#c026d3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    body.th-g .tname{background:linear-gradient(135deg,#a0ffd0,#00e676);-webkit-background-clip:text;background-clip:text;animation:tglowG 2.8s ease-in-out infinite alternate;}
    body.th-p .tname{background:linear-gradient(135deg,#ff8cf8,#ff4d8b);-webkit-background-clip:text;background-clip:text;animation:tglowP 2.8s ease-in-out infinite alternate;}
    @keyframes tglowG{from{filter:drop-shadow(0 0 8px rgba(0,230,118,.3));}to{filter:drop-shadow(0 0 26px rgba(0,230,118,.82));}}
    @keyframes tglowP{from{filter:drop-shadow(0 0 8px rgba(255,80,200,.3));}to{filter:drop-shadow(0 0 26px rgba(255,80,200,.82));}}
    .l-sub{font-size:.8rem;font-style:italic;color:rgba(255,255,255,.36);text-align:center;margin-bottom:24px;min-height:1.2em;}
    .hdiv{width:100%;height:1px;margin-bottom:20px;background:linear-gradient(90deg,transparent,var(--dvc,rgba(160,80,255,.18)) 35%,var(--dvc,rgba(160,80,255,.18)) 65%,transparent);transition:background 1.1s;}
    body.th-g .hdiv{--dvc:rgba(0,230,118,.16);}body.th-p .hdiv{--dvc:rgba(255,80,200,.2);}
    .l-field{width:100%;margin-bottom:14px;position:relative;}
    .l-lbl{display:block;font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px;transition:color .35s,letter-spacing .28s;}
    .l-field:focus-within .l-lbl{letter-spacing:.24em;}
    body.th-g .l-field:focus-within .l-lbl{color:rgba(0,230,118,.72);}
    body.th-p .l-field:focus-within .l-lbl{color:rgba(255,77,139,.72);}
    .l-inp{width:100%;border-radius:14px;border:1.5px solid rgba(255,255,255,.08);background:rgba(10,5,24,.68);color:#fff;font-size:.96rem;font-family:'Inter',sans-serif;font-weight:400;outline:none;padding:14px 18px;letter-spacing:.03em;transition:border-color .3s,box-shadow .3s,background .25s,transform .18s;}
    .l-inp.pw{padding:14px 46px 14px 18px;letter-spacing:.1em;}
    .l-inp::placeholder{color:rgba(255,255,255,.16);font-weight:300;}
    .l-inp:focus{background:rgba(14,7,32,.82);transform:translateY(-1px);}
    body.th-g .l-inp:focus{border-color:rgba(0,230,118,.5);box-shadow:0 0 0 3px rgba(0,230,118,.1);}
    body.th-p .l-inp:focus{border-color:rgba(255,77,139,.5);box-shadow:0 0 0 3px rgba(255,77,139,.1);}
    .l-eye{position:absolute;right:13px;bottom:14px;background:none;border:none;cursor:pointer;font-size:.96rem;color:rgba(255,255,255,.22);padding:2px;line-height:1;transition:color .2s,transform .18s;}
    .l-eye:hover{color:rgba(255,255,255,.6);transform:scale(1.2);}
    .l-det{width:100%;font-size:.72rem;font-weight:700;display:none;align-items:center;gap:7px;margin-top:-2px;margin-bottom:7px;animation:detpop .4s cubic-bezier(.175,.885,.32,1.275);}
    .l-det.on{display:flex;}
    @keyframes detpop{from{opacity:0;transform:translateY(6px) scale(.78)}to{opacity:1;transform:translateY(0) scale(1)}}
    body.th-g .l-det{color:#00e676;}body.th-p .l-det{color:#ff4d8b;}
    .detdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:currentColor;box-shadow:0 0 8px currentColor;animation:detdp 1.1s ease-in-out infinite alternate;}
    @keyframes detdp{from{transform:scale(1)}to{transform:scale(1.85)}}
    .l-btn{width:100%;padding:15px 20px;border:none;border-radius:15px;margin-top:10px;font-size:.96rem;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:.05em;cursor:pointer;position:relative;overflow:hidden;color:#fff;background:linear-gradient(90deg,#ff4d8b,#c026d3,#e040fb);box-shadow:0 8px 28px rgba(255,60,180,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s,box-shadow .28s;display:flex;align-items:center;justify-content:center;gap:10px;}
    body.th-g .l-btn{background:linear-gradient(90deg,#00e676,#00bfa5,#00c853);box-shadow:0 8px 28px rgba(0,230,118,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);animation:btnpG 3.2s ease-in-out infinite;}
    body.th-p .l-btn{background:linear-gradient(90deg,#ff4d8b,#c026d3,#e040fb);box-shadow:0 8px 28px rgba(255,60,180,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);animation:btnpP 3.2s ease-in-out infinite;}
    @keyframes btnpG{0%,100%{box-shadow:0 8px 28px rgba(0,230,118,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);}50%{box-shadow:0 12px 40px rgba(0,230,118,.65),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(0,230,118,.08),inset 0 1px 0 rgba(255,255,255,.18);}}
    @keyframes btnpP{0%,100%{box-shadow:0 8px 28px rgba(255,60,180,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);}50%{box-shadow:0 12px 40px rgba(255,60,180,.65),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(255,60,180,.08),inset 0 1px 0 rgba(255,255,255,.18);}}
    .l-btn:hover{transform:translateY(-2px) scale(1.012);}
    body.th-g .l-btn:hover{box-shadow:0 14px 44px rgba(0,230,118,.6),0 4px 10px rgba(0,0,0,.5);}
    body.th-p .l-btn:hover{box-shadow:0 14px 44px rgba(255,60,180,.6),0 4px 10px rgba(0,0,0,.5);}
    .l-btn:active{transform:scale(.98);}
    .l-btn::before{content:'';position:absolute;top:0;left:-90%;width:48%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);transform:skewX(-18deg);animation:bshine 4s ease-in-out infinite;}
    @keyframes bshine{0%{left:-90%}30%,100%{left:145%;}}
    .btxt{position:relative;z-index:1;}.barr{position:relative;z-index:1;animation:arrbounce 1.5s ease-in-out infinite;}
    @keyframes arrbounce{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
    .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.24);transform:scale(0);animation:ripa .6s linear;pointer-events:none;}
    @keyframes ripa{to{transform:scale(5);opacity:0;}}
    .l-msg{width:100%;font-size:.75rem;font-weight:600;border-radius:11px;padding:10px 15px;margin-top:10px;text-align:center;display:none;letter-spacing:.04em;animation:msgpop .38s cubic-bezier(.175,.885,.32,1.275);}
    @keyframes msgpop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
    .l-msg.err{background:rgba(255,40,70,.12);border:1px solid rgba(255,40,70,.35);color:#ff7585;}
    .l-msg.ok{background:rgba(80,255,150,.08);border:1px solid rgba(80,255,150,.3);color:#80ffb4;}
    .l-foot{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:7px;}
    .l-footxt{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.11);font-size:.57rem;letter-spacing:.1em;font-style:italic;}
    .l-footxt span{width:14px;height:1px;background:rgba(255,255,255,.09);display:block;}
    .fdots{display:flex;gap:5px;}
    .fdots s{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.1);display:block;text-decoration:none;}
    .fdots s.on{background:var(--ac,#c026d3);box-shadow:0 0 5px var(--ac,#c026d3);transition:background .8s,box-shadow .8s;}
    body.th-g .fdots s.on{background:#00e676;box-shadow:0 0 5px #00e676;}
    body.th-p .fdots s.on{background:#ff4d8b;box-shadow:0 0 5px #ff4d8b;}
    @media(max-width:420px){.card{width:95vw;padding:34px 20px 26px;}}

    /* ════════════════════════
       CHAT PAGE
    ════════════════════════ */
    #page-chat{
      background:#0b0817;
      /* safe area insets for mobile notches */
      padding-bottom:env(safe-area-inset-bottom,0);
    }

    /* ── Header ── */
    #ch-header{
      display:flex;align-items:center;gap:12px;
      padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top,12px));
      background:rgba(18,10,30,.92);
      border-bottom:1px solid rgba(255,255,255,.06);
      flex-shrink:0;
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      position:relative;z-index:10;
    }
    #ch-back{
      background:none;border:none;cursor:pointer;
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      color:rgba(255,255,255,.65);font-size:1.1rem;
      transition:background .15s,color .15s;flex-shrink:0;
    }
    #ch-back:hover{background:rgba(255,255,255,.07);color:#fff;}
    #ch-avatar{
      width:40px;height:40px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:1.15rem;font-weight:700;flex-shrink:0;
      border:2px solid rgba(255,255,255,.08);
      transition:border-color .6s,box-shadow .6s;
    }
    body.th-g #ch-avatar{border-color:rgba(0,230,118,.3);box-shadow:0 0 12px rgba(0,230,118,.2);}
    body.th-p #ch-avatar{border-color:rgba(255,80,180,.3);box-shadow:0 0 12px rgba(255,80,180,.2);}
    #ch-info{flex:1;min-width:0;}
    #ch-name{font-size:15.5px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:.01em;}
    #ch-status{font-size:11.5px;color:rgba(255,255,255,.4);margin-top:1px;transition:color .4s;}
    #ch-status.online{color:#00e676;}

    /* ── Messages container ── */
    #ch-msgs{
      flex:1;overflow-y:auto;
      padding:16px 14px 8px;
      display:flex;flex-direction:column;
      scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
      scroll-behavior:smooth;
    }
    #ch-msgs::-webkit-scrollbar{width:3px;}
    #ch-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}

    /* ── Day separator ── */
    .day-sep{
      display:flex;align-items:center;gap:10px;
      margin:16px 0 10px;
    }
    .day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06);}
    .day-sep span{font-size:11px;color:rgba(255,255,255,.28);white-space:nowrap;font-weight:500;letter-spacing:.04em;}

    /* ── Typing indicator ── */
    #ch-typing{
      display:none;align-items:center;gap:3px;
      padding:6px 14px 2px;
    }
    #ch-typing.show{display:flex;}
    #ch-typing-wrap{
      display:flex;align-items:center;gap:4px;
      background:#1e1238;border-radius:16px;border-bottom-left-radius:4px;
      padding:10px 14px;
    }
    .tdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);animation:tdot 1.3s ease-in-out infinite;}
    .tdot:nth-child(2){animation-delay:.18s;}.tdot:nth-child(3){animation-delay:.36s;}
    @keyframes tdot{0%,70%,100%{transform:scale(1);opacity:.35;}35%{transform:scale(1.35);opacity:1;}}

    /* ── Message rows ── */
    .mrow{display:flex;margin-bottom:2px;animation:msgIn .22s cubic-bezier(.175,.885,.32,1.275);}

<script>

const USERS = {

};
let who=null, currentUser=null;

/* ══ SUPABASE ══ */
const SB_URL='https://xnkmbmhtwtnndyuzmuay.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhua21ibWh0d3RubmR5dXptdWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzU2NDksImV4cCI6MjEwMzg1MTY0OX0.ThzeYAEvAH_Xg0bH1FmJCKdKx16yeKTpNnFG6PqADzA';
let sb=null;

/* ══ CANVAS — stars + shooting stars ══ */
const CV=document.getElementById('cv'), CTX=CV.getContext('2d');
let W,H;
function rsz(){W=CV.width=innerWidth;H=CV.height=innerHeight;}
rsz(); addEventListener('resize',rsz);

const STARS=Array.from({length:320},()=>({
  x:Math.random(),y:Math.random(),r:Math.random()*1.4+.18,
  a:Math.random(),da:(Math.random()*.005+.001)*(Math.random()>.5?1:-1),
  base:Math.random()*.36+.05,warm:Math.random()>.82,
}));
const POOL=[]; let spawnT=0;

function shootCol(){
  if(who==='dharya')  return [150,255,210];
  if(who==='sadhana') return [255,150,215];
  return [210,210,255];
}
function spawnStar(){
  const a=(20+Math.random()*22)*Math.PI/180, spd=5.5+Math.random()*5;
  const [r,g,b]=shootCol();
  POOL.push({x:Math.random()*W*.85,y:Math.random()*H*.55,
    vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
    tail:100+Math.random()*200,life:50+Math.random()*50,
    maxLife:0,r,g,b,w:1+Math.random()*1.3});
  POOL[POOL.length-1].maxLife=POOL[POOL.length-1].life;
}
function frame(){
  CTX.clearRect(0,0,W,H);
  STARS.forEach(s=>{
    s.a+=s.da; if(s.a>1||s.a<0)s.da*=-1;
    const a=(s.base*Math.abs(s.a)).toFixed(3);
    CTX.beginPath();CTX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    CTX.fillStyle=s.warm?`rgba(255,225,200,${a})`:`rgba(215,215,255,${a})`;CTX.fill();
  });
  if(++spawnT>=65){spawnStar();if(Math.random()>.68)setTimeout(spawnStar,180+Math.random()*200);spawnT=0;}
  for(let i=POOL.length-1;i>=0;i--){
    const s=POOL[i];s.x+=s.vx;s.y+=s.vy;s.life--;
    if(s.life<=0||s.x>W+40||s.y>H+40){POOL.splice(i,1);continue;}
    const t=1-s.life/s.maxLife;
    let al=t<.10?t/.10:t>.78?1-(t-.78)/.22:1;
    al=Math.max(0,Math.min(1,al));
    const{r,g,b}=s,ang=Math.atan2(s.vy,s.vx);
    const tx=s.x-Math.cos(ang)*s.tail,ty=s.y-Math.sin(ang)*s.tail;
    const gr=CTX.createLinearGradient(tx,ty,s.x,s.y);
    gr.addColorStop(0,`rgba(${r},${g},${b},0)`);
    gr.addColorStop(.45,`rgba(${r},${g},${b},${+(al*.12).toFixed(3)})`);
    gr.addColorStop(.82,`rgba(${r},${g},${b},${+(al*.5).toFixed(3)})`);
    gr.addColorStop(1,`rgba(${r},${g},${b},${+(al*.92).toFixed(3)})`);
    CTX.save();CTX.beginPath();CTX.moveTo(tx,ty);CTX.lineTo(s.x,s.y);
    CTX.strokeStyle=gr;CTX.lineWidth=s.w;CTX.lineCap='round';CTX.stroke();CTX.restore();
    const cr=s.w*1.8+1;
    const cg=CTX.createRadialGradient(s.x,s.y,0,s.x,s.y,cr);
    cg.addColorStop(0,`rgba(${r},${g},${b},${+al.toFixed(3)})`);cg.addColorStop(1,`rgba(${r},${g},${b},0)`);
    CTX.beginPath();CTX.arc(s.x,s.y,cr,0,Math.PI*2);CTX.fillStyle=cg;CTX.fill();
    const hg=CTX.createRadialGradient(s.x,s.y,0,s.x,s.y,cr*4.5);
    hg.addColorStop(0,`rgba(${r},${g},${b},${+(al*.32).toFixed(3)})`);
    hg.addColorStop(.45,`rgba(${r},${g},${b},${+(al*.1).toFixed(3)})`);hg.addColorStop(1,`rgba(${r},${g},${b},0)`);
    CTX.beginPath();CTX.arc(s.x,s.y,cr*4.5,0,Math.PI*2);CTX.fillStyle=hg;CTX.fill();
  }
  requestAnimationFrame(frame);
}
frame();
function shootBurst(n=8){for(let i=0;i<n;i++)setTimeout(spawnStar,i*80);}

/* ══ 3D TILT ══ */
const card=document.getElementById('card');
addEventListener('mousemove',e=>{
  if(document.getElementById('page-chat').classList.contains('show'))return;
  const dx=(e.clientX-W/2)/(W/2),dy=(e.clientY-H/2)/(H/2);

/* ══ CHAT ENGINE ══ */
const CHAT_KEY='dharya_chat_v1', PRESENCE_KEY='dharya_presence_v1', CHAT_ID='dharya-surya-sadhana';
let messages=[],replyToMsg=null,ctxTargetId=null,typingTimer=null;
let realtimeCh=null,bc=null,heartbeatId=null,useSupabase=false;
let unreadCount=0;

const PARTNER={
  dharya: {name:'Sadhana',emoji:'🌸',color:'#f472b6'},
  sadhana:{name:'Surya',  emoji:'🌿',color:'#34d399'},
};

function markPresence(on){
  try{const pr=JSON.parse(localStorage.getItem(PRESENCE_KEY)||'{}');pr[currentUser]=on?Date.now():0;localStorage.setItem(PRESENCE_KEY,JSON.stringify(pr));if(bc)bc.postMessage({type:'presence',user:currentUser,online:on});}catch(e){}
}
function isPartnerOnline(){
  try{const pr=JSON.parse(localStorage.getItem(PRESENCE_KEY)||'{}');const pk=currentUser==='dharya'?'sadhana':'dharya';return(Date.now()-(pr[pk]||0))<8000;}catch(e){return false;}
}

async function initChat(key){
  const p=PARTNER[key];
  const av=document.getElementById('ch-avatar');
  av.textContent=p.emoji;av.style.background=p.color+'22';av.style.color=p.color;
  document.getElementById('ch-name').textContent=p.name;
  document.getElementById('ch-status').textContent='connecting…';
  document.getElementById('ch-status').classList.remove('online');

  useSupabase=!!(SB_URL&&SB_KEY);
  if(useSupabase){
    try{sb=supabase.createClient(SB_URL,SB_KEY);await loadFromSB();subscribeSB();}
    catch(err){console.warn('SB unavailable',err);useSupabase=false;}
  }
  if(!useSupabase){
    try{messages=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');}catch(e){messages=[];}
    initBC();
  }

  markPresence(true);updateStatus();
  heartbeatId=setInterval(()=>{markPresence(true);updateStatus();},4000);
  await markIncomingRead();
  renderMessages();scrollToBottom();

  const txt=document.getElementById('ch-text');
  txt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  txt.addEventListener('input',()=>{autoResize(txt);handleTyping();});
  txt.addEventListener('blur',stopTyping);

  window.addEventListener('storage',e=>{
    if(e.key===CHAT_KEY&&!useSupabase){try{messages=JSON.parse(e.newValue||'[]');}catch(x){messages=[];}markIncomingRead();renderMessages();scrollIfAtBottom();}
    if(e.key===PRESENCE_KEY)updateStatus();
  });
  document.getElementById('ch-msgs').addEventListener('scroll',onScroll);
  document.addEventListener('click',closeMenus);
  setInterval(updateStatus,3000);
  window.addEventListener('beforeunload',()=>{markPresence(false);clearInterval(heartbeatId);if(realtimeCh)realtimeCh.unsubscribe();if(bc){bc.postMessage({type:'presence',user:currentUser,online:false});bc.close();}});
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,130)+'px';}

async function loadFromSB(){
  const{data,error}=await sb.from('messages').select('*').eq('chat_id',CHAT_ID).order('created_at',{ascending:true});
  if(error)throw error;
  messages=(data||[]).filter(r=>!(r.deleted_for||[]).includes(currentUser)).map(dbToMsg);
}

function subscribeSB(){
  realtimeCh=sb.channel(`chat:${CHAT_ID}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`chat_id=eq.${CHAT_ID}`},async(payload)=>{
      const row=payload.new;
      if((row.deleted_for||[]).includes(currentUser))return;
      const msg=dbToMsg(row);
      if(!messages.find(m=>m.id===row.id))messages.push(msg);
      else messages=messages.map(m=>m.id===row.id?msg:m);
      if(row.sender_id!==currentUser){
        await sb.from('messages').update({status:'read',read_at:new Date().toISOString()}).eq('id',row.id);
      }
      const atBottom=isAtBottom();
      renderMessages();
      if(atBottom)scrollToBottom();
      else{unreadCount++;updateJumpBadge();}
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`chat_id=eq.${CHAT_ID}`},(payload)=>{
      const row=payload.new;
      if((row.deleted_for||[]).includes(currentUser))messages=messages.filter(m=>m.id!==row.id);
      else{const msg=dbToMsg(row);messages=messages.map(m=>m.id===row.id?msg:m);if(!messages.find(m=>m.id===row.id))messages.push(msg);}
      renderMessages();
    })
    .subscribe(s=>{
      const online=isPartnerOnline();
      document.getElementById('ch-status').textContent=s==='SUBSCRIBED'?(online?'online':'last seen recently'):'connecting…';
      if(s==='SUBSCRIBED'&&online)document.getElementById('ch-status').classList.add('online');
    });
}

function dbToMsg(row){
  return{id:row.id,sender:row.sender_id,content:row.content,time:new Date(row.created_at).getTime(),
    status:row.status||'sent',replyTo:row.reply_to||null,reactions:row.reactions||{},
    edited:!!row.edited_at,deletedForAll:row.deleted_for_all||false,deletedFor:row.deleted_for||[]};
}

function initBC(){
  try{
    bc=new BroadcastChannel('dharya_realtime');
    bc.onmessage=(e)=>{
      const{type,data}=e.data;
      if(type==='msg'){try{messages=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');}catch(x){}markIncomingRead();renderMessages();scrollIfAtBottom();}
      if(type==='status_update'){try{messages=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');}catch(x){}renderMessages();}
      if(type==='typing'&&data.user!==currentUser){const ti=document.getElementById('ch-typing');if(data.typing)ti.classList.add('show');else ti.classList.remove('show');}
      if(type==='presence')updateStatus();
    };
  }catch(e){bc=null;}
}

async function markIncomingRead(){
  let changed=false;
  if(useSupabase){
    const unread=messages.filter(m=>m.sender!==currentUser&&m.status!=='read');
    if(unread.length){await sb.from('messages').update({status:'read',read_at:new Date().toISOString()}).in('id',unread.map(m=>m.id));unread.forEach(m=>{m.status='read';});changed=true;}
  }else{
    messages.forEach(m=>{if(m.sender!==currentUser&&m.status!=='read'){m.status='read';changed=true;}});
    if(changed){saveLocal(false);if(bc)bc.postMessage({type:'status_update'});}
  }
}

function updateStatus(){
  const on=isPartnerOnline();
  const el=document.getElementById('ch-status');
  el.textContent=on?'online':'last seen recently';
  if(on)el.classList.add('online');else el.classList.remove('online');
}

function saveLocal(broadcast=true){localStorage.setItem(CHAT_KEY,JSON.stringify(messages));if(broadcast&&bc)bc.postMessage({type:'msg'});}

function isAtBottom(){const a=document.getElementById('ch-msgs');return a.scrollHeight-a.scrollTop-a.clientHeight<100;}
function scrollIfAtBottom(){if(isAtBottom())scrollToBottom();}

/* ══ RENDER ══ */
function renderMessages(){
  const area=document.getElementById('ch-msgs');
  const empty=document.getElementById('ch-empty');
  if(!messages.length){empty.style.display='flex';return;}
  empty.style.display='none';

  const sorted=[...messages].sort((a,b)=>a.time-b.time);
  let lastDay='',frags=[];

  sorted.forEach((msg,idx)=>{
    if(!msg)return;
    const d=new Date(msg.time);
    const day=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if(day!==lastDay){lastDay=day;frags.push(`<div class="day-sep"><span>${day}</span></div>`);}
    const html=renderBubble(msg,sorted[idx-1],sorted[idx+1]);
    if(html)frags.push(html);
  });

  const wasAtBottom=isAtBottom();
  area.innerHTML='<div id="ch-empty" style="display:none"><div class="em-icon">✦</div><p>Your private space.<br>Say something beautiful.</p></div>';
  area.insertAdjacentHTML('beforeend',frags.join(''));

  area.querySelectorAll('.bub[data-id]').forEach(el=>{
    el.addEventListener('contextmenu',e=>{e.preventDefault();showCtxMenu(e,el.dataset.id);});
    el.addEventListener('dblclick',()=>showReactPicker(el.dataset.id,el));
  });

  if(wasAtBottom)scrollToBottom();
}

function renderBubble(msg,prev,next){
  if(!msg||msg.deletedFor?.includes(currentUser))return '';
  const mine=msg.sender===currentUser;
  const t=new Date(msg.time);
  const timeStr=t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const prevSame=prev&&prev.sender===msg.sender&&(msg.time-prev.time)<180000;
  const nextSame=next&&next.sender===msg.sender&&(next.time-msg.time)<180000;

  let bubClass='bub';
  if(!prevSame)bubClass+=mine?' bub-tl':' bub-tl';
  if(!nextSame)bubClass+=' bub-bl';

  if(msg.deletedForAll){
    return `<div class="mrow ${mine?'mine':'theirs'} ${nextSame?'':'tail-end'}">
      <div class="${bubClass} deleted" data-id="${msg.id}">
        <span class="bub-text" style="font-style:italic;opacity:.5;">This message was deleted</span>
      </div></div>`;
  }

  let repEl='';
  if(msg.replyTo){
    const orig=messages.find(m=>m.id===msg.replyTo);
    if(orig)repEl=`<div class="rep-prev"><span>↩ ${escHtml(orig.content)||'📎 media'}</span></div>`;
  }

  const editEl=msg.edited?`<span class="edited-tag">edited</span>`:'';
  const statEl=mine?statusSVG(msg.status||'sent'):'';

  let reactEl='';
  const rkeys=Object.keys(msg.reactions||{}).filter(e=>msg.reactions[e]?.length>0);
  if(rkeys.length){
    reactEl='<div class="bub-reacts">';
    rkeys.forEach(emoji=>{
      const users=msg.reactions[emoji];
      const iMine=users.includes(currentUser);
      reactEl+=`<span class="react-chip${iMine?' mine-react':''}" onclick="toggleReaction('${msg.id}','${emoji}')">
        ${emoji}<span class="react-count">${users.length>1?users.length:''}</span></span>`;
    });
    reactEl+='</div>';
  }

  return `<div class="mrow ${mine?'mine':'theirs'} ${nextSame?'':'tail-end'}">
    <div class="${bubClass}" data-id="${msg.id}">
      ${repEl}
      <div class="bub-text">${escHtml(msg.content)}</div>
      <div class="bub-foot">${editEl}<span class="bub-time">${timeStr}</span>${statEl}</div>
    </div>${reactEl}
  </div>`;
}

function escHtml(s){if(!s)return '';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

/* ══ SEND ══ */
async function sendMsg(){
  const txt=document.getElementById('ch-text');
  const text=txt.value.trim();if(!text)return;
  txt.value='';txt.style.height='';stopTyping();

  const oid=`opt_${Date.now()}`;
  const opt={id:oid,sender:currentUser,content:text,time:Date.now(),status:'sending',replyTo:replyToMsg?.id||null,reactions:{},edited:false,deletedForAll:false,deletedFor:[]};
  messages.push(opt);clearReply();renderMessages();scrollToBottom();

  if(useSupabase){
    try{
      const{data,error}=await sb.from('messages').insert({
        chat_id:CHAT_ID,sender_id:currentUser,content:text,status:'sent',
        reply_to:replyToMsg?.id||null,reactions:{},deleted_for:[],deleted_for_all:false,
      }).select().single();
      if(error)throw error;
      messages=messages.map(m=>m.id===oid?dbToMsg(data):m);renderMessages();
    }catch(err){
      console.error('Send failed:',err);
      messages=messages.map(m=>m.id===oid?{...m,status:'sent'}:m);renderMessages();
    }
  }else{
    messages=messages.map(m=>m.id===oid?{...m,status:isPartnerOnline()?'delivered':'sent'}:m);
    saveLocal(true);renderMessages();
    if(isPartnerOnline())setTimeout(()=>{messages=messages.map(m=>m.id===oid?{...m,status:'read'}:m);saveLocal(false);renderMessages();},1200);
  }
}

/* ══ REACTIONS ══ */
let rpickTarget=null;
function showReactPicker(id,el){
  rpickTarget=id;
  const rect=el.getBoundingClientRect();
  const p=document.getElementById('rpicker');
  const left=Math.min(rect.left,innerWidth-260);
  const top=Math.max(10,rect.top-64);
  p.style.left=left+'px';p.style.top=top+'px';p.classList.add('show');
}
document.getElementById('rpicker').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',e=>{
    e.stopPropagation();if(!rpickTarget)return;
    toggleReaction(rpickTarget,btn.dataset.e);
    document.getElementById('rpicker').classList.remove('show');rpickTarget=null;
  });
});
async function toggleReaction(msgId,emoji){
  const m=messages.find(x=>x.id===msgId);if(!m)return;
  if(!m.reactions)m.reactions={};
  if(!m.reactions[emoji])m.reactions[emoji]=[];
  const idx=m.reactions[emoji].indexOf(currentUser);
  if(idx>-1)m.reactions[emoji].splice(idx,1);else m.reactions[emoji].push(currentUser);
  if(!m.reactions[emoji].length)delete m.reactions[emoji];
  if(useSupabase)await sb.from('messages').update({reactions:m.reactions}).eq('id',msgId);
  else saveLocal(true);
  renderMessages();
}

function showCtxMenu(e,id){

function closeMenus(e){

}

document.getElementById('ctx-react').onclick=()=>{

};
document.getElementById('ctx-edit').onclick=async()=>{
  const m=messages.find(x=>x.id===ctxTargetId);if(!m)return;
  const val=window.prompt('Edit message:',m.content);
  if(val===null||!val.trim()){document.getElementById('ctxmenu').classList.remove('show');return;}
  m.content=val.trim();m.edited=true;
  if(useSupabase)await sb.from('messages').update({content:m.content,edited_at:new Date().toISOString()}).eq('id',m.id);
  else saveLocal(true);
  renderMessages();document.getElementById('ctxmenu').classList.remove('show');
};
document.getElementById('ctx-del-me').onclick=async()=>{
  const m=messages.find(x=>x.id===ctxTargetId);if(!m)return;
  if(!m.deletedFor)m.deletedFor=[];
  if(!m.deletedFor.includes(currentUser))m.deletedFor.push(currentUser);
  if(useSupabase){await sb.from('messages').update({deleted_for:m.deletedFor}).eq('id',m.id);messages=messages.filter(x=>x.id!==m.id);}
  else saveLocal(false);
  renderMessages();document.getElementById('ctxmenu').classList.remove('show');
};
document.getElementById('ctx-del-all').onclick=async()=>{
  const m=messages.find(x=>x.id===ctxTargetId);if(!m)return;
  m.deletedForAll=true;m.content='';
  if(useSupabase)await sb.from('messages').update({deleted_for_all:true,content:''}).eq('id',m.id);
  else saveLocal(true);
  renderMessages();document.getElementById('ctxmenu').classList.remove('show');
};

/* ══ SCROLL ══ */
function scrollToBottom(){
  const a=document.getElementById('ch-msgs');
  a.scrollTo({top:a.scrollHeight,behavior:'smooth'});
  unreadCount=0;updateJumpBadge();
}
function onScroll(){
  const show=!isAtBottom();
  document.getElementById('jump-btn').classList.toggle('show',show);
  if(!show){unreadCount=0;updateJumpBadge();}
}
function updateJumpBadge(){
  const b=document.getElementById('jump-badge');
  if(unreadCount>0){b.textContent=unreadCount>9?'9+':unreadCount;b.classList.add('show');}
  else{b.classList.remove('show');}
}
</script>
