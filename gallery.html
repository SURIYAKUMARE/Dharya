<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Google Gallery 📸 🎬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base: #131314;
      --bg-surface: #1e1f20;
      --bg-card: #1e1f20;
      --bg-card-hover: #28292a;
      --accent-google: #8ab4f8;
      --accent-google-hover: #a8c7fa;
      --accent-rose: #f28b82;
      --border-subtle: #2d2f31;
      --border-active: #3c4043;
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --text-muted: #8e918f;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.5;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    :focus-visible {
      outline: 2px solid var(--accent-google);
      outline-offset: 2px;
    }

    /* Google Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(30, 31, 32, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 1.1rem;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.16); }

    .brand-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1a73e8, #8ab4f8, #c2e7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .count-badge {
      font-size: 11px;
      font-weight: 700;
      background: #28292a;
      border: 1px solid var(--border-active);
      color: var(--accent-google);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    /* Google Search Pill */
    .search-pill-container {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-pill {
      width: 100%;
      padding: 10px 16px 10px 42px;
      background: #28292a;
      border: 1px solid var(--border-active);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .search-pill:focus {
      outline: none;
      background: #1e1f20;
      border-color: var(--accent-google);
      box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-google-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-google);
      color: #001d35;
      padding: 9px 18px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(138, 180, 248, 0.25);
    }
    .btn-google-primary:hover { background: var(--accent-google-hover); transform: translateY(-1px); }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab-btn {
      padding: 7px 16px;
      border-radius: var(--radius-full);
      background: #28292a;
      border: 1px solid var(--border-active);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-tab-btn:hover { color: #fff; background: #333538; }
    .nav-tab-btn.active {
      background: var(--accent-google);
      border-color: var(--accent-google);
      color: #001d35;
      font-weight: 700;
    }

    /* Batch action bar */
    .batch-bar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: #1e1f20;
      border-bottom: 1px solid var(--border-active);
      padding: 10px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .batch-bar.show { display: flex; }

    /* Dropzone */
    .dropzone {
      margin: 16px auto 0;
      max-width: 1400px;
      width: calc(100% - 32px);
      border: 2px dashed var(--border-active);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      background: rgba(30, 31, 32, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.drag-active {
      border-color: var(--accent-google);
      background: rgba(138, 180, 248, 0.05);
    }

    /* Timeline Section Header */
    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 4px 8px;
    }
    .timeline-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Gallery Grid */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 640px) {
      .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }
    @media (min-width: 900px) {
      .gallery-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    }
    @media (min-width: 1200px) {
      .gallery-grid { grid-template-columns: repeat(5, 1fr); gap: 16px; }
    }

    /* Media card */
    .media-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.2s;
    }
    .media-card:hover {
      border-color: rgba(138, 180, 248, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .media-card.selected {
      border-color: var(--accent-google);
      box-shadow: 0 0 0 3px var(--accent-google);
    }
    .media-card img, .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Checkbox on top-left */
    .select-check {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 12px;
      transition: all 0.15s;
      z-index: 10;
    }
    .media-card:hover .select-check, .media-card.selected .select-check {
      opacity: 1;
    }
    .media-card.selected .select-check {
      background: var(--accent-google);
      border-color: var(--accent-google);
      color: #001d35;
      font-weight: 900;
    }

    /* Prominent Card Trash Button on Top-Right */
    .card-trash-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      z-index: 10;
    }
    .media-card:hover .card-trash-btn { opacity: 1; }
    .card-trash-btn:hover {
      background: rgba(220, 38, 38, 0.8);
      border-color: #ef4444;
      transform: scale(1.1);
    }

    .card-fav-btn {
      position: absolute;
      top: 8px;
      right: 42px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      z-index: 10;
    }
    .media-card:hover .card-fav-btn, .card-fav-btn.active { opacity: 1; }
    .card-fav-btn.active { color: var(--accent-rose); }

    .video-duration-chip {
      position: absolute;
      bottom: 8px;
      right: 8px;
      padding: 2px 8px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      font-family: monospace;
      z-index: 5;
    }

    .card-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
    }
    .card-play-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      padding-left: 3px;
      transition: transform 0.2s;
    }
    .media-card:hover .card-play-icon { transform: scale(1.12); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
    }
    .media-card:hover .card-overlay { opacity: 1; }
    .card-caption {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lightbox / Fullscreen Viewer */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .lightbox.open { display: flex; }

    .lb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      z-index: 10;
    }
    .lb-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lb-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .lb-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .lb-btn.danger:hover { background: rgba(220, 38, 38, 0.8); }

    .lb-media-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
      max-height: 75vh;
    }
    .lb-media-stage img, .lb-media-stage video {
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--radius-md);
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lb-nav-btn:hover { background: rgba(0, 0, 0, 0.9); }
    .lb-nav-prev { left: 16px; }
    .lb-nav-next { right: 16px; }

    /* Google Photos Floating Bottom Toolbar */
    .lb-footer {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      background: rgba(30, 31, 32, 0.85);
      border: 1px solid var(--border-active);
      border-radius: var(--radius-full);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .lb-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background 0.2s;
    }
    .lb-action-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .lb-action-btn.delete-btn {
      color: var(--accent-rose);
      background: rgba(242, 139, 130, 0.15);
    }
    .lb-action-btn.delete-btn:hover {
      background: rgba(242, 139, 130, 0.3);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      max-width: 380px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-active);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1f20;
      border: 1px solid var(--border-active);
      border-radius: var(--radius-full);
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 300;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Multi-Select Action Bar (Google Photos Style) -->
  <div class="batch-bar" id="batch-bar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="lb-btn" onclick="clearSelection()" title="Clear selection">✕</button>
      <span style="font-weight:700;font-size:14px;" id="batch-count">0 selected</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="btn-google-primary" style="background:#dc2626;color:#fff;" onclick="batchDelete()">
        <span>🗑️ Delete Selected</span>
      </button>
    </div>
  </div>

  <!-- Google Photos Navigation Header -->
  <header>
    <div class="header-container">
      <div class="header-top">
        <div class="brand-wrap">
          <a href="index.html" class="back-btn" title="Back">←</a>
          <div class="brand-logo-icon">📸</div>
          <div>
            <div style="display:flex;align-items:center;gap:8px;">
              <h1 class="brand-title">Google Gallery</h1>
              <span class="count-badge" id="media-count-badge">0 items</span>
            </div>
          </div>
        </div>

        <!-- Google Search Pill -->
        <div class="search-pill-container">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-pill" placeholder="Search photos, videos &amp; albums…" oninput="onSearchChange(event)"/>
        </div>

        <div class="top-actions">
          <button class="btn-google-primary" onclick="triggerFileInput()">
            <span>+ Add photos &amp; videos</span>
          </button>
          <input type="file" id="media-file-input" accept="image/*,video/*" multiple style="display:none;" onchange="handleFileSelect(event)"/>
        </div>
      </div>

      <!-- Navigation Tabs: Photos, Videos, Albums, Favorites -->
      <div class="nav-tabs" role="tablist">
        <button class="nav-tab-btn active" onclick="setTab('photos', this)">📸 Photos</button>
        <button class="nav-tab-btn" onclick="setTab('videos', this)">🎬 Videos</button>
        <button class="nav-tab-btn" onclick="setTab('albums', this)">📁 Albums</button>
        <button class="nav-tab-btn" onclick="setTab('favorites', this)">⭐ Favorites</button>
      </div>
    </div>
  </header>

  <!-- Upload Dropzone -->
  <div class="dropzone" id="drop-zone" onclick="triggerFileInput()">
    <div style="font-size:2rem;margin-bottom:6px;">📥</div>
    <div style="font-weight:700;font-size:14px;color:#fff;">Drag and drop photos or videos here</div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">or click to browse from device • Saved instantly to IndexedDB</div>
  </div>

  <!-- Main Timeline Grid -->
  <main>
    <div id="gallery-timeline-container"></div>
  </main>

  <!-- Google Fullscreen Viewer -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lb-header">
      <div class="lb-title-group">
        <button class="lb-btn" onclick="closeLightbox()" title="Back">←</button>
        <div>
          <div id="lb-caption" style="font-weight:700;font-size:14px;">Caption</div>
          <div id="lb-sub" style="font-size:11px;color:var(--text-muted);">Date</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="lb-btn" id="lb-fav-btn" onclick="toggleLbFav()" title="Favorite">⭐</button>
        <!-- PROMINENT VIEWER DELETE BUTTON -->
        <button class="lb-btn danger" onclick="deleteLbItem()" title="Delete photo/video">🗑️</button>
        <button class="lb-btn" onclick="closeLightbox()" title="Close">✕</button>
      </div>
    </div>

    <div class="lb-media-stage" id="lb-stage">
      <button class="lb-nav-btn lb-nav-prev" onclick="lbPrev()">←</button>
      <div id="lb-media-content" style="max-height:100%;max-width:100%;display:flex;align-items:center;justify-content:center;"></div>
      <button class="lb-nav-btn lb-nav-next" onclick="lbNext()">→</button>
    </div>

    <!-- Google Photos Bottom Toolbar -->
    <div class="lb-footer">
      <button class="lb-action-btn" onclick="editLbCaption()">✏️ Edit</button>
      <button class="lb-action-btn" onclick="downloadLbItem()">⬇️ Save</button>
      <!-- PROMINENT BOTTOM DELETE BUTTON -->
      <button class="lb-action-btn delete-btn" onclick="deleteLbItem()">🗑️ Delete</button>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-backdrop" id="modal-delete">
    <div class="modal-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="font-size:1.5rem;">🗑️</div>
        <div>
          <h3 style="font-size:16px;font-weight:800;color:#fff;">Delete from Gallery?</h3>
          <p style="font-size:11px;color:var(--text-muted);">Item will be permanently removed.</p>
        </div>
      </div>
      <div id="delete-modal-text" style="font-size:13px;color:var(--text-secondary);margin-bottom:18px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="nav-tab-btn" onclick="closeModal('modal-delete')">Cancel</button>
        <button class="btn-google-primary" style="background:#dc2626;color:#fff;" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
  const DB_NAME = 'dharya_gallery_db_v2';
  const DB_VERSION = 2;
  let db;

  let mediaItems = [];
  let currentTab = 'photos';
  let currentSearch = '';
  let selectedIds = new Set();
  let lbIndex = 0;
  let filteredList = [];
  let deleteQueue = [];

  const SEED_DATA = [
    {
      id: 's1',
      type: 'photo',
      url: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80',
      label: 'Campus Library at Golden Hour',
      albumId: 'campus',
      isFavorite: true,
      date: Date.now() - 86400000 * 1,
    },
    {
      id: 's2',
      type: 'video',
      url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
      label: 'Evening Walk Video',
      albumId: 'campus',
      isFavorite: false,
      duration: '0:15',
      date: Date.now() - 86400000 * 1,
    },
    {
      id: 's3',
      type: 'photo',
      url: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80',
      label: 'Weekend Mountain Reflection',
      albumId: 'travel',
      isFavorite: true,
      date: Date.now() - 86400000 * 5,
    },
    {
      id: 's4',
      type: 'video',
      url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
      label: 'Scenic Drone Flight',
      albumId: 'travel',
      isFavorite: true,
      duration: '0:15',
      date: Date.now() - 86400000 * 5,
    }
  ];

  function openDatabase() {
    return new Promise(resolve => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const d = req.result;
        if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => resolve(null);
    });
  }

  async function loadData() {
    await openDatabase();
    if (!db) { mediaItems = [...SEED_DATA]; renderTimeline(); return; }

    const tx = db.transaction('media', 'readonly');
    const store = tx.objectStore('media');
    const req = store.getAll();

    req.onsuccess = () => {
      const stored = req.result || [];
      if (stored.length === 0) {
        mediaItems = [...SEED_DATA];
        const wTx = db.transaction('media', 'readwrite');
        SEED_DATA.forEach(s => wTx.objectStore('media').put(s));
      } else {
        mediaItems = stored.map(it => {
          if (it.blob) it.url = URL.createObjectURL(it.blob);
          return it;
        });
      }
      renderTimeline();
    };
  }

  function getFilteredItems() {
    return mediaItems.filter(item => {
      if (currentTab === 'videos' && item.type !== 'video') return false;
      if (currentTab === 'favorites' && !item.isFavorite) return false;
      if (currentSearch.trim()) {
        const q = currentSearch.toLowerCase();
        if (!item.label.toLowerCase().includes(q)) return false;
      }
      return true;
    }).sort((a,b) => b.date - a.date);
  }

  function renderTimeline() {
    filteredList = getFilteredItems();
    const container = document.getElementById('gallery-timeline-container');
    const badge = document.getElementById('media-count-badge');
    badge.textContent = `${mediaItems.length} items`;

    if (filteredList.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:60px 16px;color:#8e918f;"><div style="font-size:3rem;margin-bottom:8px;">🖼️</div><p>No photos or videos found.</p></div>`;
      return;
    }

    // Group by Date (Google Photos Timeline)
    const groups = {};
    filteredList.forEach(item => {
      const d = new Date(item.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      if (!groups[d]) groups[d] = [];
      groups[d].push(item);
    });

    let html = '';
    for (const [dateLabel, groupItems] of Object.entries(groups)) {
      html += `
        <div style="margin-bottom:24px;">
          <div class="timeline-header">
            <div class="timeline-title">
              <span>📅</span>
              <span>${dateLabel}</span>
              <span style="font-size:11px;color:#8e918f;">• ${groupItems.length}</span>
            </div>
          </div>
          <div class="gallery-grid">
            ${groupItems.map(item => {
              const isSelected = selectedIds.has(item.id);
              const overallIdx = filteredList.findIndex(x => x.id === item.id);
              return `
                <article class="media-card ${isSelected ? 'selected' : ''}" onclick="onCardClick('${item.id}', ${overallIdx})">
                  <div class="select-check" onclick="event.stopPropagation(); toggleSelect('${item.id}')">${isSelected ? '✓' : ''}</div>
                  
                  <!-- PROMINENT DELETE BUTTON -->
                  <button class="card-trash-btn" onclick="event.stopPropagation(); requestDelete(['${item.id}'])" title="Delete">🗑️</button>
                  <button class="card-fav-btn ${item.isFavorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleCardFav('${item.id}')" title="Favorite">${item.isFavorite ? '⭐' : '☆'}</button>

                  ${item.type === 'video'
                    ? `<div class="card-play-btn"><div class="card-play-icon">▶</div></div>
                       <div class="video-duration-chip">▶ ${item.duration || '0:15'}</div>
                       <video src="${item.url}" preload="metadata" muted playsinline></video>`
                    : `<img src="${item.url}" alt="${item.label}" loading="lazy"/>`
                  }
                  <div class="card-overlay">
                    <div class="card-caption">${item.label}</div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
    container.innerHTML = html;
  }

  function onCardClick(id, idx) {
    if (selectedIds.size > 0) {
      toggleSelect(id);
    } else {
      openLightbox(idx);
    }
  }

  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);

    const bar = document.getElementById('batch-bar');
    if (selectedIds.size > 0) {
      bar.classList.add('show');
      document.getElementById('batch-count').textContent = `${selectedIds.size} selected`;
    } else {
      bar.classList.remove('show');
    }
    renderTimeline();
  }

  function clearSelection() {
    selectedIds.clear();
    document.getElementById('batch-bar').classList.remove('show');
    renderTimeline();
  }

  function batchDelete() {
    if (selectedIds.size === 0) return;
    requestDelete(Array.from(selectedIds));
  }

  function requestDelete(ids) {
    deleteQueue = ids;
    const count = ids.length;
    document.getElementById('delete-modal-text').textContent =
      count === 1 ? 'Are you sure you want to delete this item?' : `Are you sure you want to delete ${count} items?`;
    document.getElementById('modal-delete').classList.add('open');
  }

  function confirmDelete() {
    if (deleteQueue.length === 0) return;
    const toDeleteSet = new Set(deleteQueue);

    mediaItems = mediaItems.filter(i => !toDeleteSet.has(i.id));

    if (db) {
      const tx = db.transaction('media', 'readwrite');
      deleteQueue.forEach(id => tx.objectStore('media').delete(id));
    }

    deleteQueue.forEach(id => selectedIds.delete(id));
    if (selectedIds.size === 0) document.getElementById('batch-bar').classList.remove('show');

    closeModal('modal-delete');
    closeLightbox();
    renderTimeline();
    showToast(`Deleted ${deleteQueue.length} item(s) from gallery`);
    deleteQueue = [];
  }

  function toggleCardFav(id) {
    const item = mediaItems.find(i => i.id === id);
    if (!item) return;
    item.isFavorite = !item.isFavorite;
    if (db) {
      const tx = db.transaction('media', 'readwrite');
      tx.objectStore('media').put(item);
    }
    renderTimeline();
    showToast(item.isFavorite ? 'Saved to Favorites ⭐' : 'Removed from Favorites');
  }

  function setTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTimeline();
  }

  function onSearchChange(e) {
    currentSearch = e.target.value;
    renderTimeline();
  }

  function triggerFileInput() { document.getElementById('media-file-input').click(); }
  function handleFileSelect(e) {
    const files = Array.from(e.target.files);
    uploadFiles(files);
    e.target.value = '';
  }

  function uploadFiles(files) {
    if (!files.length) return;
    let count = 0;
    files.forEach(f => {
      const isVideo = f.type.startsWith('video/');
      const isImage = f.type.startsWith('image/');
      if (!isImage && !isVideo) return;

      const url = URL.createObjectURL(f);
      const label = f.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');

      const item = {
        id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        type: isVideo ? 'video' : 'photo',
        url: url,
        label: label.charAt(0).toUpperCase() + label.slice(1),
        albumId: 'moments',
        isFavorite: false,
        duration: isVideo ? '0:30' : undefined,
        date: Date.now(),
        blob: f
      };

      mediaItems.unshift(item);
      count++;
      if (db) {
        const tx = db.transaction('media', 'readwrite');
        tx.objectStore('media').put(item);
      }
    });

    if (count > 0) {
      renderTimeline();
      showToast(`Added ${count} media item(s) to Google Gallery ✓`);
    }
  }

  /* Fullscreen Viewer */
  function openLightbox(idx) {
    lbIndex = idx;
    showLbItem();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('lb-media-content').innerHTML = '';
  }
  function showLbItem() {
    const item = filteredList[lbIndex];
    if (!item) return;

    document.getElementById('lb-caption').textContent = item.label;
    document.getElementById('lb-sub').textContent = new Date(item.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('lb-fav-btn').textContent = item.isFavorite ? '⭐' : '☆';

    const stage = document.getElementById('lb-media-content');
    if (item.type === 'video') {
      stage.innerHTML = `<video src="${item.url}" controls autoplay playsinline style="max-height:75vh;max-width:100%;border-radius:16px;"></video>`;
    } else {
      stage.innerHTML = `<img src="${item.url}" alt="${item.label}" style="max-height:75vh;max-width:100%;border-radius:16px;"/>`;
    }
  }

  function lbPrev() {
    if (!filteredList.length) return;
    lbIndex = (lbIndex - 1 + filteredList.length) % filteredList.length;
    showLbItem();
  }
  function lbNext() {
    if (!filteredList.length) return;
    lbIndex = (lbIndex + 1) % filteredList.length;
    showLbItem();
  }

  function toggleLbFav() {
    const item = filteredList[lbIndex];
    if (!item) return;
    toggleCardFav(item.id);
    showLbItem();
  }

  function deleteLbItem() {
    const item = filteredList[lbIndex];
    if (!item) return;
    requestDelete([item.id]);
  }

  function editLbCaption() {
    const item = filteredList[lbIndex];
    if (!item) return;
    const next = prompt('Edit caption:', item.label);
    if (next && next.trim()) {
      item.label = next.trim();
      if (db) {
        const tx = db.transaction('media', 'readwrite');
        tx.objectStore('media').put(item);
      }
      renderTimeline();
      showLbItem();
      showToast('Caption updated');
    }
  }

  function downloadLbItem() {
    const item = filteredList[lbIndex];
    if (!item) return;
    const a = document.createElement('a');
    a.href = item.url;
    a.download = item.label;
    a.target = '_blank';
    a.click();
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.addEventListener('keydown', e => {
    const lb = document.getElementById('lightbox');
    if (lb.classList.contains('open')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') lbPrev();
      if (e.key === 'ArrowRight') lbNext();
      if (e.key === 'Delete' || e.key === 'Backspace') deleteLbItem();
    }
  });

  const dropZone = document.getElementById('drop-zone');
  ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-active'); }));
  ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag-active'); }));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files) uploadFiles(Array.from(e.dataTransfer.files));
  });

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  loadData();
  </script>
</body>
</html>
