<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* ── BACKGROUND ── */
    body {
      background: #120818;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* deep purple radial glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 40%, #2a0a3a 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 70% 60%, #1a0528 0%, transparent 60%),
        radial-gradient(ellipse 100% 80% at 50% 100%, #0d0415 0%, transparent 70%);
      z-index: 0;
    }

    /* ── STARS CANVAS ── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ── SHOOTING STARS ── */
    #meteors {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .meteor {
      position: absolute;
      border-radius: 999px;
      transform-origin: left center;
      opacity: 0;
      animation: mfly var(--md,1.2s) var(--ml,0s) linear forwards;
    }
    @keyframes mfly {
      0%   { opacity: 0;   transform: rotate(var(--ma,-30deg)) translateX(0); }
      8%   { opacity: 1; }
      80%  { opacity: 0.7; }
      100% { opacity: 0;   transform: rotate(var(--ma,-30deg)) translateX(var(--mt,500px)); }
    }

    /* floating star emojis */
    .float-star {
      position: fixed;
      font-size: var(--fs, 1.2rem);
      opacity: var(--fo, 0.25);
      z-index: 2;
      pointer-events: none;
      animation: fst var(--fd, 6s) var(--fdl, 0s) ease-in-out infinite alternate;
    }
    @keyframes fst {
      from { transform: translateY(0) rotate(0deg); opacity: var(--fo, 0.2); }
      to   { transform: translateY(-18px) rotate(15deg); opacity: calc(var(--fo, 0.2) * 1.8); }
    }

    /* ── PHONE CARD ── */
    .phone-wrap {
      position: relative;
      z-index: 10;
    }

    .phone {
      width: 340px;
      min-height: 580px;
      background: linear-gradient(170deg, #1e1030 0%, #150922 50%, #110720 100%);
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 40px 100px rgba(0,0,0,0.85),
        0 0 80px rgba(180,50,200,0.1),
        inset 0 1px 0 rgba(255,255,255,0.08);
      padding: 36px 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      animation: phoneFloat 5s ease-in-out infinite;
    }
    @keyframes phoneFloat {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    /* top dots */
    .phone-dots {
      position: absolute;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 5px;
    }
    .phone-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }
    .phone-dots span:last-child { background: rgba(255,80,120,0.6); }

    /* inner glow */
    .phone::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,100,150,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── APP ICON ── */
    .app-icon {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff4d6d 0%, #ff8c42 50%, #ffb347 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 18px;
      box-shadow:
        0 8px 32px rgba(255,80,80,0.45),
        0 2px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3);
      animation: iconPop 3s ease-in-out infinite;
      position: relative;
    }
    @keyframes iconPop {
      0%,100% { transform: scale(1) rotate(0deg); box-shadow: 0 8px 32px rgba(255,80,80,0.45), 0 2px 8px rgba(0,0,0,0.4); }
      50%     { transform: scale(1.06) rotate(-2deg); box-shadow: 0 12px 44px rgba(255,100,80,0.6), 0 2px 8px rgba(0,0,0,0.4); }
    }
    .icon-sparkle {
      font-size: 2rem;
      filter: drop-shadow(0 0 6px rgba(255,220,100,0.8));
    }

    /* ── WELCOME BADGE ── */
    .badge {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }
    .badge-line {
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8944a);
    }
    .badge-line.r { background: linear-gradient(90deg, #e8944a, transparent); }
    .badge span {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #e8944a;
    }
    .badge-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e8944a;
      box-shadow: 0 0 6px #e8944a;
      animation: bdpulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes bdpulse { from{opacity:.5;transform:scale(1)} to{opacity:1;transform:scale(1.6)} }

    /* ── TITLE ── */
    .card-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.15;
      text-align: center;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c42 40%, #ff6b6b 80%, #e8944a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 20px rgba(255,140,66,0.4));
      animation: titleGlow 3s ease-in-out infinite alternate;
    }
    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 15px rgba(255,140,66,0.3)); }
      to   { filter: drop-shadow(0 0 28px rgba(255,140,66,0.6)); }
    }

    /* ── SUBTITLE ── */
    .card-sub {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.38);
      text-align: center;
      letter-spacing: 0.03em;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    /* ── DIVIDER ── */
    .hdiv {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin-bottom: 24px;
    }

    /* ── FIELDS ── */
    .field {
      width: 100%;
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 7px;
      padding-left: 2px;
      transition: color 0.4s;
    }
    .field:focus-within label { color: #ffb347; }

    .field input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.95);
      color: #1a0828;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      outline: none;
      transition: box-shadow 0.3s, background 0.3s;
      letter-spacing: 0.04em;
    }
    .field input::placeholder {
      color: rgba(100,80,120,0.4);
      font-weight: 400;
    }
    .field input:focus {
      background: #fff;
      box-shadow: 0 0 0 2.5px #ff8c42, 0 4px 20px rgba(255,140,66,0.25);
    }

    /* password wrapper for eye toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 42px; }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: rgba(100,80,120,0.5);
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: #ff8c42; }

    /* ── ENTER BUTTON ── */
    .enter-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, #ff4d8b 0%, #ff7043 50%, #ffb347 100%);
      color: #fff;
      box-shadow: 0 6px 28px rgba(255,80,100,0.5), 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(255,80,100,0.65), 0 2px 8px rgba(0,0,0,0.3);
    }
    .enter-btn:active { transform: scale(0.98); }
    /* shine */
    .enter-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -80%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: skewX(-18deg);
      animation: btnshine 3s ease-in-out infinite;
    }
    @keyframes btnshine { 0%{left:-80%} 40%,100%{left:130%;} }
    .arrow-icon { font-size: 1rem; animation: arrwobble 1.5s ease-in-out infinite; }
    @keyframes arrwobble { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }

    /* ripple */
    .rip {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }
    @keyframes ripple { to{transform:scale(4);opacity:0;} }

    /* ── MESSAGE ── */
    .msg {
      width: 100%;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 12px;
      text-align: center;
      display: none;
      letter-spacing: 0.04em;
      animation: msgpop 0.35s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes msgpop { from{opacity:0;transform:scale(.88) translateY(6px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .msg.err  { background:rgba(255,60,80,0.15); border:1px solid rgba(255,60,80,0.4); color:#ff7080; }
    .msg.ok-g { background:rgba(0,255,160,0.1);  border:1px solid rgba(0,255,160,0.35); color:#00ffaa; }
    .msg.ok-p { background:rgba(255,100,160,0.1); border:1px solid rgba(255,100,160,0.35); color:#ff88cc; }

    /* ── FOOTER TEXT ── */
    .card-footer {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.18);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
    }
    .card-footer span { width: 18px; height: 1px; background: rgba(255,255,255,0.15); }
    .footer-dots {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .footer-dots b {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: block;
    }
    .footer-dots b:nth-child(2) { background: rgba(255,140,66,0.5); }

    /* ── WELCOME OVERLAY ── */
    #ov {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s;
    }
    #ov.show {
      opacity: 1;
      pointer-events: all;
      backdrop-filter: blur(14px) brightness(0.5);
      -webkit-backdrop-filter: blur(14px) brightness(0.5);
    }
    .ov-icon { font-size: 4rem; animation: ovspin 2s ease-in-out infinite; }
    @keyframes ovspin { 0%,100%{transform:rotate(-12deg)scale(1)}50%{transform:rotate(12deg)scale(1.2)} }
    .ov-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.8rem);
      text-align: center;
      background: linear-gradient(135deg, #ffb347, #ff8c42, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 30px rgba(255,140,66,0.7));
      animation: ovglow 2s ease-in-out infinite alternate;
      min-height: 1.2em;
    }
    @keyframes ovglow { from{filter:drop-shadow(0 0 20px rgba(255,140,66,.5))} to{filter:drop-shadow(0 0 50px rgba(255,140,66,.9))} }
    .ov-sub { font-size: .85rem; color:rgba(255,255,255,.4); letter-spacing:.22em; text-transform:uppercase; }
    .ov-tap { font-size:.65rem; color:rgba(255,255,255,.18); letter-spacing:.14em; text-transform:uppercase; animation: tap 2.2s ease-in-out infinite; margin-top:6px; }
    @keyframes tap { 0%,100%{opacity:.18} 50%{opacity:.5} }

    /* ── PARTICLES ── */
    .pt {
      position: fixed;
      pointer-events: none;
      z-index: 150;
      animation: ptfall var(--pd,2s) var(--pde,0s) ease-out forwards;
    }
    @keyframes ptfall {
      0%  { transform:translate(0,0) rotate(0) scale(1); opacity:1; }
      100%{ transform:translate(var(--px,0),130vh) rotate(800deg) scale(.1); opacity:0; }
    }

    @media(max-width:400px) {
      .phone { width:94vw; padding:30px 22px 24px; }
    }
  </style>
</head>
<body>

  <canvas id="stars-canvas"></canvas>
  <div id="meteors"></div>

  <!-- Floating star emojis -->
  <div class="float-star" style="top:18%;left:8%;--fs:1.4rem;--fo:0.22;--fd:7s;--fdl:0s;">⭐</div>
  <div class="float-star" style="top:55%;left:5%;--fs:1rem;--fo:0.18;--fd:9s;--fdl:2s;">✦</div>
  <div class="float-star" style="top:75%;left:12%;--fs:1.6rem;--fo:0.2;--fd:6s;--fdl:1s;">★</div>
  <div class="float-star" style="top:25%;right:8%;--fs:1.2rem;--fo:0.2;--fd:8s;--fdl:3s;">✦</div>
  <div class="float-star" style="top:65%;right:6%;--fs:1.4rem;--fo:0.16;--fd:10s;--fdl:0.5s;">⭐</div>
  <div class="float-star" style="top:40%;right:15%;--fs:0.9rem;--fo:0.14;--fd:5s;--fdl:4s;">★</div>
  <div class="float-star" style="top:85%;right:18%;--fs:1.1rem;--fo:0.18;--fd:7s;--fdl:1.5s;">✦</div>
  <div class="float-star" style="top:10%;left:40%;--fs:0.8rem;--fo:0.12;--fd:11s;--fdl:2.5s;">★</div>

  <!-- Welcome overlay -->
  <div id="ov">
    <div class="ov-icon" id="ov-icon">✨</div>
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub">Welcome Back ✦</div>
    <div class="ov-tap">tap anywhere to continue</div>
  </div>

  <!-- Phone card -->
  <div class="phone-wrap">
    <div class="phone" id="phone">

      <div class="phone-dots"><span></span><span></span><span></span></div>

      <!-- App icon -->
      <div class="app-icon">
        <span class="icon-sparkle">✦</span>
      </div>

      <!-- Welcome badge -->
      <div class="badge">
        <div class="badge-dot"></div>
        <div class="badge-line"></div>
        <span>Welcome</span>
        <div class="badge-line r"></div>
        <div class="badge-dot"></div>
      </div>

      <!-- Title -->
      <h1 class="card-title">Welcome to Dharya</h1>
      <p class="card-sub">Only someone special knows the way in 🗝</p>

      <div class="hdiv"></div>

      <!-- USERNAME -->
      <div class="field">
        <label for="uid">Username</label>
        <input type="text" id="uid" placeholder="Enter username"
               autocomplete="off" spellcheck="false"
               oninput="onUID(this.value)"/>
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label for="pw">Password</label>
        <div class="pw-wrap">
          <input type="password" id="pw" placeholder="••••••••••"
                 autocomplete="off" spellcheck="false"
                 oninput="onPW(this.value)"/>
          <button class="eye-btn" id="eye" onclick="togglePw()">👁</button>
        </div>
      </div>

      <button class="enter-btn" id="btn" onclick="login()">
        Enter →&nbsp;<span class="arrow-icon">→</span>
      </button>

      <div class="msg" id="msg"></div>

      <!-- Footer -->
      <div class="card-footer">
        <span></span>
        Only someone special knows the way in
        <span></span>
      </div>
      <div class="footer-dots">
        <b></b><b></b><b></b>
      </div>
    </div>
  </div>

<script>
/* ═══════════════════════
   USERS
═══════════════════════ */
const USERS = {
  dharya:  { id:'DHARYA', pw:'09/10/2007', emoji:'🌿', name:'Dharya',  greet:'Welcome, Dharya!' },
  sadhana: { id:'DHARYA', pw:'29/02/2008', emoji:'🌸', name:'Sadhana', greet:'Welcome, Sadhana!' },
};

/* ═══════════════════════
   STARS CANVAS
═══════════════════════ */
const sc = document.getElementById('stars-canvas');
const sx = sc.getContext('2d');
let sw, sh;
function rsz(){ sw=sc.width=innerWidth; sh=sc.height=innerHeight; }
rsz(); addEventListener('resize', rsz);

// generate stars
const STARS = Array.from({length:300}, ()=>({
  x: Math.random(),
  y: Math.random(),
  r: Math.random()*1.8+0.2,
  a: Math.random(),
  da: (Math.random()*0.006+0.002)*(Math.random()>.5?1:-1),
  baseA: Math.random()*0.4+0.05,
}));

function drawStars(){
  sx.clearRect(0,0,sw,sh);
  STARS.forEach(s=>{
    s.a += s.da;
    if(s.a>1||s.a<0) s.da*=-1;
    sx.beginPath();
    sx.arc(s.x*sw, s.y*sh, s.r, 0, Math.PI*2);
    sx.fillStyle=`rgba(255,255,255,${s.baseA*Math.abs(s.a)})`;
    sx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ═══════════════════════
   METEORS
═══════════════════════ */
const ml = document.getElementById('meteors');
function spawnMeteor(){
  const el = document.createElement('div');
  el.className = 'meteor';
  const len = Math.random()*240+80;
  const travel = Math.random()*500+350;
  const dur = (Math.random()*1.0+0.7).toFixed(2);
  const delay = (Math.random()*4).toFixed(2);
  const angle = -(Math.random()*25+10);
  el.style.cssText=`
    width:${len}px;height:${Math.random()>.4?1.5:2}px;
    top:${Math.random()*70}%;left:${Math.random()*80}%;
    border-radius:999px;
    --ma:${angle}deg;--mt:${travel}px;--md:${dur}s;--ml:${delay}s;
    background:linear-gradient(90deg,transparent,rgba(255,180,100,.6) 40%,rgba(255,220,180,.9) 100%);
    box-shadow:0 0 6px rgba(255,200,150,.4);
  `;
  ml.appendChild(el);
  setTimeout(()=>el.remove(),(parseFloat(dur)+parseFloat(delay))*1000+400);
}
(function mloop(){ spawnMeteor(); setTimeout(mloop, Math.random()*900+300); })();

/* ═══════════════════════
   PHONE TILT
═══════════════════════ */
const phone = document.getElementById('phone');
addEventListener('mousemove',e=>{
  const dx=(e.clientX-innerWidth/2)/(innerWidth/2);
  const dy=(e.clientY-innerHeight/2)/(innerHeight/2);
  phone.style.animation='none';
  phone.style.transform=`rotateX(${-dy*6}deg) rotateY(${dx*6}deg) translateZ(8px)`;
});
addEventListener('mouseleave',()=>{
  phone.style.transition='transform .8s ease';
  phone.style.transform='';
  setTimeout(()=>{ phone.style.animation='phoneFloat 5s ease-in-out infinite'; phone.style.transition=''; },850);
});

/* ═══════════════════════
   INPUT HANDLERS
═══════════════════════ */
function onUID(v){ clearMsg(); }
function onPW(v){ clearMsg(); }

/* ═══════════════════════
   TOGGLE PASSWORD
═══════════════════════ */
let pvis=false;
function togglePw(){
  const inp=document.getElementById('pw');
  pvis=!pvis; inp.type=pvis?'text':'password';
  document.getElementById('eye').textContent=pvis?'🙈':'👁';
}

/* ═══════════════════════
   LOGIN
═══════════════════════ */
function login(){
  const uid=document.getElementById('uid').value.trim().toUpperCase();
  const pw =document.getElementById('pw').value.trim();
  const btn=document.getElementById('btn');

  if(!uid){ showMsg('Please enter your username ✦','err'); shake(); return; }
  if(!pw){  showMsg('Please enter your password ✦','err'); shake(); return; }

  const match=Object.entries(USERS).find(([,u])=>u.id===uid && u.pw===pw);
  if(!match){ showMsg('Incorrect username or password ✦','err'); shake(); return; }

  const [key,u]=match;
  btn.innerHTML='Entering… ✦';
  btn.style.pointerEvents='none';
  rippleBtn(btn);
  showMsg(u.greet + (key==='dharya'?' 💚':' 🌸'), key==='dharya'?'ok-g':'ok-p');
  burst(key==='dharya'?'#00ffaa':'#ff88cc');
  for(let i=0;i<20;i++) setTimeout(spawnMeteor,i*60);
  setTimeout(()=>showWelcome(u.greet,u.emoji,key),1100);
}

/* ═══════════════════════
   HELPERS
═══════════════════════ */
function showMsg(t,c){
  const b=document.getElementById('msg');
  b.textContent=t; b.className='msg '+c; b.style.display='block';
}
function clearMsg(){ document.getElementById('msg').style.display='none'; }

function shake(){
  phone.style.animation='none';
  [[-12,0],[12,70],[-7,140],[7,210],[0,280]].forEach(([x,t])=>
    setTimeout(()=>phone.style.transform=`translateX(${x}px)`,t));
  setTimeout(()=>{ phone.style.transform=''; phone.style.animation='phoneFloat 5s ease-in-out infinite'; },350);
}

function rippleBtn(btn){
  const r=document.createElement('span'); r.className='rip';
  r.style.cssText='width:220px;height:220px;top:calc(50% - 110px);left:calc(50% - 110px);';
  btn.appendChild(r); setTimeout(()=>r.remove(),700);
}

function burst(col){
  for(let i=0;i<70;i++){
    const p=document.createElement('div'); p.className='pt';
    const sz=Math.random()*11+3;
    p.style.cssText=`width:${sz}px;height:${sz}px;
      left:${20+Math.random()*60}%;top:${15+Math.random()*40}%;
      background:${col};box-shadow:0 0 ${sz}px ${col};
      --pd:${(Math.random()*1.9+.7).toFixed(2)}s;
      --pde:${(Math.random()*.4).toFixed(2)}s;
      --px:${(Math.random()*280-140).toFixed(0)}px;
      border-radius:${Math.random()>.3?'50%':'4px'};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3500);
  }
}

function showWelcome(text,emoji,key){
  const ov=document.getElementById('ov');
  const ot=document.getElementById('ov-title');
  document.getElementById('ov-icon').textContent=emoji;
  ov.style.background=key==='dharya'?'rgba(0,6,3,.4)':'rgba(6,0,3,.4)';
  ov.classList.add('show');
  ot.textContent='';
  let i=0;(function tw(){if(i<=text.length){ot.textContent=text.slice(0,i++);setTimeout(tw,55);}})();
  for(let j=0;j<28;j++) setTimeout(spawnMeteor,j*90);
  burst(key==='dharya'?'#00ffaa':'#ff88cc');
}

addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
document.getElementById('ov').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('show');
  const btn=document.getElementById('btn');
  btn.innerHTML='Enter →&nbsp;<span class="arrow-icon">→</span>';
  btn.style.pointerEvents='';
  document.getElementById('uid').value='';
  document.getElementById('pw').value='';
  pvis=false; document.getElementById('pw').type='password';
  document.getElementById('eye').textContent='👁';
  clearMsg();
});
</script>
