<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dharya — Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}

    /* ─── BODY ─── */
    body{
      background:#07030f;
      display:flex;align-items:center;justify-content:center;
      transition:background 1.2s;
    }
    body.th-g{background:#030d07;}
    body.th-p{background:#0d0311;}

    /* ─── CANVAS (stars + shooting stars) ─── */
    #cv{position:fixed;inset:0;z-index:0;pointer-events:none;}

    /* ─── SOFT NEBULA ORBS ─── */
    .orb{
      position:fixed;border-radius:50%;pointer-events:none;z-index:0;
      filter:blur(100px);
      animation:orbf var(--of,20s) var(--od,0s) ease-in-out infinite alternate;
      transition:background 1.2s;
    }
    @keyframes orbf{
      0%  {transform:translate(0,0) scale(1);}
      50% {transform:translate(var(--ox,30px),var(--oy,-20px)) scale(1.1);}
      100%{transform:translate(calc(var(--ox,30px)*-0.4),var(--oy,-20px)) scale(.95);}
    }

    /* ─── FLOATING GLYPHS ─── */
    .glyph{
      position:fixed;pointer-events:none;z-index:1;user-select:none;
      opacity:var(--go,.12);font-size:var(--gs,1rem);
      color:var(--gc,rgba(255,255,255,.8));
      filter:drop-shadow(0 0 5px var(--gf,rgba(255,200,255,.3)));
      animation:glyphf var(--gd,9s) var(--gdl,0s) ease-in-out infinite alternate;
    }
    @keyframes glyphf{
      from{transform:translateY(0) rotate(-8deg);}
      to  {transform:translateY(-22px) rotate(9deg);}
    }

    /* ─── CURSOR SPARKS ─── */
    .spark{
      position:fixed;border-radius:50%;pointer-events:none;z-index:9;
      animation:spk .75s ease-out forwards;
    }
    @keyframes spk{
      0%  {transform:scale(1.4) translate(-50%,-50%);opacity:.9;}
      100%{transform:scale(0)   translate(-50%,-50%);opacity:0;}
    }

    /* ─── SCENE / CARD ─── */
    .scene{position:relative;z-index:10;perspective:1400px;}

    .card{
      width:368px;
      background:linear-gradient(160deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.02) 50%,rgba(0,0,0,.3) 100%);
      border:1px solid rgba(255,255,255,.09);
      border-radius:36px;
      backdrop-filter:blur(36px) saturate(1.5);
      -webkit-backdrop-filter:blur(36px) saturate(1.5);
      padding:38px 32px 26px;
      display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04),
        0 50px 120px rgba(0,0,0,.9),
        0 0 100px var(--cg,rgba(160,40,255,.1)),
        inset 0 1px 0 rgba(255,255,255,.11),
        inset 0 -1px 0 rgba(0,0,0,.55);
      animation:cardfloat 7s ease-in-out infinite;
      transition:box-shadow 1.2s,border-color 1.2s;
    }
    body.th-g .card{--cg:rgba(0,255,120,.09);border-color:rgba(0,255,120,.13);}
    body.th-p .card{--cg:rgba(255,50,180,.12);border-color:rgba(255,50,180,.16);}

    @keyframes cardfloat{
      0%,100%{transform:translateY(0)    rotateX(1deg)   rotateY(0);}
      33%    {transform:translateY(-7px) rotateX(-.4deg) rotateY(.3deg);}
      66%    {transform:translateY(-11px)rotateX(.2deg)  rotateY(-.2deg);}
    }

    /* shimmer sweep */
    .card::after{
      content:'';position:absolute;inset:0;border-radius:36px;pointer-events:none;
      background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.05) 55%,transparent 80%);
      background-size:260% 100%;
      animation:sweep 7s ease-in-out infinite;
    }
    @keyframes sweep{0%{background-position:260% 0}100%{background-position:-260% 0}}

    /* top glow behind icon */
    .card::before{
      content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
      width:260px;height:260px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,var(--ig,rgba(180,60,255,.15)) 0%,transparent 65%);
      animation:iglow 5s ease-in-out infinite alternate;
      transition:background 1.2s;
    }
    body.th-g .card::before{--ig:rgba(0,255,120,.12);}
    body.th-p .card::before{--ig:rgba(255,60,200,.18);}
    @keyframes iglow{from{opacity:.5;transform:translateX(-50%) scale(1);}to{opacity:1;transform:translateX(-50%) scale(1.18);}}

    /* dots top-right */
    .dots{position:absolute;top:15px;right:16px;display:flex;gap:5px;z-index:2;}
    .dots em{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);display:block;font-style:normal;}
    .dots em:last-child{background:var(--dc,rgba(255,80,180,.85));box-shadow:0 0 7px var(--dc,rgba(255,80,180,.7));transition:background .8s,box-shadow .8s;}
    body.th-g .dots em:last-child{--dc:rgba(0,255,120,.9);}
    body.th-p .dots em:last-child{--dc:rgba(255,50,180,.9);}

    /* ─── ICON ─── */
    .icon-wrap{position:relative;width:80px;height:80px;margin-bottom:16px;}

    .icon{
      width:80px;height:80px;border-radius:22px;
      background:linear-gradient(135deg,#ff4d8b,#e040fb);
      display:flex;align-items:center;justify-content:center;
      font-size:2.1rem;position:relative;z-index:2;
      box-shadow:0 10px 36px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);
      animation:iconbob 3.5s ease-in-out infinite;
      transition:background 1.1s,box-shadow 1.1s;
    }
    body.th-g .icon{background:linear-gradient(135deg,#00e676,#00bfa5);box-shadow:0 10px 36px rgba(0,230,118,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);}
    body.th-p .icon{background:linear-gradient(135deg,#ff4d8b,#e040fb);box-shadow:0 10px 36px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);}
    @keyframes iconbob{0%,100%{transform:scale(1) rotate(0) translateY(0);}50%{transform:scale(1.07) rotate(-3deg) translateY(-4px);}}

    .ring{
      position:absolute;border-radius:30px;border:1.5px solid var(--rc,rgba(255,80,180,.28));
      transition:border-color 1.1s;
    }
    .ring.a{inset:-9px;border-radius:30px;animation:rcw 4s linear infinite;}
    .ring.b{inset:-18px;border-radius:38px;border-style:dashed;border-color:var(--rc2,rgba(255,80,180,.14));animation:rccw 7s linear infinite;transition:border-color 1.1s;}
    body.th-g .ring.a{--rc:rgba(0,255,120,.32);}body.th-g .ring.b{--rc2:rgba(0,255,120,.16);}
    body.th-p .ring.a{--rc:rgba(255,50,200,.38);}body.th-p .ring.b{--rc2:rgba(255,50,200,.18);}
    @keyframes rcw {to{transform:rotate(360deg);}}
    @keyframes rccw{to{transform:rotate(-360deg);}}

    .odot{
      position:absolute;width:6px;height:6px;border-radius:50%;z-index:3;
      background:var(--odc,rgba(255,80,180,.9));box-shadow:0 0 8px var(--odc,rgba(255,80,180,.8));
      animation:odotfly var(--ot,4s) var(--otl,0s) linear infinite;
      transition:background .8s,box-shadow .8s;
    }
    body.th-g .odot{--odc:rgba(0,255,120,.95);}body.th-p .odot{--odc:rgba(255,80,200,.95);}
    @keyframes odotfly{0%{transform:rotate(0deg) translateX(46px) rotate(0deg);}100%{transform:rotate(360deg) translateX(46px) rotate(-360deg);}}

    /* ─── BADGE ─── */
    .badge{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
    .bl{width:24px;height:1px;background:linear-gradient(90deg,transparent,var(--ac,#e040fb));transition:background 1.1s;}
    .bl.r{background:linear-gradient(90deg,var(--ac,#e040fb),transparent);}
    body.th-g .bl  {background:linear-gradient(90deg,transparent,#00e676);}body.th-g .bl.r{background:linear-gradient(90deg,#00e676,transparent);}
    body.th-p .bl  {background:linear-gradient(90deg,transparent,#ff4d8b);}body.th-p .bl.r{background:linear-gradient(90deg,#ff4d8b,transparent);}
    .bword{font-size:.58rem;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--ac,#e040fb);transition:color 1.1s;}
    body.th-g .bword{color:#00e676;}body.th-p .bword{color:#ff4d8b;}
    .bdot{width:4px;height:4px;border-radius:50%;background:var(--ac,#e040fb);box-shadow:0 0 8px var(--ac,#e040fb);animation:bdp 1.5s ease-in-out infinite alternate;transition:background 1.1s,box-shadow 1.1s;}
    body.th-g .bdot{background:#00e676;box-shadow:0 0 8px #00e676;}body.th-p .bdot{background:#ff4d8b;box-shadow:0 0 8px #ff4d8b;}
    @keyframes bdp{from{transform:scale(1);opacity:.45}to{transform:scale(2.2);opacity:1}}

    /* ─── TITLE ─── */
    .title{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:800;
      font-size:2.05rem;line-height:1.18;text-align:center;
      color:rgba(255,255,255,.95);margin-bottom:6px;letter-spacing:-.01em;
    }
    .tname{
      display:block;
      background:linear-gradient(135deg,#ff8cf8,#ff4d8b);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      transition:background .01s;/* reapply via JS */
      animation:tglow 2.8s ease-in-out infinite alternate;
    }
    body.th-g .tname{background:linear-gradient(135deg,#a0ffcc,#00e676);-webkit-background-clip:text;background-clip:text;}
    body.th-p .tname{background:linear-gradient(135deg,#ff8cf8,#ff4d8b);-webkit-background-clip:text;background-clip:text;}
    @keyframes tglow{from{filter:drop-shadow(0 0 8px rgba(255,80,200,.35));}to{filter:drop-shadow(0 0 22px rgba(255,80,200,.75));}}
    body.th-g .tname{animation:tglowG 2.8s ease-in-out infinite alternate;}
    body.th-p .tname{animation:tglowP 2.8s ease-in-out infinite alternate;}
    @keyframes tglowG{from{filter:drop-shadow(0 0 8px rgba(0,230,118,.35));}to{filter:drop-shadow(0 0 22px rgba(0,230,118,.75));}}
    @keyframes tglowP{from{filter:drop-shadow(0 0 8px rgba(255,80,200,.35));}to{filter:drop-shadow(0 0 22px rgba(255,80,200,.75));}}

    .cur{display:inline-block;width:2px;height:.8em;background:currentColor;margin-left:1px;vertical-align:text-bottom;animation:cblink 1s step-end infinite;border-radius:1px;}
    @keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}

    /* ─── SUBTITLE ─── */
    .sub{font-size:.78rem;font-weight:400;font-style:italic;color:rgba(255,255,255,.35);text-align:center;margin-bottom:22px;min-height:1.2em;}

    /* ─── DIVIDER ─── */
    .div{width:100%;height:1px;margin-bottom:20px;background:linear-gradient(90deg,transparent,var(--dvc,rgba(180,80,255,.2)) 35%,var(--dvc,rgba(180,80,255,.2)) 65%,transparent);transition:background 1.1s;}
    body.th-g .div{--dvc:rgba(0,230,118,.18);}body.th-p .div{--dvc:rgba(255,80,200,.22);}

    /* ─── FIELDS ─── */
    .field{width:100%;margin-bottom:13px;position:relative;}
    .lbl{
      display:block;font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      color:rgba(255,255,255,.28);margin-bottom:7px;
      transition:color .35s,letter-spacing .3s;
    }
    .field:focus-within .lbl{letter-spacing:.26em;}
    body.th-g .field:focus-within .lbl{color:rgba(0,230,118,.75);}
    body.th-p .field:focus-within .lbl{color:rgba(255,77,139,.75);}

    /* shared input base — dark glass for both fields */
    .fu input,
    .fp input{
      width:100%;border-radius:13px;
      border:1.5px solid rgba(255,255,255,.07);
      background:rgba(8,4,20,.72);
      color:#fff;font-size:.95rem;font-family:'Inter',sans-serif;font-weight:400;
      outline:none;
      transition:box-shadow .32s,border-color .32s,transform .18s,background .25s;
    }
    .fu input{ padding:13px 16px; letter-spacing:.03em; }
    .fp input{ padding:13px 44px 13px 16px; letter-spacing:.1em; }

    .fu input::placeholder,.fp input::placeholder{color:rgba(255,255,255,.18);font-weight:300;}

    .fu input:focus,.fp input:focus{
      transform:translateY(-1px);
      background:rgba(12,6,28,.85);
    }
    body.th-g .fu input:focus,
    body.th-g .fp input:focus{
      border-color:rgba(0,230,118,.6);
      box-shadow:0 0 0 3px rgba(0,230,118,.12),0 6px 18px rgba(0,150,80,.1);
    }
    body.th-p .fu input:focus,
    body.th-p .fp input:focus{
      border-color:rgba(255,77,139,.6);
      box-shadow:0 0 0 3px rgba(255,77,139,.12),0 6px 18px rgba(200,0,120,.08);
    }

    .eyebtn{
      position:absolute;right:12px;bottom:13px;
      background:none;border:none;cursor:pointer;
      font-size:.95rem;color:rgba(255,255,255,.25);
      padding:2px;line-height:1;transition:color .22s,transform .18s;
    }
    .eyebtn:hover{color:rgba(255,255,255,.6);transform:scale(1.18);}

    /* ─── DETECTED ─── */
    .det{
      width:100%;font-size:.73rem;font-weight:700;
      display:none;align-items:center;gap:6px;
      margin-top:-2px;margin-bottom:6px;
      animation:detpop .4s cubic-bezier(.175,.885,.32,1.275);
    }
    .det.on{display:flex;}
    @keyframes detpop{from{opacity:0;transform:translateY(5px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
    body.th-g .det{color:#00e676;}body.th-p .det{color:#ff4d8b;}
    .detdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:currentColor;box-shadow:0 0 8px currentColor;animation:detd 1.1s ease-in-out infinite alternate;}
    @keyframes detd{from{transform:scale(1)}to{transform:scale(1.9)}}

    /* ─── BUTTON ─── */
    .btn{
      width:100%;padding:15px 20px;border:none;border-radius:15px;
      margin-top:10px;font-size:.97rem;font-weight:700;font-family:'Inter',sans-serif;
      letter-spacing:.05em;cursor:pointer;
      position:relative;overflow:hidden;
      background:linear-gradient(90deg,#ff4d8b,#c026d3,#e040fb);
      color:#fff;
      box-shadow:0 8px 28px rgba(255,60,180,.45),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
      transition:transform .2s,box-shadow .3s;
      display:flex;align-items:center;justify-content:center;gap:10px;
      animation:btnp 3.5s ease-in-out infinite;
    }
    body.th-g .btn{
      background:linear-gradient(90deg,#00e676,#00bfa5,#00c853);
      box-shadow:0 8px 28px rgba(0,230,118,.45),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
      animation:btnpG 3.5s ease-in-out infinite;
    }
    body.th-p .btn{
      background:linear-gradient(90deg,#ff4d8b,#c026d3,#e040fb);
      box-shadow:0 8px 28px rgba(255,60,180,.45),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
      animation:btnpP 3.5s ease-in-out infinite;
    }
    @keyframes btnp {0%,100%{box-shadow:0 8px 28px rgba(255,60,180,.45),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 12px 40px rgba(255,60,180,.7),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(255,60,180,.1)}}
    @keyframes btnpG{0%,100%{box-shadow:0 8px 28px rgba(0,230,118,.45),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 12px 40px rgba(0,230,118,.7),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(0,230,118,.1)}}
    @keyframes btnpP{0%,100%{box-shadow:0 8px 28px rgba(255,60,180,.45),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 12px 40px rgba(255,60,180,.7),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(255,60,180,.1)}}
    .btn:hover{transform:translateY(-2px) scale(1.012);animation:none;box-shadow:0 14px 44px rgba(255,60,180,.65),0 4px 10px rgba(0,0,0,.5);}
    body.th-g .btn:hover{box-shadow:0 14px 44px rgba(0,230,118,.65),0 4px 10px rgba(0,0,0,.5);}
    .btn:active{transform:scale(.98);}
    .btn::before{content:'';position:absolute;top:0;left:-85%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.26),transparent);transform:skewX(-18deg);animation:bshine 4s ease-in-out infinite;}
    @keyframes bshine{0%{left:-85%}32%,100%{left:145%;}}
    .btxt2{position:relative;z-index:1;}
    .barr{position:relative;z-index:1;font-size:1.05rem;animation:arrf 1.5s ease-in-out infinite;}
    @keyframes arrf{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

    .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:ripa .6s linear;pointer-events:none;}
    @keyframes ripa{to{transform:scale(5);opacity:0;}}

    /* ─── MSG ─── */
    .msg{width:100%;font-size:.76rem;font-weight:600;border-radius:11px;padding:10px 15px;margin-top:10px;text-align:center;display:none;letter-spacing:.04em;animation:msgp .38s cubic-bezier(.175,.885,.32,1.275);}
    @keyframes msgp{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}
    .msg.err{background:rgba(255,40,70,.12);border:1px solid rgba(255,40,70,.38);color:#ff7080;}
    .msg.ok {background:rgba(80,255,150,.08);border:1px solid rgba(80,255,150,.32);color:#80ffb0;}

    /* ─── FOOTER ─── */
    .foot{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:7px;}
    .footxt{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.13);font-size:.58rem;letter-spacing:.1em;font-style:italic;}
    .footxt span{width:16px;height:1px;background:rgba(255,255,255,.1);display:block;}
    .fdots{display:flex;gap:5px;}
    .fdots s{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.1);display:block;text-decoration:none;}
    .fdots s.on{background:var(--ac,#e040fb);box-shadow:0 0 5px var(--ac,#e040fb);transition:background .8s,box-shadow .8s;}
    body.th-g .fdots s.on{background:#00e676;box-shadow:0 0 5px #00e676;}
    body.th-p .fdots s.on{background:#ff4d8b;box-shadow:0 0 5px #ff4d8b;}

    /* ─── WELCOME OVERLAY ─── */
    #ov{
      position:fixed;inset:0;z-index:50;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
      opacity:0;pointer-events:none;
      transition:opacity .75s,backdrop-filter .75s;
    }
    #ov.on{
      opacity:1;pointer-events:all;
      backdrop-filter:blur(18px) brightness(.35) saturate(1.8);
      -webkit-backdrop-filter:blur(18px) brightness(.35) saturate(1.8);
    }
    .ovic{font-size:4rem;animation:ovic 2.4s ease-in-out infinite;}
    @keyframes ovic{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(14deg) scale(1.25)}}
    .ovl1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:clamp(1.8rem,5vw,3rem);color:rgba(255,255,255,.9);text-align:center;}
    .ovl2{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:800;
      font-size:clamp(2.4rem,7vw,4.6rem);text-align:center;
      min-height:1.15em;
    }
    body.th-g .ovl2{background:linear-gradient(135deg,#a0ffcc,#00e676);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 36px rgba(0,230,118,.85));}
    body.th-p .ovl2{background:linear-gradient(135deg,#ff8cf8,#ff4d8b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 36px rgba(255,80,200,.85));}
    .ovsub{font-size:.85rem;color:rgba(255,255,255,.32);letter-spacing:.26em;text-transform:uppercase;}
    .ovtap{font-size:.64rem;color:rgba(255,255,255,.14);letter-spacing:.16em;text-transform:uppercase;margin-top:2px;animation:ovtap 2.4s ease-in-out infinite;}
    @keyframes ovtap{0%,100%{opacity:.14}50%{opacity:.48}}

    /* ─── CONFETTI ─── */
    .conf{position:fixed;pointer-events:none;z-index:40;animation:cfall var(--cd,2s) var(--cdl,0s) ease-out forwards;}
    @keyframes cfall{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1;}100%{transform:translate(var(--cx,0),130vh) rotate(900deg) scale(.06);opacity:0;}}

    @media(max-width:400px){.card{width:95vw;padding:30px 16px 22px;}}
  </style>
</head>
<body>

  <!-- Canvas: stars + shooting stars rendered here -->
  <canvas id="cv"></canvas>

  <!-- Soft nebula orbs -->
  <div class="orb" id="ob1" style="width:460px;height:460px;top:-100px;left:-150px;background:#26084a;opacity:.17;--of:22s;--od:0s;--ox:45px;--oy:-35px;"></div>
  <div class="orb" id="ob2" style="width:360px;height:360px;bottom:-75px;right:-110px;background:#0f043a;opacity:.13;--of:17s;--od:5s;--ox:-35px;--oy:25px;"></div>
  <div class="orb" id="ob3" style="width:220px;height:220px;top:48%;left:66%;background:#190430;opacity:.09;--of:12s;--od:9s;--ox:28px;--oy:42px;"></div>

  <!-- Floating glyphs -->
  <span class="glyph" style="top:12%;left:5.5%;--gs:1.3rem;--go:.17;--gd:7s;--gdl:0s;--gc:#fff;--gf:rgba(255,180,255,.3);">★</span>
  <span class="glyph" style="top:55%;left:3.5%;--gs:.95rem;--go:.14;--gd:9s;--gdl:2s;--gc:#fff;--gf:rgba(255,180,255,.25);">✦</span>
  <span class="glyph" style="top:78%;left:7%;--gs:1.5rem;--go:.16;--gd:6s;--gdl:1s;--gc:#fff;--gf:rgba(255,200,255,.3);">⭐</span>
  <span class="glyph" style="top:22%;right:5.5%;--gs:1.2rem;--go:.18;--gd:8s;--gdl:3s;--gc:#fff;--gf:rgba(200,255,220,.28);">✦</span>
  <span class="glyph" style="top:62%;right:4%;--gs:1.4rem;--go:.14;--gd:11s;--gdl:.5s;--gc:#fff;--gf:rgba(255,180,255,.25);">★</span>
  <span class="glyph" style="top:40%;right:12%;--gs:.85rem;--go:.11;--gd:5s;--gdl:4s;--gc:#fff;--gf:rgba(200,255,220,.22);">⭐</span>
  <span class="glyph" style="top:84%;right:13%;--gs:1.1rem;--go:.15;--gd:7s;--gdl:1.5s;--gc:#fff;--gf:rgba(255,180,255,.28);">✦</span>
  <span class="glyph" style="top:7%;left:41%;--gs:.75rem;--go:.09;--gd:10s;--gdl:2.5s;--gc:#fff;--gf:rgba(255,230,130,.35);">★</span>
  <span class="glyph" style="top:68%;left:18%;--gs:.9rem;--go:.12;--gd:8s;--gdl:5s;--gc:#fff;--gf:rgba(200,255,220,.22);">✦</span>
  <span class="glyph" style="top:30%;right:25%;--gs:1.2rem;--go:.1;--gd:12s;--gdl:3.5s;--gc:#fff;--gf:rgba(255,180,255,.24);">⭐</span>

  <!-- Welcome overlay -->
  <div id="ov">
    <div class="ovic" id="ovic">✨</div>
    <div class="ovl1">Welcome back,</div>
    <div class="ovl2" id="ovname"></div>
    <div class="ovsub">Your world is ready ✦</div>
    <div class="ovtap">tap anywhere to continue</div>
  </div>

  <!-- CARD -->
  <div class="scene">
    <div class="card" id="card">

      <div class="dots"><em></em><em></em><em></em></div>

      <!-- Icon -->
      <div class="icon-wrap">
        <div class="ring b"></div>
        <div class="ring a"></div>
        <div class="icon" id="icon">🌿</div>
        <div class="odot" style="--ot:4s;--otl:0s;"></div>
        <div class="odot" style="--ot:4s;--otl:2s;"></div>
      </div>

      <!-- Badge -->
      <div class="badge">
        <div class="bdot"></div>
        <div class="bl"></div>
        <span class="bword">Back Again</span>
        <div class="bl r"></div>
        <div class="bdot"></div>
      </div>

      <!-- Title -->
      <h1 class="title">
        Welcome back,<br>
        <span class="tname"><span id="tname">Dharya</span><span class="cur"></span></span>
      </h1>

      <p class="sub" id="sub">Your special world is waiting ✨</p>

      <div class="div"></div>

      <!-- USERNAME -->
      <div class="field fu">
        <label class="lbl">Username</label>
        <input type="text" id="uid" placeholder="Enter username" autocomplete="off" spellcheck="false" oninput="onUID(this.value)"/>
      </div>

      <!-- PASSWORD -->
      <div class="field fp">
        <label class="lbl">Password</label>
        <input type="password" id="pw" placeholder="••••••••••" autocomplete="off" spellcheck="false" oninput="onPW(this.value)"/>
        <button class="eyebtn" id="eye" onclick="togglePw()">👁</button>
      </div>

      <!-- Detected -->
      <div class="det" id="det">
        <div class="detdot"></div>
        <span id="dettxt">Dharya detected ✓</span>
      </div>

      <!-- Button -->
      <button class="btn" id="btn" onclick="login()">
        <span class="btxt2">Enter my world</span>
        <span class="barr">→</span>
      </button>

      <div class="msg" id="msg"></div>

      <div class="foot">
        <div class="footxt"><span></span>Only someone special knows the way in<span></span></div>
        <div class="fdots"><s></s><s class="on"></s><s></s></div>
      </div>
    </div>
  </div>

<script>
/* ══════════════════════════════
   USERS
══════════════════════════════ */
const U = {
  dharya : {id:'DHARYA', pw:'09/10/2007', th:'th-g', emoji:'🌿', name:'Surya',   sub:'Your private space is ready 🌿'},
  sadhana: {id:'DHARYA', pw:'29/02/2008', th:'th-p', emoji:'❤️',  name:'Sadhana', sub:'Your special world is waiting ✨'},
};
let who = null;

/* ══════════════════════════════
   CANVAS  — stars + shooting stars
══════════════════════════════ */
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
let W, H;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ── static stars ── */
const STARS = Array.from({length:340}, () => ({
  x : Math.random(),
  y : Math.random(),
  r : Math.random() * 1.6 + 0.15,
  a : Math.random(),
  da: (Math.random() * .006 + .0015) * (Math.random() > .5 ? 1 : -1),
  base : Math.random() * .42 + .04,
  tinted: Math.random() > .8,
  hue : Math.random() > .5 ? 300 : 145,
}));

/* ── shooting star pool ── */
const SHOOTS = [];

function makeShoot() {
  // spread across full top portion of screen
  const startX = Math.random() * W * 0.9;
  const startY = Math.random() * H * 0.5;
  const angle  = (Math.random() * 18 + 22) * Math.PI / 180; // 22–40° diagonal
  const len    = Math.random() * 180 + 100;   // 100–280px tail
  const speed  = Math.random() * 3.5 + 4;     // smooth: 4–7.5 px/frame
  const life   = Math.random() * 50 + 55;     // 55–105 frames

  let rgb = '255,255,255';
  if (who === 'dharya')  rgb = '100,255,180';
  if (who === 'sadhana') rgb = '255,100,200';

  SHOOTS.push({
    x: startX, y: startY,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    len, life, maxLife: life,
    rgb,
    w: Math.random() * 1 + 1,   // 1–2px width
  });
}

// spawn interval — steady but not too frequent
let shootTimer = 0;
const SHOOT_INTERVAL = 55; // frames between spawns (~0.9s at 60fps)

/* ── main render loop ── */
function render() {
  ctx.clearRect(0, 0, W, H);

  /* stars */
  STARS.forEach(s => {
    s.a += s.da;
    if (s.a > 1 || s.a < 0) s.da *= -1;
    const alpha = (s.base * Math.abs(s.a)).toFixed(3);
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.tinted
      ? `hsla(${s.hue},70%,80%,${alpha})`
      : `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  /* shooting stars */
  shootTimer++;
  if (shootTimer >= SHOOT_INTERVAL) {
    makeShoot();
    if (Math.random() > .72) setTimeout(makeShoot, 220);
    shootTimer = 0;
  }

  for (let i = SHOOTS.length - 1; i >= 0; i--) {
    const s = SHOOTS[i];
    s.x  += s.vx;
    s.y  += s.vy;
    s.life--;

    if (s.life <= 0) { SHOOTS.splice(i, 1); continue; }

    const progress = 1 - s.life / s.maxLife;  // 0→1 over lifetime
    // smooth ease: fade in first 8%, hold, fade out last 20%
    let alpha = 1;
    if      (progress < .08)  alpha = progress / .08;
    else if (progress > .80)  alpha = 1 - (progress - .80) / .20;
    alpha = Math.max(0, Math.min(1, alpha));

    // tail direction (backward from head)
    const ang    = Math.atan2(s.vy, s.vx);
    const tailLen = s.len * (0.6 + progress * 0.4); // tail grows a little as it moves
    const tx = s.x - Math.cos(ang) * tailLen;
    const ty = s.y - Math.sin(ang) * tailLen;

    // gradient tail: fully transparent → mid glow → bright head
    const grad = ctx.createLinearGradient(tx, ty, s.x, s.y);
    grad.addColorStop(0,   `rgba(${s.rgb},0)`);
    grad.addColorStop(.5,  `rgba(${s.rgb},${(alpha * .28).toFixed(3)})`);
    grad.addColorStop(.85, `rgba(${s.rgb},${(alpha * .72).toFixed(3)})`);
    grad.addColorStop(1,   `rgba(${s.rgb},${(alpha * .95).toFixed(3)})`);

    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(s.x, s.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth   = s.w;
    ctx.lineCap     = 'round';
    ctx.stroke();

    // head: tight bright core + soft outer halo
    const headR = 2 + s.w;
    const hg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, headR * 4);
    hg.addColorStop(0,   `rgba(${s.rgb},${(alpha).toFixed(3)})`);
    hg.addColorStop(.3,  `rgba(${s.rgb},${(alpha * .55).toFixed(3)})`);
    hg.addColorStop(.7,  `rgba(${s.rgb},${(alpha * .18).toFixed(3)})`);
    hg.addColorStop(1,   `rgba(${s.rgb},0)`);
    ctx.beginPath();
    ctx.arc(s.x, s.y, headR * 4, 0, Math.PI * 2);
    ctx.fillStyle = hg;
    ctx.fill();
  }

  requestAnimationFrame(render);
}
render();

/* burst of shooting stars on theme switch / login */
function shootBurst(n = 8) {
  for (let i = 0; i < n; i++) setTimeout(makeShoot, i * 90);
}

/* ══════════════════════════════
   3D TILT + PARALLAX ORBS
══════════════════════════════ */
const card = document.getElementById('card');
window.addEventListener('mousemove', e => {
  const dx = (e.clientX - W / 2) / (W / 2);
  const dy = (e.clientY - H / 2) / (H / 2);
  card.style.animation = 'none';
  card.style.transform = `rotateX(${-dy * 7}deg) rotateY(${dx * 7}deg) translateZ(14px)`;
  document.getElementById('ob1').style.transform = `translate(${-dx*18}px,${-dy*14}px)`;
  document.getElementById('ob2').style.transform = `translate(${dx*12}px,${dy*10}px)`;
});
window.addEventListener('mouseleave', () => {
  card.style.transition = 'transform .9s ease';
  card.style.transform  = '';
  setTimeout(() => { card.style.animation = 'cardfloat 7s ease-in-out infinite'; card.style.transition = ''; }, 950);
});

/* ══════════════════════════════
   CURSOR SPARKS
══════════════════════════════ */
window.addEventListener('mousemove', e => {
  if (Math.random() > .22) return;
  const sp  = document.createElement('div');
  sp.className = 'spark';
  const c = who === 'dharya'
    ? `rgba(${80+~~(Math.random()*80)},255,${140+~~(Math.random()*80)},.85)`
    : who === 'sadhana'
    ? `rgba(255,${60+~~(Math.random()*80)},${180+~~(Math.random()*60)},.85)`
    : `rgba(255,255,255,.45)`;
  const sz = Math.random() * 5 + 2;
  sp.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX}px;top:${e.clientY}px;background:${c};box-shadow:0 0 8px ${c};`;
  document.body.appendChild(sp);
  setTimeout(() => sp.remove(), 800);
});

/* ══════════════════════════════
   THEME
══════════════════════════════ */
function applyTheme(key) {
  if (who === key) return;
  who = key;
  const u = U[key];
  document.body.className = u.th;
  document.getElementById('icon').textContent = u.emoji;

  // typewrite name
  const tn = document.getElementById('tname');
  tn.textContent = ''; let i = 0;
  (function tw() { if (i <= u.name.length) { tn.textContent = u.name.slice(0,i++); setTimeout(tw, 55); } })();

  document.getElementById('sub').textContent = u.sub;
  document.getElementById('dettxt').textContent = u.name + ' detected ✓';
  document.getElementById('det').className = 'det on';

  shootBurst(10);
  flash(u.th);
}

function resetTheme() {
  who = null;
  document.body.className = '';
  document.getElementById('icon').textContent = '🌿';
  document.getElementById('tname').textContent = 'Dharya';
  document.getElementById('sub').textContent = 'Your special world is waiting ✨';
  document.getElementById('det').className = 'det';
}

function flash(th) {
  const f = document.createElement('div');
  const c = th === 'th-g' ? 'rgba(0,230,118,.06)' : 'rgba(255,60,180,.07)';
  f.style.cssText = `position:fixed;inset:0;z-index:9999;pointer-events:none;background:${c};animation:_fo .65s ease-out forwards;`;
  const s = document.createElement('style'); s.textContent = '@keyframes _fo{from{opacity:1}to{opacity:0}}';
  document.head.appendChild(s); document.body.appendChild(f);
  setTimeout(() => { f.remove(); s.remove(); }, 750);
}

/* ══════════════════════════════
   INPUTS
══════════════════════════════ */
function onUID(v) { clearMsg(); const pw = document.getElementById('pw').value.trim(); if (pw) onPW(pw); }

function onPW(v) {
  clearMsg();
  if (!v) { resetTheme(); return; }
  const m = Object.entries(U).find(([,u]) => u.pw === v);
  if (m) { applyTheme(m[0]); return; }
  const pG = U.dharya.pw.startsWith(v);
  const pP = U.sadhana.pw.startsWith(v);
  if (!pG && !pP) resetTheme();
}

/* ══════════════════════════════
   EYE TOGGLE
══════════════════════════════ */
let pvis = false;
function togglePw() {
  const inp = document.getElementById('pw');
  pvis = !pvis; inp.type = pvis ? 'text' : 'password';
  document.getElementById('eye').textContent = pvis ? '🙈' : '👁';
}

/* ══════════════════════════════
   LOGIN
══════════════════════════════ */
function login() {
  const uid = document.getElementById('uid').value.trim().toUpperCase();
  const pw  = document.getElementById('pw').value.trim();
  const btn = document.getElementById('btn');
  if (!pw) { showMsg('Please enter your password ✦', 'err'); shake(); return; }
  const m = Object.entries(U).find(([,u]) => u.pw === pw);
  if (!m) { showMsg('Incorrect password ✦', 'err'); shake(); return; }
  if (uid && uid !== m[1].id) { showMsg('Username does not match ✦', 'err'); shake(); return; }
  const [key, u] = m;
  applyTheme(key);
  btn.innerHTML = '<span class="btxt2">Entering…</span><span class="barr">✦</span>';
  btn.style.pointerEvents = 'none';
  ripBtn(btn);
  showMsg(u.name + ' — your world awaits ' + u.emoji, 'ok');
  confBurst(key === 'dharya' ? ['#00e676','#a0ffcc','#00bfa5','#fff'] : ['#ff4d8b','#ff8cf8','#e040fb','#fff']);
  shootBurst(18);
  setTimeout(() => showWelcome(u.name, u.emoji, u.th), 1100);
}

/* ══════════════════════════════
   HELPERS
══════════════════════════════ */
function showMsg(t,c) { const b = document.getElementById('msg'); b.textContent=t; b.className='msg '+c; b.style.display='block'; }
function clearMsg()   { document.getElementById('msg').style.display = 'none'; }

function shake() {
  card.style.animation = 'none';
  [[-13,0],[13,65],[-7,130],[7,195],[0,260]].forEach(([x,t]) => setTimeout(() => card.style.transform = `translateX(${x}px)`, t));
  setTimeout(() => { card.style.transform=''; card.style.animation='cardfloat 7s ease-in-out infinite'; }, 320);
}

function ripBtn(btn) {
  const r = document.createElement('span'); r.className = 'rip';
  r.style.cssText = 'width:250px;height:250px;top:calc(50% - 125px);left:calc(50% - 125px);';
  btn.appendChild(r); setTimeout(() => r.remove(), 700);
}

function confBurst(cols) {
  for (let i = 0; i < 85; i++) {
    const p = document.createElement('div'); p.className = 'conf';
    const sz = Math.random() * 11 + 3;
    const c  = cols[~~(Math.random() * cols.length)];
    p.style.cssText = `width:${sz}px;height:${sz}px;
      left:${10+Math.random()*80}%;top:${8+Math.random()*50}%;
      background:${c};box-shadow:0 0 ${sz}px ${c};
      --cd:${(Math.random()*2.1+.7).toFixed(2)}s;
      --cdl:${(Math.random()*.5).toFixed(2)}s;
      --cx:${(Math.random()*340-170).toFixed(0)}px;
      border-radius:${Math.random()>.3?'50%':'4px'};`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3800);
  }
}

function showWelcome(name, emoji, th) {
  const ov = document.getElementById('ov');
  const on = document.getElementById('ovname');
  document.getElementById('ovic').textContent = emoji;
  ov.style.background = th === 'th-g' ? 'rgba(0,8,3,.45)' : 'rgba(10,0,8,.45)';
  ov.classList.add('on');
  on.textContent = ''; let i = 0;
  (function tw() { if (i <= name.length) { on.textContent = name.slice(0,i++); setTimeout(tw, 70); } })();
  shootBurst(25);
  confBurst(th === 'th-g' ? ['#00e676','#a0ffcc','#fff'] : ['#ff4d8b','#ff8cf8','#fff']);
}

window.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

document.getElementById('ov').addEventListener('click', () => {
  document.getElementById('ov').classList.remove('on');
  const btn = document.getElementById('btn');
  btn.innerHTML = '<span class="btxt2">Enter my world</span><span class="barr">→</span>';
  btn.style.pointerEvents = '';
  document.getElementById('uid').value = '';
  document.getElementById('pw').value  = '';
  pvis = false;
  document.getElementById('pw').type   = 'password';
  document.getElementById('eye').textContent = '👁';
  document.getElementById('det').className   = 'det';
  resetTheme(); clearMsg();
});
</script>
