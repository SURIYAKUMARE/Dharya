<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dharya</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ═══════════════════════════════
       RESET & BASE
    ═══════════════════════════════ */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#060210}

    /* ═══════════════════════════════
       PAGES  (login | chat)
    ═══════════════════════════════ */
    #page-login{ position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .6s; }
    #page-login.hide{ opacity:0;transform:scale(.96);pointer-events:none; }

    #page-chat{ position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
                opacity:0;pointer-events:none;transition:opacity .5s; }
    #page-chat.show{ opacity:1;pointer-events:all; }

    /* ═══════════════════════════════
       ── LOGIN STYLES ──
    ═══════════════════════════════ */
    body.th-g{ background:#030c06; }
    body.th-p{ background:#0c0212; }

    #cv{ position:fixed;inset:0;z-index:0;pointer-events:none; }

    .orb{ position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);
          animation:orbdrift var(--of,20s) var(--od,0s) ease-in-out infinite alternate;transition:background 1.5s; }
    @keyframes orbdrift{0%{transform:translate(0,0) scale(1);}50%{transform:translate(var(--ox,30px),var(--oy,-20px)) scale(1.08);}100%{transform:translate(calc(var(--ox)*-.5),var(--oy)) scale(.94);}}

    .glyph{ position:fixed;pointer-events:none;z-index:1;user-select:none;font-size:var(--gs,1rem);opacity:var(--go,.13);
            filter:drop-shadow(0 0 5px var(--gf,rgba(200,160,255,.35)));animation:glyphf var(--gd,9s) var(--gdl,0s) ease-in-out infinite alternate; }
    @keyframes glyphf{ from{transform:translateY(0) rotate(-9deg) scale(1);}to{transform:translateY(-20px) rotate(8deg) scale(1.06);} }

    .spark{ position:fixed;border-radius:50%;pointer-events:none;z-index:99;animation:sparkfade .75s ease-out forwards; }
    @keyframes sparkfade{ 0%{transform:scale(1.3) translate(-50%,-50%);opacity:.9;}100%{transform:scale(0) translate(-50%,-50%);opacity:0;} }

    .scene{ position:relative;z-index:10;perspective:1400px; }
    .card{
      width:378px;background:linear-gradient(158deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 50%,rgba(0,0,0,.35) 100%);
      border:1px solid rgba(255,255,255,.1);border-radius:38px;
      backdrop-filter:blur(40px) saturate(1.5);-webkit-backdrop-filter:blur(40px) saturate(1.5);
      padding:42px 36px 30px;display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,.045),0 55px 130px rgba(0,0,0,.92),0 0 100px var(--cg,rgba(150,40,255,.1)),inset 0 1.5px 0 rgba(255,255,255,.13),inset 0 -1px 0 rgba(0,0,0,.55);
      animation:cardfloat 7s ease-in-out infinite;transition:box-shadow 1.3s,border-color 1.3s;
    }
    body.th-g .card{--cg:rgba(0,230,118,.1);border-color:rgba(0,230,118,.16);}
    body.th-p .card{--cg:rgba(255,50,180,.12);border-color:rgba(255,50,180,.18);}
    @keyframes cardfloat{0%,100%{transform:translateY(0) rotateX(1deg) rotateY(0);}33%{transform:translateY(-7px) rotateX(-.4deg) rotateY(.3deg);}66%{transform:translateY(-11px) rotateX(.2deg) rotateY(-.2deg);}}
    .card::after{ content:'';position:absolute;inset:0;border-radius:38px;pointer-events:none;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.05) 44%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.05) 56%,transparent 80%);background-size:260% 100%;animation:shimmer 8s ease-in-out infinite; }
    @keyframes shimmer{0%{background-position:260% 0}100%{background-position:-260% 0}}
    .card::before{ content:'';position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--ig,rgba(160,50,255,.15)) 0%,transparent 65%);animation:topglow 5s ease-in-out infinite alternate;transition:background 1.3s; }
    body.th-g .card::before{--ig:rgba(0,230,118,.12);}body.th-p .card::before{--ig:rgba(255,50,200,.18);}
    @keyframes topglow{from{opacity:.5;transform:translateX(-50%) scale(1);}to{opacity:1;transform:translateX(-50%) scale(1.2);}}

    .dots{ position:absolute;top:15px;right:16px;display:flex;gap:5px;z-index:2; }
    .dots em{ width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);display:block;font-style:normal; }
    .dots em:last-child{ background:var(--dc,rgba(255,80,180,.85));box-shadow:0 0 7px var(--dc,rgba(255,80,180,.7));transition:background .8s,box-shadow .8s;animation:dotpulse 2s ease-in-out infinite alternate; }
    body.th-g .dots em:last-child{--dc:rgba(0,230,118,.9);}body.th-p .dots em:last-child{--dc:rgba(255,50,180,.9);}
    @keyframes dotpulse{from{box-shadow:0 0 5px var(--dc,rgba(255,80,180,.6));}to{box-shadow:0 0 14px var(--dc,rgba(255,80,180,.9)),0 0 28px var(--dc,rgba(255,80,180,.35));}}

    .icon-wrap{ position:relative;width:82px;height:82px;margin-bottom:18px; }
    .icon{ width:82px;height:82px;border-radius:23px;background:linear-gradient(135deg,#ff4d8b,#c026d3);display:flex;align-items:center;justify-content:center;font-size:2.15rem;position:relative;z-index:2;box-shadow:0 12px 36px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);animation:iconbob 3.5s ease-in-out infinite;transition:background 1.1s,box-shadow 1.1s; }
    body.th-g .icon{ background:linear-gradient(135deg,#00e676,#00bfa5);box-shadow:0 12px 36px rgba(0,230,118,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35); }
    body.th-p .icon{ background:linear-gradient(135deg,#ff4d8b,#c026d3);box-shadow:0 12px 36px rgba(255,60,180,.55),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35); }
    @keyframes iconbob{0%,100%{transform:scale(1) rotate(0deg) translateY(0);}50%{transform:scale(1.07) rotate(-3deg) translateY(-4px);}}
    .ring{ position:absolute;border-radius:31px;border:1.5px solid var(--rc,rgba(255,80,180,.25));transition:border-color 1.1s; }
    .ring.a{ inset:-9px;animation:rcw 4s linear infinite; }
    .ring.b{ inset:-18px;border-radius:40px;border-style:dashed;border-color:var(--rc2,rgba(255,80,180,.12));animation:rccw 7.5s linear infinite;transition:border-color 1.1s; }
    body.th-g .ring.a{--rc:rgba(0,230,118,.3);}body.th-g .ring.b{--rc2:rgba(0,230,118,.15);}
    body.th-p .ring.a{--rc:rgba(255,50,200,.35);}body.th-p .ring.b{--rc2:rgba(255,50,200,.16);}
    @keyframes rcw{to{transform:rotate(360deg);}}@keyframes rccw{to{transform:rotate(-360deg);}}
    .odot{ position:absolute;width:6px;height:6px;border-radius:50%;z-index:3;background:var(--odc,rgba(255,80,180,.85));box-shadow:0 0 9px var(--odc,rgba(255,80,180,.7));animation:odotfly var(--ot,4s) var(--otl,0s) linear infinite;transition:background .8s,box-shadow .8s; }
    body.th-g .odot{--odc:rgba(0,230,118,.9);}body.th-p .odot{--odc:rgba(255,80,200,.9);}
    @keyframes odotfly{0%{transform:rotate(0deg) translateX(47px) rotate(0deg);}100%{transform:rotate(360deg) translateX(47px) rotate(-360deg);}}

    .badge{ display:flex;align-items:center;gap:8px;margin-bottom:10px; }
    .bl{ width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--ac,#c026d3));transition:background 1.1s; }
    .bl.r{ background:linear-gradient(90deg,var(--ac,#c026d3),transparent); }
    body.th-g .bl{ background:linear-gradient(90deg,transparent,#00e676); }body.th-g .bl.r{ background:linear-gradient(90deg,#00e676,transparent); }
    body.th-p .bl{ background:linear-gradient(90deg,transparent,#ff4d8b); }body.th-p .bl.r{ background:linear-gradient(90deg,#ff4d8b,transparent); }
    .bword{ font-size:.57rem;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--ac,#c026d3);transition:color 1.1s; }
    body.th-g .bword{color:#00e676;}body.th-p .bword{color:#ff4d8b;}
    .bdot{ width:4px;height:4px;border-radius:50%;background:var(--ac,#c026d3);box-shadow:0 0 8px var(--ac,#c026d3);animation:bdpulse 1.6s ease-in-out infinite alternate;transition:background 1.1s,box-shadow 1.1s; }
    body.th-g .bdot{background:#00e676;box-shadow:0 0 8px #00e676;}body.th-p .bdot{background:#ff4d8b;box-shadow:0 0 8px #ff4d8b;}
    @keyframes bdpulse{from{transform:scale(1);opacity:.4}to{transform:scale(2.4);opacity:1}}

    .title{ font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:800;font-size:2.08rem;line-height:1.18;text-align:center;color:rgba(255,255,255,.95);margin-bottom:7px;letter-spacing:-.01em; }
    .tname{ display:block;font-size:2.28rem;background:linear-gradient(135deg,#d4a0ff,#c026d3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    body.th-g .tname{ background:linear-gradient(135deg,#a0ffd0,#00e676);-webkit-background-clip:text;background-clip:text;animation:tglowG 2.8s ease-in-out infinite alternate; }
    body.th-p .tname{ background:linear-gradient(135deg,#ff8cf8,#ff4d8b);-webkit-background-clip:text;background-clip:text;animation:tglowP 2.8s ease-in-out infinite alternate; }
    @keyframes tglowG{from{filter:drop-shadow(0 0 8px rgba(0,230,118,.3));}to{filter:drop-shadow(0 0 26px rgba(0,230,118,.82));}}
    @keyframes tglowP{from{filter:drop-shadow(0 0 8px rgba(255,80,200,.3));}to{filter:drop-shadow(0 0 26px rgba(255,80,200,.82));}}

    .sub{ font-size:.8rem;font-style:italic;font-weight:400;color:rgba(255,255,255,.36);text-align:center;margin-bottom:24px;min-height:1.2em;letter-spacing:.01em; }
    .hdiv{ width:100%;height:1px;margin-bottom:20px;background:linear-gradient(90deg,transparent,var(--dvc,rgba(160,80,255,.18)) 35%,var(--dvc,rgba(160,80,255,.18)) 65%,transparent);transition:background 1.1s; }
    body.th-g .hdiv{--dvc:rgba(0,230,118,.16);}body.th-p .hdiv{--dvc:rgba(255,80,200,.2);}

    .field{ width:100%;margin-bottom:14px;position:relative; }
    .lbl{ display:block;font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px;transition:color .35s,letter-spacing .28s; }
    .field:focus-within .lbl{ letter-spacing:.24em; }
    body.th-g .field:focus-within .lbl{color:rgba(0,230,118,.72);}body.th-p .field:focus-within .lbl{color:rgba(255,77,139,.72);}
    .fu input,.fp input{ width:100%;border-radius:14px;border:1.5px solid rgba(255,255,255,.08);background:rgba(10,5,24,.68);color:#fff;font-size:.96rem;font-family:'Inter',sans-serif;font-weight:400;outline:none;transition:border-color .3s,box-shadow .3s,background .25s,transform .18s; }
    .fu input{padding:14px 18px;letter-spacing:.03em;}
    .fp input{padding:14px 46px 14px 18px;letter-spacing:.1em;}
    .fu input::placeholder,.fp input::placeholder{color:rgba(255,255,255,.16);font-weight:300;}
    .fu input:focus,.fp input:focus{background:rgba(14,7,32,.82);transform:translateY(-1px);}
    body.th-g .fu input:focus,body.th-g .fp input:focus{border-color:rgba(0,230,118,.5);box-shadow:0 0 0 3px rgba(0,230,118,.1),0 6px 18px rgba(0,140,70,.08);}
    body.th-p .fu input:focus,body.th-p .fp input:focus{border-color:rgba(255,77,139,.5);box-shadow:0 0 0 3px rgba(255,77,139,.1),0 6px 18px rgba(200,0,120,.07);}
    .eyebtn{ position:absolute;right:13px;bottom:14px;background:none;border:none;cursor:pointer;font-size:.96rem;color:rgba(255,255,255,.22);padding:2px;line-height:1;transition:color .2s,transform .18s; }
    .eyebtn:hover{color:rgba(255,255,255,.6);transform:scale(1.2);}

    .det{ width:100%;font-size:.72rem;font-weight:700;display:none;align-items:center;gap:7px;margin-top:-2px;margin-bottom:7px;animation:detpop .4s cubic-bezier(.175,.885,.32,1.275); }
    .det.on{display:flex;}
    @keyframes detpop{from{opacity:0;transform:translateY(6px) scale(.78)}to{opacity:1;transform:translateY(0) scale(1)}}
    body.th-g .det{color:#00e676;}body.th-p .det{color:#ff4d8b;}
    .detdot{ width:8px;height:8px;border-radius:50%;flex-shrink:0;background:currentColor;box-shadow:0 0 8px currentColor;animation:detdp 1.1s ease-in-out infinite alternate; }
    @keyframes detdp{from{transform:scale(1)}to{transform:scale(1.85)}}

    .btn{ width:100%;padding:15px 20px;border:none;border-radius:15px;margin-top:10px;font-size:.96rem;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:.05em;cursor:pointer;position:relative;overflow:hidden;color:#fff;background:linear-gradient(90deg,#ff4d8b,#c026d3,#e040fb);box-shadow:0 8px 28px rgba(255,60,180,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s,box-shadow .28s;display:flex;align-items:center;justify-content:center;gap:10px; }
    body.th-g .btn{ background:linear-gradient(90deg,#00e676,#00bfa5,#00c853);box-shadow:0 8px 28px rgba(0,230,118,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);animation:btnpG 3.2s ease-in-out infinite; }
    body.th-p .btn{ background:linear-gradient(90deg,#ff4d8b,#c026d3,#e040fb);box-shadow:0 8px 28px rgba(255,60,180,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);animation:btnpP 3.2s ease-in-out infinite; }
    @keyframes btnpG{0%,100%{box-shadow:0 8px 28px rgba(0,230,118,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);}50%{box-shadow:0 12px 40px rgba(0,230,118,.65),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(0,230,118,.08),inset 0 1px 0 rgba(255,255,255,.18);}}
    @keyframes btnpP{0%,100%{box-shadow:0 8px 28px rgba(255,60,180,.42),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);}50%{box-shadow:0 12px 40px rgba(255,60,180,.65),0 2px 6px rgba(0,0,0,.4),0 0 0 5px rgba(255,60,180,.08),inset 0 1px 0 rgba(255,255,255,.18);}}
    .btn:hover{transform:translateY(-2px) scale(1.012);}
    body.th-g .btn:hover{box-shadow:0 14px 44px rgba(0,230,118,.6),0 4px 10px rgba(0,0,0,.5);}
    body.th-p .btn:hover{box-shadow:0 14px 44px rgba(255,60,180,.6),0 4px 10px rgba(0,0,0,.5);}
    .btn:active{transform:scale(.98);}
    .btn::before{ content:'';position:absolute;top:0;left:-90%;width:48%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);transform:skewX(-18deg);animation:bshine 4s ease-in-out infinite; }
    @keyframes bshine{0%{left:-90%}30%,100%{left:145%;}}
    .btxt2{position:relative;z-index:1;}
    .barr{position:relative;z-index:1;animation:arrbounce 1.5s ease-in-out infinite;}
    @keyframes arrbounce{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
    .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.24);transform:scale(0);animation:ripa .6s linear;pointer-events:none;}
    @keyframes ripa{to{transform:scale(5);opacity:0;}}

    .msg{ width:100%;font-size:.75rem;font-weight:600;border-radius:11px;padding:10px 15px;margin-top:10px;text-align:center;display:none;letter-spacing:.04em;animation:msgpop .38s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes msgpop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
    .msg.err{background:rgba(255,40,70,.12);border:1px solid rgba(255,40,70,.35);color:#ff7585;}
    .msg.ok{background:rgba(80,255,150,.08);border:1px solid rgba(80,255,150,.3);color:#80ffb4;}

    .foot{ margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:7px; }
    .footxt{ display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.12);font-size:.57rem;letter-spacing:.1em;font-style:italic; }
    .footxt span{ width:14px;height:1px;background:rgba(255,255,255,.09);display:block; }
    .fdots{ display:flex;gap:5px; }
    .fdots s{ width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.1);display:block;text-decoration:none; }
    .fdots s.on{ background:var(--ac,#c026d3);box-shadow:0 0 5px var(--ac,#c026d3);transition:background .8s,box-shadow .8s; }
    body.th-g .fdots s.on{background:#00e676;box-shadow:0 0 5px #00e676;}
    body.th-p .fdots s.on{background:#ff4d8b;box-shadow:0 0 5px #ff4d8b;}

    /* confetti */
    .conf{ position:fixed;pointer-events:none;z-index:40;animation:cfall var(--cd,2s) var(--cdl,0s) ease-out forwards; }
    @keyframes cfall{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1;}100%{transform:translate(var(--cx,0),130vh) rotate(900deg) scale(.06);opacity:0;}}

    /* ═══════════════════════════════
       ── CHAT STYLES ──
    ═══════════════════════════════ */
    #page-chat{ background:#0f0a1a;flex-direction:column; }

    /* chat header */
    #chat-header{
      display:flex;align-items:center;gap:10px;padding:10px 14px;
      background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07);
      flex-shrink:0;backdrop-filter:blur(20px);
    }
    #chat-back{ background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:1.2rem;padding:4px 8px; }
    #chat-back:hover{color:#fff;}
    #chat-avatar{ width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;flex-shrink:0; }
    #chat-info{ flex:1;min-width:0; }
    #chat-name{ font-size:15px;font-weight:700;color:#fff;margin:0; }
    #chat-status{ font-size:12px;color:rgba(255,255,255,.45);margin:0; }

    /* messages area */
    #chat-messages{
      flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:4px;
      scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;
    }
    #chat-messages::-webkit-scrollbar{width:4px;}
    #chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

    .day-label{ text-align:center;margin:10px 0; }
    .day-label span{ font-size:11px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);padding:3px 12px;border-radius:12px; }

    /* typing indicator */
    #typing-indicator{ display:none;align-items:center;gap:4px;padding:8px 14px; }
    #typing-indicator.show{ display:flex; }
    .tdot{ width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);animation:tdot 1.2s ease-in-out infinite; }
    .tdot:nth-child(2){animation-delay:.2s;}.tdot:nth-child(3){animation-delay:.4s;}
    @keyframes tdot{0%,80%,100%{transform:scale(1);opacity:.4;}40%{transform:scale(1.4);opacity:1;}}

    /* message bubbles */
    .msg-row{ display:flex;max-width:100%; }
    .msg-row.mine{ justify-content:flex-end; }
    .msg-row.theirs{ justify-content:flex-start; }

    .bubble{
      max-width:72%;padding:10px 13px 6px;border-radius:18px;position:relative;
      word-break:break-word;line-height:1.5;
    }
    .mine   .bubble{ background:#5c1a8a;border-bottom-right-radius:4px;color:#fff; }
    .theirs .bubble{ background:#1e1230;border-bottom-left-radius:4px;color:#f0eaf8; }

    .bubble-text{ font-size:14.5px; }
    .bubble-media img{ max-width:100%;border-radius:10px;display:block;margin-bottom:4px; }
    .bubble-media video{ max-width:100%;border-radius:10px;display:block;margin-bottom:4px; }

    .bubble-footer{ display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:4px; }
    .bubble-time{ font-size:10.5px;color:rgba(255,255,255,.4); }

    /* status icons */
    .status-icon{ display:flex;align-items:center; }
    .si-sending::before{ content:'🕐';font-size:10px; }
    .si-sent::before{ content:'✓';font-size:11px;color:rgba(255,255,255,.45); }
    .si-delivered::before{ content:'✓✓';font-size:11px;color:rgba(255,255,255,.45); }
    .si-read::before{ content:'✓✓';font-size:11px;color:#00e5ff; }

    /* reply preview inside bubble */
    .reply-preview{ border-left:3px solid rgba(255,255,255,.35);padding:4px 8px;margin-bottom:6px;border-radius:4px;background:rgba(255,255,255,.07); }
    .reply-preview span{ font-size:12px;color:rgba(255,255,255,.55);display:block; }

    /* reactions */
    .bubble-reactions{ display:flex;gap:3px;flex-wrap:wrap;margin-top:3px; }

<script>
/* ═══════════════════════════════
   USERS (local auth — no backend)
═══════════════════════════════ */
const USERS = {
  dharya:  { id:'DHARYA', pw:'09/10/2007', th:'th-g', emoji:'🌿', name:'Surya',   sub:'Your private space is ready 🌿'  },
  sadhana: { id:'DHARYA', pw:'29/02/2008', th:'th-p', emoji:'❤️',  name:'Sadhana', sub:'Your special world is waiting ✨' },
};
let who = null;
let currentUser = null; // 'dharya' | 'sadhana'

/* ═══════════════════════════════
   CANVAS — stars + shooting stars
═══════════════════════════════ */
const CV = document.getElementById('cv');
const CTX = CV.getContext('2d');
let W, H;
function onResize(){ W = CV.width = innerWidth; H = CV.height = innerHeight; }
onResize(); addEventListener('resize', onResize);

const STARS = Array.from({length:320}, ()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.18,
  a:Math.random(), da:(Math.random()*.005+.001)*(Math.random()>.5?1:-1),
  base:Math.random()*.36+.05, warm:Math.random()>.82,
}));
const POOL = []; let spawnT=0; const SPAWN_GAP=65;

function shootColour(){
  if(who==='dharya') return [150,255,210];
  if(who==='sadhana') return [255,150,215];
  return [210,210,255];
}
function spawnStar(){
  const angle=(20+Math.random()*22)*Math.PI/180;
  const speed=5.5+Math.random()*5;
  const tail=100+Math.random()*200;
  const life=50+Math.random()*50;
  const [r,g,b]=shootColour();
  POOL.push({ x:Math.random()*W*.85, y:Math.random()*H*.55,
    vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
    tail, life, maxLife:life, r,g,b, w:1+Math.random()*1.3 });
}
function renderFrame(){
  CTX.clearRect(0,0,W,H);
  STARS.forEach(s=>{
    s.a+=s.da; if(s.a>1||s.a<0)s.da*=-1;
    const a=(s.base*Math.abs(s.a)).toFixed(3);
    CTX.beginPath(); CTX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    CTX.fillStyle=s.warm?`rgba(255,225,200,${a})`:`rgba(215,215,255,${a})`; CTX.fill();
  });
  if(++spawnT>=SPAWN_GAP){ spawnStar(); if(Math.random()>.68)setTimeout(spawnStar,180+Math.random()*200); spawnT=0; }
  for(let i=POOL.length-1;i>=0;i--){
    const s=POOL[i]; s.x+=s.vx; s.y+=s.vy; s.life--;
    if(s.life<=0||s.x>W+40||s.y>H+40){ POOL.splice(i,1); continue; }
    const t=1-s.life/s.maxLife;
    let alpha=t<.10?t/.10:t>.78?1-(t-.78)/.22:1;
    alpha=Math.max(0,Math.min(1,alpha));
    const {r,g,b}=s;
    const ang=Math.atan2(s.vy,s.vx);
    const tx=s.x-Math.cos(ang)*s.tail, ty=s.y-Math.sin(ang)*s.tail;
    const grad=CTX.createLinearGradient(tx,ty,s.x,s.y);
    grad.addColorStop(0,`rgba(${r},${g},${b},0)`);
    grad.addColorStop(.45,`rgba(${r},${g},${b},${+(alpha*.12).toFixed(3)})`);
    grad.addColorStop(.82,`rgba(${r},${g},${b},${+(alpha*.5).toFixed(3)})`);
    grad.addColorStop(1,`rgba(${r},${g},${b},${+(alpha*.92).toFixed(3)})`);
    CTX.save(); CTX.beginPath(); CTX.moveTo(tx,ty); CTX.lineTo(s.x,s.y);
    CTX.strokeStyle=grad; CTX.lineWidth=s.w; CTX.lineCap='round'; CTX.stroke(); CTX.restore();
    const cr=s.w*1.8+1;
    const cg=CTX.createRadialGradient(s.x,s.y,0,s.x,s.y,cr);
    cg.addColorStop(0,`rgba(${r},${g},${b},${+alpha.toFixed(3)})`); cg.addColorStop(1,`rgba(${r},${g},${b},0)`);
    CTX.beginPath(); CTX.arc(s.x,s.y,cr,0,Math.PI*2); CTX.fillStyle=cg; CTX.fill();
    const hg=CTX.createRadialGradient(s.x,s.y,0,s.x,s.y,cr*4.5);
    hg.addColorStop(0,`rgba(${r},${g},${b},${+(alpha*.32).toFixed(3)})`);
    hg.addColorStop(.45,`rgba(${r},${g},${b},${+(alpha*.1).toFixed(3)})`); hg.addColorStop(1,`rgba(${r},${g},${b},0)`);
    CTX.beginPath(); CTX.arc(s.x,s.y,cr*4.5,0,Math.PI*2); CTX.fillStyle=hg; CTX.fill();
  }
  requestAnimationFrame(renderFrame);
}
renderFrame();
function shootBurst(n=8){ for(let i=0;i<n;i++) setTimeout(spawnStar,i*80); }

/* ═══════════════════════════════
   3D TILT
═══════════════════════════════ */
const card=document.getElementById('card');
addEventListener('mousemove',e=>{
  if(document.getElementById('page-chat').classList.contains('show')) return;
  const dx=(e.clientX-W/2)/(W/2), dy=(e.clientY-H/2)/(H/2);
  card.style.animation='none';
  card.style.transform=`rotateX(${-dy*7}deg) rotateY(${dx*7}deg) translateZ(14px)`;
  document.getElementById('ob1').style.transform=`translate(${-dx*16}px,${-dy*12}px)`;
  document.getElementById('ob2').style.transform=`translate(${dx*11}px,${dy*9}px)`;
});
addEventListener('mouseleave',()=>{
  card.style.transition='transform .9s ease'; card.style.transform='';
  setTimeout(()=>{ card.style.animation='cardfloat 7s ease-in-out infinite'; card.style.transition=''; },950);
});

/* ═══════════════════════════════
   CURSOR SPARKS
═══════════════════════════════ */
addEventListener('mousemove',e=>{
  if(Math.random()>.22)return;
  const sp=document.createElement('div'); sp.className='spark';
  const c=who==='dharya'?`rgba(${80+~~(Math.random()*80)},255,${140+~~(Math.random()*80)},.8)`
    :who==='sadhana'?`rgba(255,${60+~~(Math.random()*80)},${180+~~(Math.random()*60)},.8)`
    :`rgba(200,200,255,.45)`;
  const sz=2+Math.random()*4;
  sp.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX}px;top:${e.clientY}px;background:${c};box-shadow:0 0 8px ${c};`;
  document.body.appendChild(sp); setTimeout(()=>sp.remove(),800);
});

/* ═══════════════════════════════
   LOGIN — THEME
═══════════════════════════════ */
function applyTheme(key){
  if(who===key)return; who=key;
  const u=USERS[key];
  document.body.className=u.th;
  document.getElementById('icon').textContent=u.emoji;
  document.getElementById('sub').textContent=u.sub;
  document.getElementById('dettxt').textContent=u.name+' detected ✓';
  document.getElementById('det').className='det on';
  const el=document.getElementById('tname'); el.textContent=''; let i=0;
  (function tw(){ if(i<=u.name.length){ el.textContent=u.name.slice(0,i++); setTimeout(tw,55); } })();
  shootBurst(10); screenFlash(u.th);
}
function resetTheme(){
  who=null; document.body.className='';
  document.getElementById('icon').textContent='🌿';
  document.getElementById('tname').textContent='Dharya';
  document.getElementById('sub').textContent='Your special world is waiting ✨';
  document.getElementById('det').className='det';
}
function screenFlash(th){
  const f=document.createElement('div');
  const c=th==='th-g'?'rgba(0,230,118,.06)':'rgba(255,60,180,.07)';
  f.style.cssText=`position:fixed;inset:0;z-index:9999;pointer-events:none;background:${c};animation:_fo .65s ease-out forwards;`;
  const s=document.createElement('style'); s.textContent='@keyframes _fo{from{opacity:1}to{opacity:0}}';
  document.head.appendChild(s); document.body.appendChild(f);
  setTimeout(()=>{ f.remove(); s.remove(); },750);
}

function onUID(v){ clearLMsg(); const pw=document.getElementById('pw').value.trim(); if(pw)onPW(pw); }
function onPW(v){
  clearLMsg();
  if(!v){ resetTheme(); return; }
  const m=Object.entries(USERS).find(([,u])=>u.pw===v);
  if(m){ applyTheme(m[0]); return; }
  const pG=USERS.dharya.pw.startsWith(v), pP=USERS.sadhana.pw.startsWith(v);
  if(!pG&&!pP)resetTheme();
}

let pvis=false;
function togglePw(){ const i=document.getElementById('pw'); pvis=!pvis; i.type=pvis?'text':'password'; document.getElementById('eye').textContent=pvis?'🙈':'👁'; }

function showLMsg(t,c){ const b=document.getElementById('lmsg'); b.textContent=t; b.className='msg '+c; b.style.display='block'; }
function clearLMsg(){ document.getElementById('lmsg').style.display='none'; }

function shakeCard(){
  card.style.animation='none';
  [[-13,0],[13,65],[-7,130],[7,195],[0,260]].forEach(([x,t])=>setTimeout(()=>card.style.transform=`translateX(${x}px)`,t));
  setTimeout(()=>{ card.style.transform=''; card.style.animation='cardfloat 7s ease-in-out infinite'; },320);
}

function ripBtn(btn){ const r=document.createElement('span'); r.className='rip'; r.style.cssText='width:250px;height:250px;top:calc(50% - 125px);left:calc(50% - 125px);'; btn.appendChild(r); setTimeout(()=>r.remove(),700); }

function confBurst(cols){
  for(let i=0;i<85;i++){
    const p=document.createElement('div'); p.className='conf';
    const sz=Math.random()*11+3, c=cols[~~(Math.random()*cols.length)];
    p.style.cssText=`width:${sz}px;height:${sz}px;left:${10+Math.random()*80}%;top:${8+Math.random()*50}%;background:${c};box-shadow:0 0 ${sz}px ${c};--cd:${(Math.random()*2+.7).toFixed(2)}s;--cdl:${(Math.random()*.5).toFixed(2)}s;--cx:${(Math.random()*340-170).toFixed(0)}px;border-radius:${Math.random()>.3?'50%':'4px'};`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),3800);
  }
}

/* ═══════════════════════════════
   LOGIN SUBMIT
═══════════════════════════════ */
function login(){
  const uid=document.getElementById('uid').value.trim().toUpperCase();
  const pw=document.getElementById('pw').value.trim();
  const btn=document.getElementById('lbtn');
  if(!pw){ showLMsg('Please enter your password ✦','err'); shakeCard(); return; }
  const m=Object.entries(USERS).find(([,u])=>u.pw===pw);
  if(!m){ showLMsg('Incorrect password ✦','err'); shakeCard(); return; }
  if(uid&&uid!==m[1].id){ showLMsg('Username does not match ✦','err'); shakeCard(); return; }
  const [key,u]=m;
  applyTheme(key); currentUser=key;
  btn.innerHTML='<span class="btxt2">Entering…</span><span class="barr">✦</span>';
  btn.style.pointerEvents='none';
  ripBtn(btn);
  confBurst(key==='dharya'?['#00e676','#a0ffd0','#00bfa5','#fff']:['#ff4d8b','#ff8cf8','#c026d3','#fff']);
  shootBurst(18);
  // After short celebration, slide into chat
  setTimeout(()=> enterChat(key), 1400);
}

addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.activeElement.id!=='chat-text') login(); });

/* ═══════════════════════════════
   TRANSITION TO CHAT
═══════════════════════════════ */
function enterChat(key){
  document.getElementById('page-login').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('page-chat').classList.add('show');
    initChat(key);
  }, 500);
}

function goBack(){
  document.getElementById('page-chat').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('page-login').classList.remove('hide');
    const btn=document.getElementById('lbtn');
    btn.innerHTML='<span class="btxt2">Enter my world</span><span class="barr">→</span>';
    btn.style.pointerEvents='';
  }, 300);
}

/* ═══════════════════════════════
   CHAT ENGINE
═══════════════════════════════ */
// In-memory message store (works without a backend — just for this session)
// To use Supabase: add EXPO_PUBLIC_SUPABASE_URL + KEY to .env.local and call initSupabase()
let messages = [];       // {id,sender,content,time,status,replyTo,reactions}
let replyToMsg = null;
let ctxTargetId = null;
let presenceTimer = null;

const PARTNER = {
  dharya:  { name:'Sadhana', emoji:'🌸', color:'#ff4d8b' },
  sadhana: { name:'Surya',   emoji:'🌿', color:'#00e676' },
};

function initChat(key){
  const me = USERS[key];
  const partner = PARTNER[key];

  // Header
  document.getElementById('chat-avatar').textContent = partner.emoji;
  document.getElementById('chat-avatar').style.background = partner.color + '33';
  document.getElementById('chat-avatar').style.color = partner.color;
  document.getElementById('chat-name').textContent   = partner.name;
  document.getElementById('chat-status').textContent = 'online';

  // ── SHARED storage key — same for both users so messages cross tabs ──
  const CHAT_KEY = 'dharya_chat_v1';
  const saved = localStorage.getItem(CHAT_KEY);
  if(saved){ try{ messages=JSON.parse(saved); }catch(e){ messages=[]; } }
  else { messages=[]; }

  renderMessages();
  scrollToBottom();

  // Input — Enter sends, Shift+Enter newline
  document.getElementById('chat-text').addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
  });
  document.getElementById('chat-text').addEventListener('input', handleTyping);

  // ── Cross-tab real-time sync via storage event ──
  window.addEventListener('storage', (e) => {
    if(e.key !== 'dharya_chat_v1') return;
    try{ messages = JSON.parse(e.newValue) || []; }catch(err){ messages=[]; }
    renderMessages();
    // Auto-scroll only if already near bottom
    const area = document.getElementById('chat-messages');
    const dist = area.scrollHeight - area.scrollTop - area.clientHeight;
    if(dist < 120) scrollToBottom();
  });

  // Scroll tracking
  document.getElementById('chat-messages').addEventListener('scroll', onScroll);

  // Close menus on outside click
  document.addEventListener('click', closeMenus);
}

function saveMsgs(){
  localStorage.setItem('dharya_chat_v1', JSON.stringify(messages));
}

/* ── Render all messages ── */
function renderMessages(){
  const area = document.getElementById('chat-messages');
  const empty = document.getElementById('empty-chat');
  if(messages.length===0){ empty.style.display='flex'; return; }
  empty.style.display='none';

  // Build sorted by time
  const sorted = [...messages].sort((a,b)=>a.time-b.time);
  let lastDay='';
  const frags = [];

  sorted.forEach(msg=>{
    const d=new Date(msg.time);
    const dayStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    if(dayStr!==lastDay){
      lastDay=dayStr;
      frags.push(`<div class="day-label"><span>${dayStr}</span></div>`);
    }
    frags.push(renderBubble(msg));
  });

  // Replace everything except empty-chat div
  area.innerHTML='<div id="empty-chat" style="display:none"><span style="font-size:2.5rem">✦</span><p>Your private space.<br>Say something beautiful.</p></div>';
  area.insertAdjacentHTML('beforeend', frags.join(''));

  // Attach long-press / right-click
  area.querySelectorAll('.bubble').forEach(el=>{
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); showCtxMenu(e, el.dataset.id); });
    el.addEventListener('dblclick', ()=>showEmojiPicker(el.dataset.id, el));
  });
}

function renderBubble(msg){
  const mine = msg.sender === currentUser;
  const t=new Date(msg.time);
  const timeStr=t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const statusHtml=mine?`<span class="status-icon si-${msg.status}"></span>`:'';
  const editedHtml=msg.edited?`<span style="font-size:10px;color:rgba(255,255,255,.35);"> edited</span>`:'';

  // deleted for me
  if(msg.deletedFor && msg.deletedFor.includes(currentUser)) return '';
  // deleted for everyone
  if(msg.deletedForAll) {
    return `<div class="msg-row ${mine?'mine':'theirs'}">
      <div class="bubble" data-id="${msg.id}" style="opacity:.5;font-style:italic;">
        <span class="bubble-text" style="color:rgba(255,255,255,.4)">🗑 This message was deleted</span>
      </div></div>`;
  }

  // reply preview
  let replyHtml='';
  if(msg.replyTo){
    const orig=messages.find(m=>m.id===msg.replyTo);
    if(orig) replyHtml=`<div class="reply-preview"><span>↩ ${orig.content||'📎 media'}</span></div>`;
  }

  // reactions
  let reactHtml='';
  if(msg.reactions && Object.keys(msg.reactions).length>0){
    reactHtml='<div class="bubble-reactions">';
    for(const [emoji,users] of Object.entries(msg.reactions)){
      const iMine=users.includes(currentUser);
      reactHtml+=`<span class="reaction-chip${iMine?' mine-react':''}" onclick="toggleReaction('${msg.id}','${emoji}')">${emoji}${users.length>1?' '+users.length:''}</span>`;
    }
    reactHtml+='</div>';
  }

  return `<div class="msg-row ${mine?'mine':'theirs'}">
    <div class="bubble" data-id="${msg.id}">
      ${replyHtml}
      <div class="bubble-text">${escHtml(msg.content)}</div>
      <div class="bubble-footer">
        ${editedHtml}
        <span class="bubble-time">${timeStr}</span>
        ${statusHtml}
      </div>
    </div>
    ${reactHtml}
  </div>`;
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

/* ── Send message ── */
function sendMsg(){
  const text=document.getElementById('chat-text').value.trim();
  if(!text) return;
  const msg={
    id: Date.now()+'_'+Math.random().toString(36).slice(2),
    sender: currentUser,  // store actual user key, not 'me'
    content:text, time:Date.now(),
    status:'sent', replyTo: replyToMsg?.id||null,
    reactions:{}, edited:false, deletedForAll:false, deletedFor:[],
  };
  messages.push(msg);
  saveMsgs();
  document.getElementById('chat-text').value='';
  clearReply();
  renderMessages();
  scrollToBottom();

  // Delivered after 600ms, read after 2.5s (simulated for same-device; cross-tab handled by storage event)
  setTimeout(()=>{ const m=messages.find(x=>x.id===msg.id); if(m){ m.status='delivered'; saveMsgs(); renderMessages(); } },600);
  setTimeout(()=>{ const m=messages.find(x=>x.id===msg.id); if(m){ m.status='read'; saveMsgs(); renderMessages(); } },2500);
}

/* ── Reply ── */
function setReply(id){
  const m=messages.find(x=>x.id===id); if(!m)return;
  replyToMsg=m;
  document.getElementById('reply-bar').classList.add('show');
  document.getElementById('reply-bar-text').textContent='↩ '+( m.content || '📎 media');
  document.getElementById('chat-text').focus();
}
function clearReply(){
  replyToMsg=null;
  document.getElementById('reply-bar').classList.remove('show');
}

/* ── Reactions ── */
let emojiTargetId=null;
function showEmojiPicker(id, el){
  emojiTargetId=id;
  const rect=el.getBoundingClientRect();
  const picker=document.getElementById('reaction-picker');
  picker.style.left=Math.min(rect.left, innerWidth-220)+'px';
  picker.style.top=(rect.top-60)+'px';
  picker.classList.add('show');
}
document.getElementById('reaction-picker').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    if(!emojiTargetId)return;
    toggleReaction(emojiTargetId, btn.dataset.e);
    document.getElementById('reaction-picker').classList.remove('show');
    emojiTargetId=null;
  });
});
function toggleReaction(msgId, emoji){
  const m=messages.find(x=>x.id===msgId); if(!m)return;
  if(!m.reactions)m.reactions={};
  if(!m.reactions[emoji])m.reactions[emoji]=[];
  const idx=m.reactions[emoji].indexOf(currentUser);
  if(idx>-1)m.reactions[emoji].splice(idx,1); else m.reactions[emoji].push(currentUser);
  if(m.reactions[emoji].length===0)delete m.reactions[emoji];
  saveMsgs(); renderMessages();
}

/* ── Context menu ── */
function showCtxMenu(e, id){
  ctxTargetId=id;
  const menu=document.getElementById('ctx-menu');
  const m=messages.find(x=>x.id===id);
  const mine=m&&m.sender===currentUser;
  document.getElementById('ctx-edit').style.display=mine?'flex':'none';
  document.getElementById('ctx-del-all').style.display=mine?'flex':'none';
  menu.style.left=Math.min(e.clientX, innerWidth-160)+'px';
  menu.style.top=Math.min(e.clientY, innerHeight-180)+'px';
  menu.classList.add('show');
}
function closeMenus(e){
  if(!document.getElementById('ctx-menu').contains(e.target)) document.getElementById('ctx-menu').classList.remove('show');
  if(!document.getElementById('reaction-picker').contains(e.target)) document.getElementById('reaction-picker').classList.remove('show');
}
document.getElementById('ctx-reply').onclick=()=>{ setReply(ctxTargetId); document.getElementById('ctx-menu').classList.remove('show'); };
document.getElementById('ctx-edit').onclick=()=>{
  const m=messages.find(x=>x.id===ctxTargetId); if(!m)return;
  const val=window.prompt('Edit message:',m.content);
  if(val!==null&&val.trim()){ m.content=val.trim(); m.edited=true; saveMsgs(); renderMessages(); }
  document.getElementById('ctx-menu').classList.remove('show');
};
document.getElementById('ctx-del-me').onclick=()=>{
  const m=messages.find(x=>x.id===ctxTargetId); if(!m)return;
  if(!m.deletedFor)m.deletedFor=[];
  m.deletedFor.push(currentUser); saveMsgs(); renderMessages();
  document.getElementById('ctx-menu').classList.remove('show');
};
document.getElementById('ctx-del-all').onclick=()=>{
  const m=messages.find(x=>x.id===ctxTargetId); if(!m)return;
  m.deletedForAll=true; m.content=''; saveMsgs(); renderMessages();
  document.getElementById('ctx-menu').classList.remove('show');
};

/* ── Typing indicator (cosmetic) ── */
function handleTyping(){
  document.getElementById('typing-indicator').classList.add('show');
  clearTimeout(presenceTimer);
  presenceTimer=setTimeout(()=>document.getElementById('typing-indicator').classList.remove('show'),2000);
}

/* ── Scroll helpers ── */
function scrollToBottom(){ const a=document.getElementById('chat-messages'); a.scrollTop=a.scrollHeight; }
function onScroll(){
  const a=document.getElementById('chat-messages');
  const dist=a.scrollHeight-a.scrollTop-a.clientHeight;
  document.getElementById('jump-btn').classList.toggle('show',dist>120);
}
</script>
</body>
</html>
