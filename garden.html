<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
  <title>Dharya Gallery 📸</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700;1,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100%;
      font-family:'Inter',sans-serif;
      background:#0a0a0f;
      color:#fff;
      overflow-x:hidden;
    }

    /* ── Top bar ── */
    #topbar{
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;gap:12px;
      padding:max(14px,env(safe-area-inset-top,14px)) 16px 14px;
      background:rgba(10,10,15,.85);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    #back-btn{
      background:rgba(255,255,255,.1);border:none;border-radius:50%;
      width:38px;height:38px;display:flex;align-items:center;justify-content:center;
      color:#fff;cursor:pointer;font-size:1.1rem;flex-shrink:0;
      transition:background .18s;
    }
    #back-btn:hover{background:rgba(255,255,255,.2);}
    #gallery-title{
      flex:1;
      font-family:'Cormorant Garamond',serif;font-style:italic;
      font-size:1.5rem;font-weight:800;color:#fff;
      text-shadow:0 2px 12px rgba(0,0,0,.5);
    }
    #photo-count{
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
      border-radius:20px;padding:5px 12px;
      font-size:12px;font-weight:600;color:rgba(255,255,255,.7);
      letter-spacing:.04em;
    }

    /* ── Filter tabs ── */
    #filters{
      display:flex;gap:8px;padding:16px 16px 0;
      overflow-x:auto;scrollbar-width:none;
    }
    #filters::-webkit-scrollbar{display:none;}
    .filter-btn{
      flex-shrink:0;
      padding:8px 18px;border-radius:24px;border:1.5px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:rgba(255,255,255,.55);font-size:13px;font-weight:600;
      cursor:pointer;font-family:'Inter',sans-serif;
      transition:all .2s;white-space:nowrap;
    }
    .filter-btn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);}
    .filter-btn.active{
      background:linear-gradient(135deg,#f472b6,#c026d3);
      border-color:transparent;color:#fff;
      box-shadow:0 4px 16px rgba(192,38,211,.4);
    }

    /* ── Upload strip ── */
    #upload-area{
      margin:16px 16px 0;
      border:2px dashed rgba(255,255,255,.12);
      border-radius:16px;
      padding:18px;
      text-align:center;
      cursor:pointer;
      transition:all .2s;
      background:rgba(255,255,255,.02);
      position:relative;
    }
    #upload-area:hover{border-color:rgba(192,38,211,.5);background:rgba(192,38,211,.05);}
    #upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    #upload-icon{font-size:1.8rem;margin-bottom:6px;}
    #upload-text{font-size:13px;color:rgba(255,255,255,.45);font-weight:500;}
    #upload-sub{font-size:11px;color:rgba(255,255,255,.25);margin-top:3px;}

    /* ── Section label ── */
    .section-label{
      padding:20px 16px 10px;
      font-size:11px;font-weight:700;letter-spacing:.1em;
      color:rgba(255,255,255,.3);text-transform:uppercase;
    }

    /* ── Gallery grid ── */
    #gallery-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:2px;
      padding:0 0 calc(env(safe-area-inset-bottom,20px) + 20px);
    }

    .gallery-item{
      position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;
      background:rgba(255,255,255,.04);
    }
    .gallery-item img{
      width:100%;height:100%;object-fit:cover;
      transition:transform .3s ease;
    }
    .gallery-item:hover img{transform:scale(1.06);}
    .gallery-item .overlay{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.65),transparent 50%);
      opacity:0;transition:opacity .2s;
      display:flex;align-items:flex-end;padding:8px;
    }
    .gallery-item:hover .overlay{opacity:1;}
    .gallery-item .item-label{
      font-size:11px;font-weight:600;color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      width:100%;
    }

    /* Heart badge for favourites */
    .gallery-item .fav-dot{
      position:absolute;top:6px;right:6px;
      font-size:13px;line-height:1;
      filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
    }

    /* Wide item spans 2 columns */
    .gallery-item.wide{
      grid-column:span 2;
      aspect-ratio:2/1;
    }

    /* Empty placeholder tiles */
    .gallery-item.empty{
      background:rgba(255,255,255,.03);
      display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;opacity:.3;
    }

    /* ── Lightbox ── */
    #lightbox{
      position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,.92);backdrop-filter:blur(20px);
      display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
      padding:20px;
    }
    #lightbox.open{display:flex;}
    #lightbox img{
      max-width:100%;max-height:75vh;
      border-radius:12px;object-fit:contain;
      box-shadow:0 20px 80px rgba(0,0,0,.8);
    }
    #lb-caption{
      font-size:14px;color:rgba(255,255,255,.65);text-align:center;
      font-weight:500;max-width:320px;line-height:1.5;
    }
    #lb-close{
      position:absolute;top:max(18px,env(safe-area-inset-top,18px));right:18px;
      background:rgba(255,255,255,.12);border:none;border-radius:50%;
      width:38px;height:38px;color:#fff;font-size:1.1rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .18s;
    }
    #lb-close:hover{background:rgba(255,255,255,.22);}
    #lb-nav{
      display:flex;gap:12px;
    }
    .lb-nav-btn{
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
      border-radius:24px;padding:9px 22px;color:#fff;font-size:14px;font-weight:600;
      cursor:pointer;font-family:'Inter',sans-serif;transition:background .18s;
    }
    .lb-nav-btn:hover{background:rgba(255,255,255,.2);}

    /* ── Toast ── */
    #toast{
      position:fixed;bottom:calc(env(safe-area-inset-bottom,20px)+20px);
      left:50%;transform:translateX(-50%) translateY(20px);
      background:rgba(30,30,40,.95);border:1px solid rgba(255,255,255,.12);
      border-radius:24px;padding:10px 22px;
      font-size:13px;font-weight:600;color:#fff;
      opacity:0;transition:all .3s;pointer-events:none;
      white-space:nowrap;backdrop-filter:blur(12px);
      z-index:300;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* ── Memories banner ── */
    #memories-banner{
      margin:0 16px;
      background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(124,58,237,.15));
      border:1px solid rgba(244,114,182,.25);
      border-radius:16px;padding:14px 18px;
      display:flex;align-items:center;gap:12px;
    }
    #mem-icon{font-size:1.8rem;}
    #mem-info{flex:1;}
    #mem-title{font-size:14px;font-weight:700;color:#fff;}
    #mem-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:2px;}
    #mem-btn{
      padding:8px 16px;border-radius:20px;border:none;
      background:linear-gradient(135deg,#f472b6,#7c3aed);
      color:#fff;font-size:12px;font-weight:700;cursor:pointer;
      font-family:'Inter',sans-serif;white-space:nowrap;
      transition:opacity .18s;
    }
    #mem-btn:hover{opacity:.85;}
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <button id="back-btn" onclick="goBack()">←</button>
    <div id="gallery-title">Our Gallery</div>
    <div id="photo-count" id="photo-count-badge">0 photos</div>
  </div>

  <!-- Filter tabs -->
  <div id="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('favourites',this)">❤️ Favourites</button>
    <button class="filter-btn" onclick="setFilter('moments',this)">✨ Moments</button>
    <button class="filter-btn" onclick="setFilter('places',this)">📍 Places</button>
    <button class="filter-btn" onclick="setFilter('selfies',this)">🤳 Selfies</button>
  </div>

  <!-- Upload -->
  <div id="upload-area">
    <input type="file" accept="image/*" multiple onchange="handleUpload(event)"/>
    <div id="upload-icon">📷</div>
    <div id="upload-text">Add photos to your gallery</div>
    <div id="upload-sub">Tap to choose · Drag & drop supported</div>
  </div>

  <!-- Memories banner -->
  <div id="memories-banner">
    <div id="mem-icon">🎞️</div>
    <div id="mem-info">
      <div id="mem-title">This Day Last Year</div>
      <div id="mem-sub">Rediscover a memory from today</div>
    </div>
    <button id="mem-btn" onclick="showMemory()">View →</button>
  </div>

  <!-- Section label -->
  <div class="section-label" id="grid-label">Recently Added</div>

  <!-- Gallery grid -->
  <div id="gallery-grid"></div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lb-close" onclick="closeLightbox()">✕</button>
    <img id="lb-img" src="" alt=""/>
    <div id="lb-caption"></div>
    <div id="lb-nav">
      <button class="lb-nav-btn" onclick="lbPrev()">← Prev</button>
      <button class="lb-nav-btn" onclick="lbNext()">Next →</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

<script>
/* ══════════════════════════════
   STATE
══════════════════════════════ */
const STORE_KEY = 'dharya_gallery_v1';
let photos = [];       // {id, src, label, tag, fav, added}
let currentFilter = 'all';
let lbIndex = 0;
let filteredCache = [];

/* ══════════════════════════════
   PERSISTENCE
══════════════════════════════ */
function loadPhotos(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }
  catch(e){ return []; }
}
function savePhotos(){
  // Store only metadata + base64 src
  localStorage.setItem(STORE_KEY, JSON.stringify(photos));
}

/* ══════════════════════════════
   SEED DATA (placeholders)
══════════════════════════════ */
const SEED = [
  {id:'s1',src:'',label:'Study Session 📚',tag:'moments',fav:false,added:Date.now()-86400000*3,
   gradient:'linear-gradient(135deg,#667eea,#764ba2)',emoji:'📚'},
  {id:'s2',src:'',label:'Coffee Break ☕',tag:'selfies',fav:true,added:Date.now()-86400000*5,
   gradient:'linear-gradient(135deg,#f093fb,#f5576c)',emoji:'☕'},
  {id:'s3',src:'',label:'Campus Walk 🌿',tag:'places',fav:false,added:Date.now()-86400000*7,
   gradient:'linear-gradient(135deg,#4facfe,#00f2fe)',emoji:'🌿'},
  {id:'s4',src:'',label:'Late Night 🌙',tag:'moments',fav:true,added:Date.now()-86400000*10,
   gradient:'linear-gradient(135deg,#43e97b,#38f9d7)',emoji:'🌙'},
  {id:'s5',src:'',label:'Rainy Day 🌧️',tag:'places',fav:false,added:Date.now()-86400000*12,
   gradient:'linear-gradient(135deg,#fa709a,#fee140)',emoji:'🌧️'},
  {id:'s6',src:'',label:'Together 💖',tag:'selfies',fav:true,added:Date.now()-86400000*14,
   gradient:'linear-gradient(135deg,#a18cd1,#fbc2eb)',emoji:'💖'},
  {id:'s7',src:'',label:'Sunset View 🌅',tag:'places',fav:false,added:Date.now()-86400000*15,
   gradient:'linear-gradient(135deg,#ffecd2,#fcb69f)',emoji:'🌅'},
  {id:'s8',src:'',label:'Project Night 💻',tag:'moments',fav:false,added:Date.now()-86400000*18,
   gradient:'linear-gradient(135deg,#a1c4fd,#c2e9fb)',emoji:'💻'},
  {id:'s9',src:'',label:'Flowers for You 🌸',tag:'moments',fav:true,added:Date.now()-86400000*20,
   gradient:'linear-gradient(135deg,#fddb92,#d1fdff)',emoji:'🌸'},
];

/* ══════════════════════════════
   INIT
══════════════════════════════ */
function init(){
  photos = loadPhotos();
  // If no stored photos, seed with placeholders
  if(photos.length === 0){
    photos = SEED.map(s=>({...s}));
    savePhotos();
  }
  renderGrid();
  updateCount();
}

/* ══════════════════════════════
   RENDER
══════════════════════════════ */
function getFiltered(){
  if(currentFilter === 'all') return [...photos].reverse();
  if(currentFilter === 'favourites') return [...photos].filter(p=>p.fav).reverse();
  return [...photos].filter(p=>p.tag===currentFilter).reverse();
}

function renderGrid(){
  const grid = document.getElementById('gallery-grid');
  const label = document.getElementById('grid-label');
  const items = getFiltered();
  filteredCache = items;

  const filterLabels = {
    all:'Recently Added', favourites:'Favourites ❤️',
    moments:'Moments ✨', places:'Places 📍', selfies:'Selfies 🤳'
  };
  label.textContent = filterLabels[currentFilter] || 'Photos';

  if(items.length === 0){
    grid.innerHTML = `
      <div style="grid-column:1/-1;padding:48px 16px;text-align:center;color:rgba(255,255,255,.3);">
        <div style="font-size:3rem;margin-bottom:12px;">🖼️</div>
        <div style="font-size:14px;font-weight:600;">No photos here yet</div>
        <div style="font-size:12px;margin-top:6px;">Add your first photo above</div>
      </div>`;
    return;
  }

  grid.innerHTML = items.map((p,i) => {
    const isWide = (i % 7 === 0 && i !== 0); // every 7th item is wide
    const imgContent = p.src
      ? `<img src="${p.src}" alt="${p.label}" loading="lazy" onclick="openLightbox(${i})"/>`
      : `<div onclick="openLightbox(${i})" style="
          width:100%;height:100%;
          background:${p.gradient||'#1a1a2e'};
          display:flex;align-items:center;justify-content:center;
          font-size:2.2rem;cursor:pointer;
        ">${p.emoji||'🖼️'}</div>`;
    return `
      <div class="gallery-item${isWide?' wide':''}" data-id="${p.id}">
        ${imgContent}
        <div class="overlay"><span class="item-label">${p.label}</span></div>
        ${p.fav ? '<span class="fav-dot">❤️</span>' : ''}
      </div>`;
  }).join('');
}

function updateCount(){
  const badge = document.getElementById('photo-count');
  badge.textContent = `${photos.length} photo${photos.length!==1?'s':''}`;
}

/* ══════════════════════════════
   FILTER
══════════════════════════════ */
function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

/* ══════════════════════════════
   UPLOAD
══════════════════════════════ */
function handleUpload(e){
  const files = Array.from(e.target.files);
  if(!files.length) return;
  let loaded = 0;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev => {
      const name = file.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');
      const label = name.charAt(0).toUpperCase()+name.slice(1);
      photos.push({
        id: 'u'+Date.now()+Math.random().toString(36).slice(2),
        src: ev.target.result,
        label,
        tag: 'moments',
        fav: false,
        added: Date.now(),
        gradient: '',
        emoji: '📷'
      });
      loaded++;
      if(loaded === files.length){
        savePhotos();
        renderGrid();
        updateCount();
        showToast(`${files.length} photo${files.length!==1?'s':''} added ✓`);
      }
    };
    reader.readAsDataURL(file);
  });
  // reset input so same file can be re-selected
  e.target.value = '';
}

/* ══════════════════════════════
   LIGHTBOX
══════════════════════════════ */
function openLightbox(idx){
  lbIndex = idx;
  showLbItem();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}

function showLbItem(){
  const p = filteredCache[lbIndex];
  if(!p) return;
  const img = document.getElementById('lb-img');
  if(p.src){
    img.src = p.src;
    img.style.display='block';
  } else {
    img.style.display='none';
  }
  document.getElementById('lb-caption').innerHTML =
    `<strong>${p.label}</strong><br>
     <span style="font-size:11px;">${new Date(p.added).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</span>
     &nbsp;·&nbsp;
     <span style="cursor:pointer;" onclick="toggleFav()" title="Toggle favourite">
       ${p.fav ? '❤️ Saved' : '🤍 Save'}
     </span>`;
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}

function lbPrev(){
  if(filteredCache.length===0) return;
  lbIndex = (lbIndex - 1 + filteredCache.length) % filteredCache.length;
  showLbItem();
}
function lbNext(){
  if(filteredCache.length===0) return;
  lbIndex = (lbIndex + 1) % filteredCache.length;
  showLbItem();
}

function toggleFav(){
  const p = filteredCache[lbIndex];
  if(!p) return;
  const real = photos.find(x=>x.id===p.id);
  if(real){
    real.fav = !real.fav;
    p.fav = real.fav;
    savePhotos();
    renderGrid();
    showLbItem();
    showToast(real.fav ? 'Added to favourites ❤️' : 'Removed from favourites');
  }
}

/* ══════════════════════════════
   MEMORY
══════════════════════════════ */
function showMemory(){
  const favs = photos.filter(p=>p.fav||p.emoji);
  if(!favs.length){ showToast('No memories yet — add some photos!'); return; }
  const pick = favs[Math.floor(Math.random()*favs.length)];
  const idx = filteredCache.findIndex(p=>p.id===pick.id);
  if(idx>=0){ openLightbox(idx); return; }
  // switch to all and open
  currentFilter='all';
  document.querySelectorAll('.filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  renderGrid();
  const newIdx = filteredCache.findIndex(p=>p.id===pick.id);
  if(newIdx>=0) openLightbox(newIdx);
}

/* ══════════════════════════════
   TOAST
══════════════════════════════ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ══════════════════════════════
   KEYBOARD
══════════════════════════════ */
document.addEventListener('keydown', e=>{
  const lb = document.getElementById('lightbox');
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lbPrev();
  if(e.key==='ArrowRight') lbNext();
});

/* ══════════════════════════════
   SWIPE
══════════════════════════════ */
let tsX=0;
document.getElementById('lightbox').addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;},{passive:true});
document.getElementById('lightbox').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsX;
  if(Math.abs(dx)>50){ dx<0?lbNext():lbPrev(); }
});

/* ══════════════════════════════
   DRAG & DROP on upload area
══════════════════════════════ */
const ua = document.getElementById('upload-area');
ua.addEventListener('dragover',e=>{e.preventDefault();ua.style.borderColor='rgba(192,38,211,.7)';});
ua.addEventListener('dragleave',()=>{ua.style.borderColor='';});
ua.addEventListener('drop',e=>{
  e.preventDefault();ua.style.borderColor='';
  const dt={target:{files:e.dataTransfer.files,value:''}};
  handleUpload(dt);
});

function goBack(){
  window.location.href='index.html';
}

/* ── GO ── */
init();
</script>
</body>
</html>
