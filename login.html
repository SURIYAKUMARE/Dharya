<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dharya — Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700;1,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif}

    /* ══════════════════════════════
       BODY & DEEP SPACE BG
    ══════════════════════════════ */
    body{
      background:#07030f;
      display:flex;align-items:center;justify-content:center;
      position:relative;
      transition:background 1.4s ease;
    }
    body.th-green{background:#030d07;}
    body.th-pink {background:#0d0310;}

    /* nebula layers */
    #nebula{
      position:fixed;inset:0;z-index:0;
      pointer-events:none;overflow:hidden;
      transition:opacity 1.4s;
    }
    .neb{
      position:absolute;border-radius:50%;filter:blur(110px);
      animation:nebdrift var(--nd,22s) var(--ndl,0s) ease-in-out infinite alternate;
      transition:background 1.4s;
    }
    @keyframes nebdrift{
      0%  {transform:translate(0,0) scale(1);}
      50% {transform:translate(var(--nx,40px),var(--ny,-30px)) scale(1.08);}
      100%{transform:translate(calc(var(--nx,40px)*-.5),var(--ny,-30px)) scale(.96);}
    }

    /* ══════════════════════════════
       STAR CANVAS
    ══════════════════════════════ */
    #starfield{position:fixed;inset:0;z-index:1;pointer-events:none;}

    /* ══════════════════════════════
       SHOOTING STARS  ← cinematic
    ══════════════════════════════ */
    #shoots{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}

    .shoot{
      position:absolute;
      height:var(--sh,2px);
      border-radius:999px;
      transform-origin:right center;
      opacity:0;
      animation:shootfly var(--sd,1.2s) var(--sl,0s) cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes shootfly{
      0%  {opacity:0;  transform:rotate(var(--sa,-28deg)) translateX(0) scaleX(0);}
      5%  {opacity:1;  transform:rotate(var(--sa,-28deg)) translateX(0) scaleX(1);}
      80% {opacity:.9;}
      100%{opacity:0;  transform:rotate(var(--sa,-28deg)) translateX(var(--st,700px)) scaleX(.3);}
    }
    /* comet head glow */
    .shoot::after{
      content:'';position:absolute;right:0;top:50%;
      transform:translateY(-50%);
      width:6px;height:6px;border-radius:50%;
      background:var(--sc,#fff);
      box-shadow:0 0 10px 4px var(--sc,#fff),0 0 20px 6px var(--sc,rgba(255,255,255,.4));
    }

    /* ══════════════════════════════
       FLOATING EMOJI STARS
    ══════════════════════════════ */
    .fstar{
      position:fixed;pointer-events:none;z-index:2;user-select:none;
      font-size:var(--fs,1rem);opacity:var(--fo,.18);
      filter:drop-shadow(0 0 6px var(--fc,rgba(255,200,100,.5)));
      animation:fstf var(--ff,9s) var(--fd,0s) ease-in-out infinite alternate;
    }
    @keyframes fstf{
      from{transform:translateY(0) rotate(-10deg) scale(1);}
      to  {transform:translateY(-24px) rotate(12deg) scale(1.1);}
    }

    /* ══════════════════════════════
       CURSOR SPARKS
    ══════════════════════════════ */
    .spark{
      position:fixed;border-radius:50%;pointer-events:none;z-index:500;
      animation:spkout .8s ease-out forwards;
    }
    @keyframes spkout{
      0%  {transform:scale(1.2) translate(-50%,-50%);opacity:1;}
      100%{transform:scale(0)   translate(-50%,-50%);opacity:0;}
    }

    /* ══════════════════════════════
       PHONE / CARD
    ══════════════════════════════ */
    .scene{position:relative;z-index:20;perspective:1600px;}

    .phone{
      width:370px;
      /* premium dark glass */
      background:
        linear-gradient(160deg,
          rgba(255,255,255,.07) 0%,
          rgba(255,255,255,.02) 40%,
          rgba(0,0,0,.35) 100%);
      border-radius:40px;
      border:1px solid rgba(255,255,255,.1);
      backdrop-filter:blur(40px) saturate(1.6);
      -webkit-backdrop-filter:blur(40px) saturate(1.6);
      padding:40px 34px 28px;
      display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;
      box-shadow:
        /* outer glow */
        0 0 0 1px rgba(255,255,255,.05),
        0 60px 140px rgba(0,0,0,.95),
        0 0 120px var(--card-glow,rgba(160,40,255,.12)),
        /* inner top highlight */
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(0,0,0,.6);
      animation:phonefloat 7s ease-in-out infinite;
      transition:box-shadow 1.2s,border-color 1.2s;
      will-change:transform;
    }
    body.th-green .phone{
      --card-glow:rgba(0,255,120,.1);
      border-color:rgba(0,255,120,.15);
    }
    body.th-pink .phone{
      --card-glow:rgba(255,50,180,.14);
      border-color:rgba(255,50,180,.18);
    }
    @keyframes phonefloat{
      0%,100%{transform:translateY(0)   rotateX(1.2deg) rotateY(0deg);}
      33%    {transform:translateY(-8px) rotateX(-.5deg) rotateY(.4deg);}
      66%    {transform:translateY(-12px)rotateX(.3deg)  rotateY(-.3deg);}
    }

    /* luxury shimmer sweep */
    .phone::after{
      content:'';position:absolute;inset:0;border-radius:40px;pointer-events:none;
      background:linear-gradient(
        118deg,
        transparent 20%,
        rgba(255,255,255,.04) 40%,
        rgba(255,255,255,.07) 50%,
        rgba(255,255,255,.04) 60%,
        transparent 80%
      );
      background-size:250% 100%;
      animation:luxshimmer 6s ease-in-out infinite;
    }
    @keyframes luxshimmer{
      0%  {background-position:250% 0;}
      100%{background-position:-250% 0;}
    }

    /* corner dots */
    .pdots{position:absolute;top:16px;right:18px;display:flex;gap:5px;z-index:2;}
    .pdots i{
      width:7px;height:7px;border-radius:50%;display:block;
      background:rgba(255,255,255,.18);
      transition:background .8s,box-shadow .8s;
    }
    .pdots i:last-child{
      background:var(--dot,rgba(255,80,180,.9));
      box-shadow:0 0 8px var(--dot,rgba(255,80,180,.7));
    }
    body.th-green .pdots i:last-child{--dot:rgba(0,255,120,.9);}
    body.th-pink  .pdots i:last-child{--dot:rgba(255,50,180,.9);}

    /* inner radial glow (behind icon) */
    .phone::before{
      content:'';position:absolute;top:-90px;left:50%;transform:translateX(-50%);
      width:280px;height:280px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,var(--inner-glow,rgba(180,60,255,.18)) 0%,transparent 68%);
      animation:iglow 5s ease-in-out infinite alternate;
      transition:background 1.2s;
    }
    body.th-green .phone::before{--inner-glow:rgba(0,255,120,.14);}
    body.th-pink  .phone::before{--inner-glow:rgba(255,50,200,.2);}
    @keyframes iglow{
      from{opacity:.5;transform:translateX(-50%) scale(1);}
      to  {opacity:1; transform:translateX(-50%) scale(1.2);}
    }

    /* ══════════════════════════════
       APP ICON — premium
    ══════════════════════════════ */
    .icon-wrap{
      position:relative;width:86px;height:86px;margin-bottom:18px;
    }
    .icon-bg{
      width:86px;height:86px;border-radius:24px;
      background:var(--icon-grad,linear-gradient(135deg,#ff4d8b 0%,#e040fb 100%));
      display:flex;align-items:center;justify-content:center;font-size:2.3rem;
      position:relative;z-index:2;
      box-shadow:
        0 12px 40px var(--icon-sh,rgba(255,60,180,.6)),
        0 2px 10px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.4),
        inset 0 -2px 0 rgba(0,0,0,.2);
      animation:iconbob 3.5s ease-in-out infinite;
      transition:background 1.2s,box-shadow 1.2s;
    }
    body.th-green .icon-bg{
      background:linear-gradient(135deg,#00e676 0%,#00bfa5 100%);
      box-shadow:0 12px 40px rgba(0,230,118,.6),0 2px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);
    }
    body.th-pink .icon-bg{
      background:linear-gradient(135deg,#ff4d8b 0%,#e040fb 100%);
      box-shadow:0 12px 40px rgba(255,60,180,.6),0 2px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);
    }
    @keyframes iconbob{
      0%,100%{transform:scale(1)    rotate(0deg)  translateY(0);}
      50%    {transform:scale(1.08) rotate(-4deg) translateY(-4px);}
    }

    /* spinning rings */
    .iringA{
      position:absolute;inset:-10px;border-radius:34px;
      border:1.5px solid var(--ra,rgba(255,80,180,.35));
      animation:iringcw 4s linear infinite;
      transition:border-color 1.2s;
    }
    .iringB{
      position:absolute;inset:-20px;border-radius:42px;
      border:1px dashed var(--rb,rgba(255,80,180,.18));
      animation:iringccw 7s linear infinite;
      transition:border-color 1.2s;
    }
    body.th-green .iringA{--ra:rgba(0,255,120,.4);}
    body.th-green .iringB{--rb:rgba(0,255,120,.2);}
    body.th-pink  .iringA{--ra:rgba(255,50,200,.45);}
    body.th-pink  .iringB{--rb:rgba(255,50,200,.22);}
    @keyframes iringcw  {to{transform:rotate(360deg);}}
    @keyframes iringccw {to{transform:rotate(-360deg);}}

    /* orbiting dot */
    .orb-dot{
      position:absolute;width:7px;height:7px;border-radius:50%;
      background:var(--od,rgba(255,80,180,.9));
      box-shadow:0 0 10px var(--od,rgba(255,80,180,.8));
      animation:orbdot var(--ot,4s) var(--otl,0s) linear infinite;
      transition:background .8s,box-shadow .8s;
    }
    body.th-green .orb-dot{--od:rgba(0,255,120,.95);}
    body.th-pink  .orb-dot{--od:rgba(255,80,200,.95);}
    @keyframes orbdot{
      0%  {transform:rotate(0deg)   translateX(50px) rotate(0deg);}
      100%{transform:rotate(360deg) translateX(50px) rotate(-360deg);}
    }

    /* ══════════════════════════════
       BADGE
    ══════════════════════════════ */
    .badge{
      display:flex;align-items:center;gap:9px;margin-bottom:12px;
      animation:badgein .9s cubic-bezier(.175,.885,.32,1.275) .1s both;
    }
    @keyframes badgein{from{opacity:0;transform:scale(.6) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .bline{
      width:28px;height:1px;
      background:linear-gradient(90deg,transparent,var(--acc,#e040fb));
      transition:background 1.2s;
    }
    .bline.r{background:linear-gradient(90deg,var(--acc,#e040fb),transparent);}
    body.th-green .bline  {background:linear-gradient(90deg,transparent,#00e676);}
    body.th-green .bline.r{background:linear-gradient(90deg,#00e676,transparent);}
    body.th-pink  .bline  {background:linear-gradient(90deg,transparent,#ff4d8b);}
    body.th-pink  .bline.r{background:linear-gradient(90deg,#ff4d8b,transparent);}
    .btxt{
      font-size:.58rem;font-weight:800;letter-spacing:.26em;text-transform:uppercase;
      color:var(--acc,#e040fb);transition:color 1.2s;
    }
    body.th-green .btxt{color:#00e676;}
    body.th-pink  .btxt{color:#ff4d8b;}
    .bdot{
      width:5px;height:5px;border-radius:50%;
      background:var(--acc,#e040fb);
      box-shadow:0 0 10px var(--acc,#e040fb),0 0 20px var(--acc,rgba(224,64,251,.4));
      animation:bdp 1.5s ease-in-out infinite alternate;
      transition:background 1.2s,box-shadow 1.2s;
    }
    body.th-green .bdot{background:#00e676;box-shadow:0 0 10px #00e676,0 0 20px rgba(0,230,118,.4);}
    body.th-pink  .bdot{background:#ff4d8b;box-shadow:0 0 10px #ff4d8b,0 0 20px rgba(255,77,139,.4);}
    @keyframes bdp{from{transform:scale(1);opacity:.5}to{transform:scale(2.2);opacity:1}}

    /* ══════════════════════════════
       TITLE  — premium serif
    ══════════════════════════════ */
    .ctitle{
      font-family:'Cormorant Garamond',Georgia,serif;
      font-style:italic;font-weight:800;
      font-size:2.15rem;line-height:1.18;
      text-align:center;color:#fff;
      margin-bottom:8px;
      text-shadow:0 2px 30px rgba(255,255,255,.12);
      letter-spacing:-.01em;
    }
    .ctitle-name{
      display:block;
      background:var(--name-grad,linear-gradient(135deg,#ff8cf8,#ff4d8b));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      filter:drop-shadow(0 0 16px var(--name-glow,rgba(255,80,200,.6)));
      animation:nameglow 2.5s ease-in-out infinite alternate;
      transition:filter 1.2s;
    }
    body.th-green .ctitle-name{
      background:linear-gradient(135deg,#a0ffcc,#00e676);
      -webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 0 16px rgba(0,230,118,.65));
    }
    body.th-pink .ctitle-name{
      background:linear-gradient(135deg,#ff8cf8,#ff4d8b);
      -webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 0 16px rgba(255,77,139,.65));
    }
    @keyframes nameglow{
      from{filter:drop-shadow(0 0 10px var(--name-glow,rgba(255,80,200,.4)));}
      to  {filter:drop-shadow(0 0 28px var(--name-glow,rgba(255,80,200,.9)));}
    }
    /* blinking cursor */
    .cur{
      display:inline-block;width:2.5px;height:.82em;
      background:currentColor;margin-left:2px;vertical-align:text-bottom;
      animation:curblink 1s step-end infinite;border-radius:1px;
    }
    @keyframes curblink{0%,100%{opacity:1}50%{opacity:0}}

    /* ══════════════════════════════
       SUBTITLE
    ══════════════════════════════ */
    .csub{
      font-size:.8rem;font-weight:400;
      color:rgba(255,255,255,.38);
      text-align:center;letter-spacing:.03em;
      margin-bottom:24px;min-height:1.3em;
      font-style:italic;
    }

    /* ══════════════════════════════
       DIVIDER  — gold line
    ══════════════════════════════ */
    .hdiv{
      width:100%;height:1px;margin-bottom:22px;
      background:linear-gradient(90deg,
        transparent,
        var(--div-col,rgba(200,100,255,.25)) 30%,
        var(--div-col,rgba(200,100,255,.25)) 70%,
        transparent);
      position:relative;transition:background 1.2s;
    }
    body.th-green .hdiv{--div-col:rgba(0,230,118,.22);}
    body.th-pink  .hdiv{--div-col:rgba(255,80,200,.25);}

    /* ══════════════════════════════
       INPUT FIELDS
    ══════════════════════════════ */
    .field{width:100%;margin-bottom:14px;position:relative;}
    .flbl{
      display:block;font-size:.6rem;font-weight:700;
      letter-spacing:.2em;text-transform:uppercase;
      color:rgba(255,255,255,.35);margin-bottom:8px;
      transition:color .4s,letter-spacing .3s;
    }
    .field:focus-within .flbl{letter-spacing:.28em;}
    body.th-green .field:focus-within .flbl{color:#00e676;}
    body.th-pink  .field:focus-within .flbl{color:#ff4d8b;}

    /* USERNAME — bright white */
    .fuid input{
      width:100%;padding:14px 18px;border-radius:14px;
      border:1.5px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.94);
      color:#160828;font-size:.96rem;
      font-family:'Inter',sans-serif;font-weight:600;
      outline:none;letter-spacing:.04em;
      transition:box-shadow .35s,border-color .3s,transform .2s,background .2s;
    }
    .fuid input::placeholder{color:rgba(80,50,110,.35);font-weight:400;}
    .fuid input:focus{
      background:#fff;transform:translateY(-1px);
      border-color:var(--acc,#e040fb);
      box-shadow:0 0 0 3px var(--focus-r,rgba(224,64,251,.2)),0 8px 24px rgba(200,60,255,.12);
    }
    body.th-green .fuid input:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.18),0 8px 24px rgba(0,200,100,.1);}
    body.th-pink  .fuid input:focus{border-color:#ff4d8b;box-shadow:0 0 0 3px rgba(255,77,139,.18),0 8px 24px rgba(255,0,150,.1);}

    /* PASSWORD — dark glass */
    .fpw input{
      width:100%;padding:14px 46px 14px 18px;border-radius:14px;
      border:1.5px solid rgba(255,255,255,.08);
      background:rgba(10,5,22,.75);
      color:#fff;font-size:.97rem;
      font-family:'Inter',sans-serif;font-weight:400;
      outline:none;letter-spacing:.1em;
      transition:box-shadow .35s,border-color .3s,transform .2s;
    }
    .fpw input::placeholder{color:rgba(255,255,255,.18);}
    .fpw input:focus{
      transform:translateY(-1px);
      border-color:var(--acc,#e040fb);
      box-shadow:0 0 0 3px var(--focus-r,rgba(224,64,251,.18)),0 8px 24px rgba(200,60,255,.1);
    }
    body.th-green .fpw input:focus{border-color:#00e676;box-shadow:0 0 0 3px rgba(0,230,118,.16);}
    body.th-pink  .fpw input:focus{border-color:#ff4d8b;box-shadow:0 0 0 3px rgba(255,77,139,.16);}

    /* eye toggle */
    .eye{
      position:absolute;right:14px;bottom:14px;
      background:none;border:none;cursor:pointer;
      font-size:1rem;color:rgba(255,255,255,.28);
      padding:0;line-height:1;transition:color .25s,transform .2s;
    }
    .eye:hover{color:rgba(255,255,255,.7);transform:scale(1.2);}

    /* ══════════════════════════════
       DETECTED BADGE
    ══════════════════════════════ */
    .detected{
      width:100%;font-size:.76rem;font-weight:700;
      display:none;align-items:center;gap:7px;
      margin-bottom:4px;margin-top:-4px;
      animation:detpop .45s cubic-bezier(.175,.885,.32,1.275);
    }
    .detected.on{display:flex;}
    @keyframes detpop{from{opacity:0;transform:scale(.75) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
    body.th-green .detected{color:#00e676;}
    body.th-pink  .detected{color:#ff4d8b;}
    .det-dot{
      width:9px;height:9px;border-radius:50%;flex-shrink:0;
      background:currentColor;box-shadow:0 0 10px currentColor;
      animation:detdotp 1.1s ease-in-out infinite alternate;
    }
    @keyframes detdotp{from{transform:scale(1)}to{transform:scale(1.8)}}

    /* ══════════════════════════════
       ENTER BUTTON — premium gradient
    ══════════════════════════════ */
    .ebtn{
      width:100%;padding:16px 22px;border:none;border-radius:16px;
      margin-top:12px;
      font-size:1rem;font-weight:700;font-family:'Inter',sans-serif;
      letter-spacing:.06em;cursor:pointer;
      position:relative;overflow:hidden;
      background:var(--btn-g,linear-gradient(90deg,#ff4d8b 0%,#c026d3 50%,#e040fb 100%));
      color:#fff;
      box-shadow:
        0 8px 32px var(--btn-sh,rgba(255,60,180,.5)),
        0 2px 8px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.2);
      transition:transform .22s,box-shadow .3s;
      display:flex;align-items:center;justify-content:center;gap:12px;
      animation:btnpulse 3.2s ease-in-out infinite;
    }
    body.th-green .ebtn{
      background:linear-gradient(90deg,#00e676 0%,#00bfa5 50%,#00c853 100%);
      box-shadow:0 8px 32px rgba(0,230,118,.5),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);
      animation:btnpulseG 3.2s ease-in-out infinite;
    }
    body.th-pink .ebtn{
      background:linear-gradient(90deg,#ff4d8b 0%,#c026d3 50%,#e040fb 100%);
      box-shadow:0 8px 32px rgba(255,60,180,.5),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);
      animation:btnpulseP 3.2s ease-in-out infinite;
    }
    @keyframes btnpulse {0%,100%{box-shadow:0 8px 32px rgba(255,60,180,.5), 0 2px 8px rgba(0,0,0,.4)}50%{box-shadow:0 14px 48px rgba(255,60,180,.75),0 2px 8px rgba(0,0,0,.4),0 0 0 6px rgba(255,60,180,.1)}}
    @keyframes btnpulseG{0%,100%{box-shadow:0 8px 32px rgba(0,230,118,.5),  0 2px 8px rgba(0,0,0,.4)}50%{box-shadow:0 14px 48px rgba(0,230,118,.75), 0 2px 8px rgba(0,0,0,.4),0 0 0 6px rgba(0,230,118,.1)}}
    @keyframes btnpulseP{0%,100%{box-shadow:0 8px 32px rgba(255,60,180,.5), 0 2px 8px rgba(0,0,0,.4)}50%{box-shadow:0 14px 48px rgba(255,60,180,.75),0 2px 8px rgba(0,0,0,.4),0 0 0 6px rgba(255,60,180,.1)}}
    .ebtn:hover{transform:translateY(-3px) scale(1.016);animation:none;}
    .ebtn:hover{box-shadow:0 18px 52px var(--btn-sh,rgba(255,60,180,.7)),0 4px 12px rgba(0,0,0,.5);}
    .ebtn:active{transform:scale(.98);}
    /* luxury shine */
    .ebtn::before{
      content:'';position:absolute;top:0;left:-90%;width:55%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
      transform:skewX(-20deg);animation:btnshine 4s ease-in-out infinite;
    }
    @keyframes btnshine{0%{left:-90%}30%,100%{left:150%;}}
    .btnarr{
      position:relative;z-index:1;font-size:1.1rem;
      animation:arrbounce 1.6s ease-in-out infinite;
    }
    @keyframes arrbounce{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
    .btntxt{position:relative;z-index:1;}

    /* ripple */
    .rip{
      position:absolute;border-radius:50%;background:rgba(255,255,255,.28);
      transform:scale(0);animation:ripa .65s linear;pointer-events:none;
    }
    @keyframes ripa{to{transform:scale(5);opacity:0;}}

    /* ══════════════════════════════
       MESSAGE
    ══════════════════════════════ */
    .msg{
      width:100%;font-size:.78rem;font-weight:600;border-radius:12px;
      padding:11px 16px;margin-top:10px;text-align:center;display:none;
      letter-spacing:.04em;
      animation:msgpop .4s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes msgpop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
    .msg.err{background:rgba(255,45,75,.13);border:1px solid rgba(255,45,75,.4);color:#ff7085;}
    .msg.ok {background:rgba(80,255,160,.08);border:1px solid rgba(80,255,160,.35);color:#80ffb0;}

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    .cfooter{
      margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:8px;
    }
    .ftxt{
      display:flex;align-items:center;gap:9px;
      color:rgba(255,255,255,.14);font-size:.6rem;
      letter-spacing:.1em;font-style:italic;
    }
    .ftxt span{width:18px;height:1px;background:rgba(255,255,255,.1);display:block;}
    .fdots{display:flex;gap:5px;}
    .fdots b{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.1);display:block;}
    .fdots b.a{
      background:var(--acc,#e040fb);
      box-shadow:0 0 6px var(--acc,#e040fb);
      transition:background .9s,box-shadow .9s;
    }
    body.th-green .fdots b.a{background:#00e676;box-shadow:0 0 6px #00e676;}
    body.th-pink  .fdots b.a{background:#ff4d8b;box-shadow:0 0 6px #ff4d8b;}

    /* ══════════════════════════════
       WELCOME OVERLAY
    ══════════════════════════════ */
    #ov{
      position:fixed;inset:0;z-index:400;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:16px;
      opacity:0;pointer-events:none;
      transition:opacity .8s,backdrop-filter .8s;
    }
    #ov.on{
      opacity:1;pointer-events:all;
      backdrop-filter:blur(20px) brightness(.38) saturate(1.8);
      -webkit-backdrop-filter:blur(20px) brightness(.38) saturate(1.8);
    }
    .ov-ico{font-size:4.5rem;animation:ovico 2.4s ease-in-out infinite;}
    @keyframes ovico{0%,100%{transform:rotate(-16deg) scale(1)}50%{transform:rotate(16deg) scale(1.28)}}
    .ov-l1{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;
      font-size:clamp(1.8rem,5vw,3.2rem);color:#fff;text-align:center;
      text-shadow:0 0 40px rgba(255,255,255,.3);
    }
    .ov-l2{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:800;
      font-size:clamp(2.4rem,7vw,4.8rem);text-align:center;
      background:var(--ov-grad,linear-gradient(135deg,#ff8cf8,#ff4d8b));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      filter:drop-shadow(0 0 40px var(--ov-glow,rgba(255,80,200,.8)));
      animation:ovglow 2s ease-in-out infinite alternate;min-height:1.2em;
    }
    body.th-green #ov .ov-l2{
      background:linear-gradient(135deg,#a0ffcc,#00e676);
      -webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 0 40px rgba(0,230,118,.8));
    }
    body.th-pink  #ov .ov-l2{
      background:linear-gradient(135deg,#ff8cf8,#ff4d8b);
      -webkit-background-clip:text;background-clip:text;
      filter:drop-shadow(0 0 40px rgba(255,80,200,.8));
    }
    @keyframes ovglow{from{filter:drop-shadow(0 0 20px rgba(255,80,200,.5))}to{filter:drop-shadow(0 0 60px rgba(255,80,200,1))}}
    .ov-sub{font-size:.9rem;color:rgba(255,255,255,.35);letter-spacing:.26em;text-transform:uppercase;}
    .ov-tap{font-size:.66rem;color:rgba(255,255,255,.15);letter-spacing:.16em;text-transform:uppercase;margin-top:4px;animation:otap 2.4s ease-in-out infinite;}
    @keyframes otap{0%,100%{opacity:.15}50%{opacity:.5}}

    /* ══════════════════════════════
       CONFETTI
    ══════════════════════════════ */
    .conf{
      position:fixed;pointer-events:none;z-index:300;
      animation:cfall var(--cd,2s) var(--cdl,0s) ease-out forwards;
    }
    @keyframes cfall{
      0%  {transform:translate(0,0) rotate(0) scale(1);opacity:1;}
      100%{transform:translate(var(--cx,0),130vh) rotate(900deg) scale(.08);opacity:0;}
    }

    @media(max-width:410px){.phone{width:95vw;padding:32px 18px 24px;}}
  </style>
</head>
<body>

  <!-- Nebula orbs -->
  <div id="nebula">
    <div class="neb" id="n1" style="width:480px;height:480px;top:-110px;left:-160px;opacity:.18;--nd:24s;--ndl:0s;--nx:50px;--ny:-40px;background:#2a0850;"></div>
    <div class="neb" id="n2" style="width:380px;height:380px;bottom:-80px;right:-120px;opacity:.14;--nd:18s;--ndl:6s;--nx:-40px;--ny:30px;background:#10043a;"></div>
    <div class="neb" id="n3" style="width:240px;height:240px;top:45%;left:68%;opacity:.1;--nd:13s;--ndl:3s;--nx:30px;--ny:50px;background:#1a0530;"></div>
  </div>

  <canvas id="starfield"></canvas>
  <div id="shoots"></div>

  <!-- Floating stars -->
  <div class="fstar" style="top:13%;left:6%;  --fs:1.5rem;--fo:.2; --ff:7s; --fd:0s;  --fc:rgba(255,180,255,.45);">★</div>
  <div class="fstar" style="top:54%;left:3%;  --fs:1.1rem;--fo:.15;--ff:9s; --fd:2s;  --fc:rgba(255,180,255,.3);">✦</div>
  <div class="fstar" style="top:77%;left:8%;  --fs:1.7rem;--fo:.17;--ff:6s; --fd:1s;  --fc:rgba(255,180,255,.35);">⭐</div>
  <div class="fstar" style="top:24%;right:6%; --fs:1.3rem;--fo:.2; --ff:8s; --fd:3s;  --fc:rgba(200,255,220,.3);">✦</div>
  <div class="fstar" style="top:63%;right:4%; --fs:1.5rem;--fo:.16;--ff:11s;--fd:.5s; --fc:rgba(255,180,255,.3);">★</div>
  <div class="fstar" style="top:41%;right:13%;--fs:.9rem; --fo:.12;--ff:5s; --fd:4s;  --fc:rgba(200,255,220,.28);">⭐</div>
  <div class="fstar" style="top:85%;right:14%;--fs:1.2rem;--fo:.17;--ff:7s; --fd:1.5s;--fc:rgba(255,180,255,.3);">✦</div>
  <div class="fstar" style="top:8%; left:42%; --fs:.8rem; --fo:.1; --ff:10s;--fd:2.5s;--fc:rgba(255,230,120,.4);">★</div>
  <div class="fstar" style="top:69%;left:19%; --fs:1rem;  --fo:.13;--ff:8s; --fd:5s;  --fc:rgba(200,255,220,.25);">✦</div>
  <div class="fstar" style="top:31%;right:26%;--fs:1.3rem;--fo:.11;--ff:12s;--fd:3.5s;--fc:rgba(255,180,255,.28);">⭐</div>

  <!-- Welcome overlay -->
  <div id="ov">
    <div class="ov-ico" id="ov-ico">✨</div>
    <div class="ov-l1">Welcome back,</div>
    <div class="ov-l2" id="ov-name"></div>
    <div class="ov-sub">Your world is ready ✦</div>
    <div class="ov-tap">tap anywhere to continue</div>
  </div>

  <!-- CARD -->
  <div class="scene">
    <div class="phone" id="phone">

      <div class="pdots"><i></i><i></i><i></i></div>

      <!-- Icon -->
      <div class="icon-wrap">
        <div class="iringB"></div>
        <div class="iringA"></div>
        <div class="icon-bg" id="icon-bg">🌿</div>
        <div class="orb-dot" style="--ot:4s;--otl:0s;"></div>
        <div class="orb-dot" style="--ot:4s;--otl:2s;"></div>
      </div>

      <!-- Badge -->
      <div class="badge">
        <div class="bdot"></div>
        <div class="bline"></div>
        <span class="btxt">Back Again</span>
        <div class="bline r"></div>
        <div class="bdot"></div>
      </div>

      <!-- Title -->
      <h1 class="ctitle">
        Welcome back,<br>
        <span class="ctitle-name">
          <span id="tname">Dharya</span><span class="cur"></span>
        </span>
      </h1>

      <p class="csub" id="csub">Your special world is waiting ✨</p>

      <div class="hdiv"></div>

      <!-- USERNAME -->
      <div class="field fuid">
        <label class="flbl">Username</label>
        <input type="text" id="uid" placeholder="Enter username"
               autocomplete="off" spellcheck="false" oninput="onUID(this.value)"/>
      </div>

      <!-- PASSWORD -->
      <div class="field fpw">
        <label class="flbl">Password</label>
        <input type="password" id="pw" placeholder="••••••••••"
               autocomplete="off" spellcheck="false" oninput="onPW(this.value)"/>
        <button class="eye" id="eye" onclick="togglePw()">👁</button>
      </div>

      <!-- Detected -->
      <div class="detected" id="detected">
        <div class="det-dot"></div>
        <span id="det-txt">Dharya detected ✓</span>
      </div>

      <button class="ebtn" id="btn" onclick="login()">
        <span class="btntxt">Enter my world</span>
        <span class="btnarr">→</span>
      </button>

      <div class="msg" id="msg"></div>

      <div class="cfooter">
        <div class="ftxt"><span></span>Only someone special knows the way in<span></span></div>
        <div class="fdots"><b></b><b class="a"></b><b></b></div>
      </div>
    </div>
  </div>

<script>
/* ══════════════════════
   USERS
══════════════════════ */
const U={
  dharya: {id:'DHARYA',pw:'09/10/2007',theme:'th-green',emoji:'🌿',name:'Surya',  sub:'Your private space is ready 🌿',  greet:'Surya'},
  sadhana:{id:'DHARYA',pw:'29/02/2008',theme:'th-pink', emoji:'❤️', name:'Sadhana',sub:'Your special world is waiting ✨',greet:'Sadhana'},
};
let who=null;

/* ══════════════════════
   STAR CANVAS
══════════════════════ */
const sc=document.getElementById('starfield'),sx=sc.getContext('2d');
let sw,sh;
const resize=()=>{sw=sc.width=innerWidth;sh=sc.height=innerHeight;};
resize(); addEventListener('resize',resize);

const STARS=Array.from({length:340},()=>({
  x:Math.random(),y:Math.random(),
  r:Math.random()*2.4+.2,
  a:Math.random(),
  da:(Math.random()*.008+.002)*(Math.random()>.5?1:-1),
  base:Math.random()*.45+.04,
  hue:Math.random()>0.8?(Math.random()>0.5?300:140):0,
}));
function drawStars(){
  sx.clearRect(0,0,sw,sh);
  STARS.forEach(s=>{
    s.a+=s.da; if(s.a>1||s.a<0)s.da*=-1;
    const a=(s.base*Math.abs(s.a)).toFixed(3);
    sx.beginPath();
    sx.arc(s.x*sw,s.y*sh,s.r,0,Math.PI*2);
    sx.fillStyle=s.hue
      ?`hsla(${s.hue},80%,75%,${a})`
      :`rgba(255,255,255,${a})`;
    sx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

/* ══════════════════════
   SHOOTING STARS  ← cinematic, multi-size
══════════════════════ */
const sl=document.getElementById('shoots');
function spawnShoot(forced){
  const el=document.createElement('div');
  el.className='shoot';
  const big=Math.random()>.65;
  const len =big ? Math.random()*350+150 : Math.random()*200+60;
  const h   =big ? Math.random()*1.5+1.5 : Math.random()*1+0.8;
  const travel=Math.random()*650+400;
  const dur=(Math.random()*1.2+(big?.8:.5)).toFixed(2);
  const delay=forced?0:(Math.random()*5).toFixed(2);
  const angle=-(Math.random()*30+8);

  // colour by theme
  let core,glow;
  if(who==='dharya')       {core='rgba(120,255,190,.95)';glow='rgba(0,255,130,.6)';}
  else if(who==='sadhana') {core='rgba(255,110,210,.95)';glow='rgba(255,60,200,.55)';}
  else                     {core='rgba(255,255,255,.92)';glow='rgba(200,180,255,.45)';}

  el.style.cssText=`
    width:${len}px;
    top:${Math.random()*75}%;
    left:${Math.random()*82}%;
    --sh:${h}px;
    --sa:${angle}deg;
    --st:${travel}px;
    --sd:${dur}s;
    --sl:${delay}s;
    --sc:${core};
    background:linear-gradient(90deg,transparent 0%,${core.replace('.95',',.3')} 20%,${core} 100%);
    box-shadow:0 0 ${big?12:7}px ${big?4:2}px ${glow};
  `;
  sl.appendChild(el);
  setTimeout(()=>el.remove(),(parseFloat(dur)+parseFloat(delay))*1000+600);
}
// base rhythm + burst function
(function sloop(){
  spawnShoot(false);
  setTimeout(sloop, Math.random()*600+150);
})();

function shootBurst(n=10){
  for(let i=0;i<n;i++) setTimeout(()=>spawnShoot(true),i*60);
}

/* ══════════════════════
   3D TILT + PARALLAX
══════════════════════ */
const phone=document.getElementById('phone');
addEventListener('mousemove',e=>{
  const dx=(e.clientX-innerWidth/2)/(innerWidth/2);
  const dy=(e.clientY-innerHeight/2)/(innerHeight/2);
  phone.style.animation='none';
  phone.style.transform=`rotateX(${-dy*8}deg) rotateY(${dx*8}deg) translateZ(16px)`;
  // nebula parallax
  document.getElementById('n1').style.transform=`translate(${-dx*18}px,${-dy*14}px)`;
  document.getElementById('n2').style.transform=`translate(${dx*12}px,${dy*10}px)`;
});
addEventListener('mouseleave',()=>{
  phone.style.transition='transform 1s ease';
  phone.style.transform='';
  setTimeout(()=>{
    phone.style.animation='phonefloat 7s ease-in-out infinite';
    phone.style.transition='';
  },1050);
});

/* ══════════════════════
   CURSOR SPARKS
══════════════════════ */
addEventListener('mousemove',e=>{
  if(Math.random()>.25)return;
  const sp=document.createElement('div'); sp.className='spark';
  const c=who==='dharya'
    ?`rgba(${80+~~(Math.random()*80)},255,${140+~~(Math.random()*80)},.88)`
    :who==='sadhana'
    ?`rgba(255,${60+~~(Math.random()*80)},${180+~~(Math.random()*60)},.88)`
    :`rgba(255,255,255,.5)`;
  const sz=Math.random()*6+3;
  sp.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX}px;top:${e.clientY}px;background:${c};box-shadow:0 0 10px ${c};`;
  document.body.appendChild(sp);
  setTimeout(()=>sp.remove(),850);
});

/* ══════════════════════
   THEME
══════════════════════ */
function applyTheme(key){
  if(who===key)return;
  who=key;
  const u=U[key];
  document.body.className=u.theme;

  document.getElementById('icon-bg').textContent=u.emoji;

  // typewrite name
  const tn=document.getElementById('tname');
  tn.textContent='';let i=0;
  (function tw(){if(i<=u.name.length){tn.textContent=u.name.slice(0,i++);setTimeout(tw,55);}})();

  document.getElementById('csub').textContent=u.sub;

  const det=document.getElementById('detected');
  document.getElementById('det-txt').textContent=u.name+' detected ✓';
  det.className='detected on';

  shootBurst(10);
  screenFlash(u.theme);
}

function resetTheme(){
  who=null;
  document.body.className='';
  document.getElementById('icon-bg').textContent='🌿';
  document.getElementById('tname').textContent='Dharya';
  document.getElementById('csub').textContent='Your special world is waiting ✨';
  document.getElementById('detected').className='detected';
}

function screenFlash(th){
  const f=document.createElement('div');
  const c=th==='th-green'?'rgba(0,230,118,.07)':'rgba(255,60,180,.08)';
  f.style.cssText=`position:fixed;inset:0;z-index:9999;pointer-events:none;background:${c};animation:fout .7s ease-out forwards;`;
  const s=document.createElement('style');s.textContent='@keyframes fout{from{opacity:1}to{opacity:0}}';
  document.head.appendChild(s);document.body.appendChild(f);
  setTimeout(()=>{f.remove();s.remove();},800);
}

/* ══════════════════════
   INPUT HANDLERS
══════════════════════ */
function onUID(val){
  clearMsg();
  const pw=document.getElementById('pw').value.trim();
  if(pw)onPW(pw);
}

function onPW(val){
  clearMsg();
  if(!val){resetTheme();return;}
  // full password match only
  const m=Object.entries(U).find(([,u])=>u.pw===val);
  if(m){applyTheme(m[0]);return;}
  // partial — keep current or reset if completely off
  const pG=U.dharya.pw.startsWith(val);
  const pP=U.sadhana.pw.startsWith(val);
  if(!pG&&!pP)resetTheme();
}

/* ══════════════════════
   TOGGLE PW
══════════════════════ */
let pvis=false;
function togglePw(){
  const i=document.getElementById('pw');
  pvis=!pvis;i.type=pvis?'text':'password';
  document.getElementById('eye').textContent=pvis?'🙈':'👁';
}

/* ══════════════════════
   LOGIN
══════════════════════ */
function login(){
  const uid=document.getElementById('uid').value.trim().toUpperCase();
  const pw =document.getElementById('pw').value.trim();
  const btn=document.getElementById('btn');
  if(!pw){showMsg('Please enter your password ✦','err');shake();return;}
  const m=Object.entries(U).find(([,u])=>u.pw===pw);
  if(!m){showMsg('Incorrect password ✦','err');shake();return;}
  if(uid&&uid!==m[1].id){showMsg('Username does not match ✦','err');shake();return;}
  const [key,u]=m;
  applyTheme(key);
  btn.innerHTML='<span class="btntxt">Entering…</span><span class="btnarr">✦</span>';
  btn.style.pointerEvents='none';
  ripBtn(btn);
  showMsg(u.greet+' — your world awaits '+u.emoji,'ok');
  confBurst(u.theme==='th-green'
    ?['#00e676','#a0ffcc','#00bfa5','#fff']
    :['#ff4d8b','#ff8cf8','#e040fb','#fff']);
  shootBurst(20);
  setTimeout(()=>showWelcome(u.greet,u.emoji,u.theme),1100);
}

/* ══════════════════════
   HELPERS
══════════════════════ */
function showMsg(t,c){const b=document.getElementById('msg');b.textContent=t;b.className='msg '+c;b.style.display='block';}
function clearMsg(){document.getElementById('msg').style.display='none';}

function shake(){
  phone.style.animation='none';
  [[-14,0],[14,68],[-8,136],[8,204],[0,272]].forEach(([x,t])=>
    setTimeout(()=>phone.style.transform=`translateX(${x}px)`,t));
  setTimeout(()=>{phone.style.transform='';phone.style.animation='phonefloat 7s ease-in-out infinite';},360);
}

function ripBtn(btn){
  const r=document.createElement('span');r.className='rip';
  r.style.cssText='width:260px;height:260px;top:calc(50% - 130px);left:calc(50% - 130px);';
  btn.appendChild(r);setTimeout(()=>r.remove(),750);
}

function confBurst(cols){
  for(let i=0;i<95;i++){
    const p=document.createElement('div');p.className='conf';
    const sz=Math.random()*13+3;
    const c=cols[~~(Math.random()*cols.length)];
    p.style.cssText=`width:${sz}px;height:${sz}px;
      left:${10+Math.random()*80}%;top:${8+Math.random()*50}%;
      background:${c};box-shadow:0 0 ${sz}px ${c};
      --cd:${(Math.random()*2.2+.7).toFixed(2)}s;
      --cdl:${(Math.random()*.55).toFixed(2)}s;
      --cx:${(Math.random()*360-180).toFixed(0)}px;
      border-radius:${Math.random()>.3?'50%':'4px'};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),4000);
  }
}

function showWelcome(name,emoji,theme){
  const ov=document.getElementById('ov');
  const on=document.getElementById('ov-name');
  document.getElementById('ov-ico').textContent=emoji;
  ov.style.background=theme==='th-green'?'rgba(0,8,3,.5)':'rgba(10,0,8,.5)';
  ov.classList.add('on');
  on.textContent='';let i=0;
  (function tw(){if(i<=name.length){on.textContent=name.slice(0,i++);setTimeout(tw,70);}})();
  shootBurst(30);
  confBurst(theme==='th-green'?['#00e676','#a0ffcc','#fff']:['#ff4d8b','#ff8cf8','#fff']);
}

addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('ov').addEventListener('click',()=>{
  document.getElementById('ov').classList.remove('on');
  const b=document.getElementById('btn');
  b.innerHTML='<span class="btntxt">Enter my world</span><span class="btnarr">→</span>';
  b.style.pointerEvents='';
  document.getElementById('uid').value='';
  document.getElementById('pw').value='';
  pvis=false;document.getElementById('pw').type='password';
  document.getElementById('eye').textContent='👁';
  document.getElementById('detected').className='detected';
  resetTheme();clearMsg();
});
</script>
</body>
</html>
