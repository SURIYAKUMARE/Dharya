name: Build Dhanya Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: studychat/package.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          cd studychat
          npm install

      - name: Build Web Application
        run: |
          cd studychat
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd studychat
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x studychat/android/gradlew

      - name: Build APK with Gradle
        run: |
          cd studychat/android
          ./gradlew assembleDebug --no-daemon

      - name: Collect Generated APK
        run: |
          mkdir -p apk-output
          cp studychat/android/app/build/outputs/apk/debug/app-debug.apk apk-output/Dhanya.apk
          echo "APK successfully built: $(ls -lh apk-output/Dhanya.apk)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dhanya-APK
          path: apk-output/Dhanya.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: Dhanya Android App (v1.0.0)
          body: |
            ## 📱 Dhanya Navigation — Official Android App
            
            Install the native Android app on your phone to access Dhanya Navigation:
            - **App Name:** Dhanya
            - **Package:** `com.dhanya.navigation`
            - **Features:** Private Chat, Real-Time Status (Photos, Videos, Melodies, Vinyl Visualizer), Photo Gallery, Timeline
            - **Direct Download:** Download `Dhanya.apk` below and open it on your phone.
          files: apk-output/Dhanya.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
